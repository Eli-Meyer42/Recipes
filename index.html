// ---------- Method view persistence (per recipe) ----------
// Stores { view: 'guided'|'quick'|'original', lastStyle: 'guided'|'quick' }
function loadMethodView(recipeId) {
  try {
    const v = localStorage.getItem('recipes_method_view_' + recipeId);
    if (!v) return null;
    const parsed = JSON.parse(v);
    const valid = (p) => ['guided', 'quick'].indexOf(p) >= 0;
    const view = ['guided', 'quick', 'original'].indexOf(parsed.view) >= 0 ? parsed.view : 'guided';
    const lastStyle = valid(parsed.lastStyle) ? parsed.lastStyle : 'guided';
    return { view, lastStyle };
  } catch (e) { return null; }
}

function saveMethodView(recipeId, view, lastStyle) {
  try {
    localStorage.setItem('recipes_method_view_' + recipeId, JSON.stringify({ view, lastStyle }));
  } catch (e) {}
}

// ---------- Oven temperature extraction ----------
const TEMP_REGEX = /(\d{2,3})\s*(?:\u00B0|\u00BA|degrees?)\s*(F\b|Fahrenheit\b|C\b|Celsius\b)?/gi;

function extractOvenTemps(steps) {
  const seen = new Set();
  const result = [];
  for (const step of (steps || [])) {
    if (!step) continue;
    TEMP_REGEX.lastIndex = 0;
    let m;
    while ((m = TEMP_REGEX.exec(step)) !== null) {
      const value = m[1];
      const unitHint = (m[2] || '').toLowerCase();
      let unit = 'F';
      if (unitHint.startsWith('c')) unit = 'C';
      const normalized = value + '\u00B0' + unit;
      if (!seen.has(normalized)) { seen.add(normalized); result.push(normalized); }
    }
  }
  return result;
}

function stripOvenTempFromStep(step) {
  // Intentionally a no-op. Stripping the temp line broke too many steps —
  // either left a dangling "(163°C)" or, when the temp was the lead sentence
  // ("Set oven to 450°F. Leave the baking sheet OUT…"), left the step starting
  // mid-thought. The oven-temp header above the method acts as the glanceable
  // summary; if a step also mentions the temp, the slight repetition is fine.
  return step || '';
}

// ---------- Equipment extraction ----------
const EQUIPMENT_TERMS = [
  // multi-word (longer first wins via sort)
  'rimmed baking sheet', 'baking sheet', 'sheet pan', 'baking dish', 'casserole dish',
  'pie dish', 'pie plate', 'loaf pan', 'springform pan', 'tube pan', 'bundt pan',
  'roasting pan', 'frying pan', 'saut\u00e9 pan', 'saute pan', 'grill pan', 'griddle pan',
  'dutch oven', 'pressure cooker', 'slow cooker', 'instant pot', 'rice cooker',
  'cast-iron skillet', 'cast iron skillet', 'nonstick skillet', 'non-stick skillet',
  'stand mixer', 'hand mixer', 'electric mixer', 'food processor',
  'mixing bowl', 'mixing bowls', 'measuring cup', 'measuring cups',
  'measuring spoon', 'measuring spoons',
  'wooden spoon', 'slotted spoon', 'pastry brush', 'rolling pin',
  'cutting board', 'parchment paper', 'aluminum foil', 'plastic wrap',
  'chef knife', 'chef\u2019s knife', 'paring knife', 'serrated knife',
  // single-word
  'skillet', 'saucepan', 'stockpot', 'pot', 'pan', 'wok', 'griddle',
  'colander', 'strainer', 'sieve', 'whisk', 'spatula', 'tongs', 'ladle',
  'knife', 'blender', 'grater', 'zester', 'peeler', 'thermometer',
  'foil', 'parchment'
];

const EQUIPMENT_QUALIFIER_WORDS = new Set([
  'small', 'medium', 'large', 'big', 'huge', 'wide', 'narrow', 'deep', 'shallow',
  'rimmed', 'nonstick', 'non-stick', 'heavy', 'heavy-bottomed', 'flat',
  'cast-iron', 'stainless', 'ceramic', 'glass', 'metal', 'wooden', 'oven-safe', 'ovenproof'
]);

const EQUIPMENT_STOP_WORDS = new Set([
  'a', 'an', 'the', 'in', 'on', 'into', 'onto', 'with', 'over', 'under',
  'at', 'to', 'your', 'my', 'his', 'her', 'their', 'our', 'and', 'or', 'but',
  'using', 'use', 'used', 'add', 'place', 'put', 'set', 'heat', 'pour', 'transfer',
  'cook', 'stir', 'beat', 'whisk', 'mix', 'combine', 'reduce', 'bring', 'from'
]);

function equipmentTermToRegex(term) {
  const escaped = escapeRegex(term).replace(/\s+/g, '\\s+');
  return new RegExp('\\b' + escaped + '\\b', 'gi');
}

function extractEquipmentQualifier(textBefore) {
  const tokens = textBefore.trim().split(/\s+/);
  const collected = [];
  for (let i = tokens.length - 1; i >= 0 && collected.length < 3; i--) {
    const raw = tokens[i];
    const cleaned = raw.replace(/^[^\w\d\u00D7\u2013\u2014-]+|[^\w\d\u00D7\u2013\u2014-]+$/g, '');
    const lower = cleaned.toLowerCase();
    if (!cleaned) break;
    if (EQUIPMENT_STOP_WORDS.has(lower)) break;
    if (EQUIPMENT_QUALIFIER_WORDS.has(lower)) {
      collected.unshift(lower);
    } else if (/^\d+[-\s]?(?:inch|in|cm|mm|qt|quart)?$/i.test(cleaned)) {
      collected.unshift(cleaned);
    } else if (/^\d+\s*[x\u00D7]\s*\d+$/i.test(cleaned)) {
      collected.unshift(cleaned);
    } else if (cleaned.includes('-') && /^[a-z][a-z-]+$/i.test(cleaned) && !EQUIPMENT_STOP_WORDS.has(lower)) {
      collected.unshift(lower);
    } else {
      break;
    }
  }
  return collected.join(' ');
}

function extractEquipmentFromSteps(steps) {
  const fullText = (steps || []).join(' \u00B6 ');
  if (!fullText) return [];
  const matchedRanges = [];
  const result = new Map(); // base term key → display phrase

  const sorted = [...EQUIPMENT_TERMS].sort((a, b) => b.length - a.length);
  for (const term of sorted) {
    const re = equipmentTermToRegex(term);
    let m;
    while ((m = re.exec(fullText)) !== null) {
      const start = m.index;
      const end = m.index + m[0].length;
      if (matchedRanges.some(r => start < r.end && end > r.start)) continue;
      matchedRanges.push({ start, end });

      const before = fullText.slice(Math.max(0, start - 60), start);
      const qualifier = extractEquipmentQualifier(before);
      const phrase = qualifier ? qualifier + ' ' + m[0].toLowerCase() : m[0].toLowerCase();
      const key = term.toLowerCase();
      const existing = result.get(key);
      if (!existing || existing.split(/\s+/).length < phrase.split(/\s+/).length) {
        result.set(key, phrase);
      }
    }
  }
  return [...result.values()];
}


// ---------- App ----------
function App() {
  const [recipes, setRecipesState] = useState([]);
  const [collections, setCollectionsState] = useState([]);
  const [pantry, setPantryState] = useState([]);
  const [gotos, setGotosState] = useState([]);
  const [scales, setScales] = useState({}); // recipeId -> scale multiplier (view-only, session-only)
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState({ name: 'list' });
  const [search, setSearch] = useState('');
  // True when this copy of the app opened with no saved recipes — used to offer a
  // one-tap "bring your data over" prompt on a freshly downloaded version.
  const [freshInstall, setFreshInstall] = useState(false);
  // Source of truth for "latest recipes right now" — updated synchronously by every
  // mutation. The React state is for rendering; the ref is what mutations read from and
  // what guarantees the next mutation sees the previous one's result, even when they fire
  // in the same tick (e.g. batch import).
  const recipesRef = useRef([]);
  const collectionsRef = useRef([]);
  const pantryRef = useRef([]);
  const gotosRef = useRef([]);

  useEffect(() => {
    const stored = loadRecipes();
    const initial = stored || SEED_RECIPES;
    recipesRef.current = initial;
    setRecipesState(initial);
    if (!stored) { saveRecipes(SEED_RECIPES); setFreshInstall(true); }
    const cols = loadCollections();
    collectionsRef.current = cols;
    setCollectionsState(cols);
    const pan = loadPantry();
    pantryRef.current = pan;
    setPantryState(pan);
    const storedGotos = loadGotos();
    const g = storedGotos || GOTOS_SEED;
    gotosRef.current = g;
    setGotosState(g);
    if (!storedGotos) saveGotos(GOTOS_SEED); // seed the index on first run
    setLoading(false);
  }, []);

  // Every mutation:
  //   1. reads the latest data from the ref (never stale)
  //   2. updates the ref synchronously
  //   3. writes localStorage synchronously (so the data is persisted before this call returns)
  //   4. schedules a UI re-render via setState
  const mutateRecipes = (fn) => {
    const next = fn(recipesRef.current);
    recipesRef.current = next;
    saveRecipes(next);
    setRecipesState(next);
  };

  const mutateCollections = (fn) => {
    const next = fn(collectionsRef.current);
    collectionsRef.current = next;
    saveCollections(next);
    setCollectionsState(next);
  };

  const mutatePantry = (fn) => {
    const next = fn(pantryRef.current);
    pantryRef.current = next;
    savePantry(next);
    setPantryState(next);
  };

  const mutateGotos = (fn) => {
    const next = fn(gotosRef.current);
    gotosRef.current = next;
    saveGotos(next);
    setGotosState(next);
  };

  // Go-to meal index actions.
  const addGotoItem = (sectionId, name, detail) => {
    const nm = (name || '').trim();
    if (!nm) return;
    mutateGotos(prev => prev.map(s => s.id === sectionId
      ? { ...s, items: [...s.items, { id: newId(), name: nm, detail: (detail || '').trim() }] }
      : s));
  };
  const removeGotoItem = (sectionId, itemId) => {
    mutateGotos(prev => prev.map(s => s.id === sectionId
      ? { ...s, items: s.items.filter(i => i.id !== itemId) }
      : s));
  };
  const updateGotoItem = (sectionId, itemId, name, detail) => {
    const nm = (name || '').trim();
    if (!nm) return;
    mutateGotos(prev => prev.map(s => s.id === sectionId
      ? { ...s, items: s.items.map(i => i.id === itemId ? { ...i, name: nm, detail: (detail || '').trim() } : i) }
      : s));
  };
  const addGotoSection = (name) => {
    const nm = (name || '').trim();
    if (!nm) return;
    mutateGotos(prev => [...prev, { id: newId(), name: nm, items: [] }]);
  };
  const removeGotoSection = (sectionId) => {
    mutateGotos(prev => prev.filter(s => s.id !== sectionId));
  };

  // Re-read everything from storage into the live UI — used after a restore replaces
  // or merges the saved data underneath us.
  const reloadFromStorage = () => {
    const r = loadRecipes() || [];
    recipesRef.current = r; setRecipesState(r);
    const c = loadCollections(); collectionsRef.current = c; setCollectionsState(c);
    const p = loadPantry(); pantryRef.current = p; setPantryState(p);
    const g = loadGotos() || GOTOS_SEED; gotosRef.current = g; setGotosState(g);
    setFreshInstall(false);
  };

  // Connect cloud sync once: remote updates re-read storage into the UI; flush on hide.
  useEffect(() => {
    RecipeSync.setOnRemote(() => reloadFromStorage());
    RecipeSync.init();
    const onVis = () => { if (document.visibilityState === 'hidden') RecipeSync.flush(); };
    const onHide = () => RecipeSync.flush();
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onHide);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('pagehide', onHide);
    };
  }, []);

  const addPantryItem = (name, category) => {
    const trimmed = (name || '').trim();
    if (!trimmed) return null;
    // Skip duplicates: same normalized core counts as the same staple.
    const newCore = pantryCore(trimmed);
    if (!newCore) return null;
    const existing = pantryRef.current.find(p => pantryCore(p.name) === newCore);
    if (existing) return existing.id;
    const id = newId();
    mutatePantry(prev => [...prev, { id, name: trimmed, category: category || 'spices', addedAt: Date.now() }]);
    return id;
  };

  const removePantryItem = (id) => {
    mutatePantry(prev => prev.filter(p => p.id !== id));
  };

  const createCollection = (name, description) => {
    const id = newId();
    mutateCollections(prev => [...prev, { id, name: (name || '').trim() || 'Untitled collection', description: (description || '').trim(), createdAt: Date.now() }]);
    return id;
  };

  const updateCollection = (id, fields) => {
    mutateCollections(prev => prev.map(c => c.id === id ? {
      ...c,
      name: fields.name != null ? (fields.name.trim() || c.name) : c.name,
      description: fields.description != null ? fields.description.trim() : c.description,
    } : c));
  };

  // Removing a collection strips its id from every recipe's membership, but keeps the recipes.
  const deleteCollection = (id) => {
    mutateCollections(prev => prev.filter(c => c.id !== id));
    mutateRecipes(prev => prev.map(r => {
      const ids = recipeCollectionIds(r);
      if (!ids.includes(id)) return r;
      return { ...r, collections: ids.filter(x => x !== id) };
    }));
  };

  // Toggle one recipe's membership in one collection.
  const toggleRecipeCollection = (recipeId, collectionId) => {
    mutateRecipes(prev => prev.map(r => {
      if (r.id !== recipeId) return r;
      const ids = recipeCollectionIds(r);
      return { ...r, collections: ids.includes(collectionId) ? ids.filter(x => x !== collectionId) : [...ids, collectionId] };
    }));
  };

  const upsertRecipe = (recipe) => {
    const stamped = { ...recipe, updatedAt: Date.now() };
    mutateRecipes(prev => {
      const exists = prev.some(r => r.id === stamped.id);
      return exists
        ? prev.map(r => r.id === stamped.id ? stamped : r)
        : [stamped, ...prev];
    });
  };

  const getScale = (recipeId) => scales[recipeId] || 1;
  const setScaleFor = (recipeId, s) => {
    setScales(prev => ({ ...prev, [recipeId]: s }));
  };

  const deleteRecipe = (id) => {
    mutateRecipes(prev => prev.filter(r => r.id !== id));
  };

  const deleteAllRecipes = () => {
    mutateRecipes(() => []);
  };

  const regenerateMethodsForRecipe = async (recipeId, force = false) => {
    const recipe = recipesRef.current.find(r => r.id === recipeId);
    if (!recipe) return { guided: null, quick: null };
    const needGuided = force || !(Array.isArray(recipe.guidedSteps) && recipe.guidedSteps.length > 0);
    const needQuick  = force || !(Array.isArray(recipe.quickSteps)  && recipe.quickSteps.length > 0);
    if (!needGuided && !needQuick) return { guided: recipe.guidedSteps, quick: recipe.quickSteps };
    const tasks = [
      needGuided ? generateStyledMethod(recipe, 'guided') : Promise.resolve(recipe.guidedSteps || null),
      needQuick  ? generateStyledMethod(recipe, 'quick')  : Promise.resolve(recipe.quickSteps  || null),
    ];
    const [guidedR, quickR] = await Promise.allSettled(tasks);
    const guided = guidedR.status === 'fulfilled' ? guidedR.value : null;
    const quick  = quickR.status === 'fulfilled' ? quickR.value : null;
    if ((guided && needGuided) || (quick && needQuick)) {
      mutateRecipes(prev => prev.map(r => {
        if (r.id !== recipeId) return r;
        const out = { ...r };
        if (guided) out.guidedSteps = guided;
        if (quick)  out.quickSteps  = quick;
        return out;
      }));
    }
    // When force-regenerating (e.g., after a fold), the step content may have changed —
    // re-detect partial-of-total amounts so step annotations stay accurate.
    if (force && (recipe.steps || []).length >= 2 && (recipe.ingredients || []).length >= 2) {
      try {
        const fresh = recipesRef.current.find(r => r.id === recipeId) || recipe;
        const rawPartials = await aiDetectPartials(fresh);
        const reconciled = reconcilePartials(rawPartials, fresh);
        mutateRecipes(prev => prev.map(r => r.id === recipeId ? { ...r, partials: reconciled } : r));
      } catch (e) {
        console.warn('Partial re-detection failed:', e);
      }
    }
    return { guided, quick };
  };

  // Fold an AI revision into a recipe: snapshot the original (once), apply the revised
  // fields, mark the applied notes, then regenerate the Guided/Quick rewrites from the
  // new content. Returns the updated recipe id.
  const applyFoldToRecipe = async (recipeId, fold) => {
    const recipe = recipesRef.current.find(r => r.id === recipeId);
    if (!recipe || !fold) return;
    const existingNotes = migrateNotes(recipe.notes, recipe.createdAt);
    const appliedIds = new Set((fold.applied || []).map(a => a.id));
    const now = Date.now();

    // Snapshot the original the first time we fold (preserve guided/quick too).
    const original = recipe.original || {
      title: recipe.title,
      description: recipe.description,
      ingredients: recipe.ingredients,
      steps: recipe.steps,
      servings: recipe.servings,
      prepTime: recipe.prepTime,
      cookTime: recipe.cookTime,
      tags: recipe.tags,
      guidedSteps: recipe.guidedSteps || null,
      quickSteps: recipe.quickSteps || null,
    };

    const updated = applyOptionalToRecipe({
      ...recipe,
      title: fold.title || recipe.title,
      description: fold.description != null ? fold.description : recipe.description,
      servings: fold.servings != null ? fold.servings : recipe.servings,
      prepTime: fold.prepTime != null ? fold.prepTime : recipe.prepTime,
      cookTime: fold.cookTime != null ? fold.cookTime : recipe.cookTime,
      ingredients: fold.ingredients && fold.ingredients.length ? fold.ingredients : recipe.ingredients,
      steps: fold.steps && fold.steps.length ? fold.steps : recipe.steps,
      original,
      // Content changed — clear styled rewrites and partials so stale data doesn't show
      // while the regen + partial-redetect runs.
      guidedSteps: null,
      quickSteps: null,
      partials: null,
      notes: existingNotes.map(n => appliedIds.has(n.id) ? { ...n, applied: true, appliedAt: now } : n),
    });
    upsertRecipe(updated);
    // Regenerate both styled methods from the revised content.
    await regenerateMethodsForRecipe(recipeId, true);
    return recipeId;
  };

  // Undo all folding: restore the snapshot, clear it, and un-flag applied notes.
  const revertToOriginal = (recipeId) => {
    const recipe = recipesRef.current.find(r => r.id === recipeId);
    if (!recipe || !recipe.original) return;
    const o = recipe.original;
    const notes = migrateNotes(recipe.notes, recipe.createdAt)
      .map(n => { const c = { ...n }; delete c.applied; delete c.appliedAt; return c; });
    upsertRecipe({
      ...recipe,
      title: o.title,
      description: o.description,
      ingredients: o.ingredients,
      steps: o.steps,
      servings: o.servings,
      prepTime: o.prepTime,
      cookTime: o.cookTime,
      tags: o.tags != null ? o.tags : recipe.tags,
      guidedSteps: o.guidedSteps || null,
      quickSteps: o.quickSteps || null,
      original: null,
      notes,
    });
  };

  // Retry an incomplete placeholder card: refetch, rewrite, and persist into the
  // placeholder's slot via the shared buildRecipeFromUrl helper.
  // Returns { ok: true } on success, or { ok: false, error } if the import still fails.
  const retryIncompleteRecipe = async (recipeId) => {
    const placeholder = recipesRef.current.find(r => r.id === recipeId);
    if (!placeholder || !placeholder.source) return { ok: false, error: 'No source URL on this card.' };
    try {
      const completed = await buildRecipeFromUrl(placeholder.source, placeholder);
      upsertRecipe(completed);
      if (completed.incomplete) {
        return { ok: false, error: completed.failureReason || 'Only partial data found — fill in the rest manually.' };
      }
      return { ok: true };
    } catch (e) {
      const errMsg = (e && e.message) || 'Failed to import';
      upsertRecipe({ ...placeholder, failureReason: errMsg });
      return { ok: false, error: errMsg };
    }
  };

  // Route to the right view depending on whether the recipe is incomplete.
  const openRecipe = (id) => {
    const r = recipesRef.current.find(x => x.id === id);
    setView({ name: r && r.incomplete ? 'complete' : 'detail', id });
  };

  const currentRecipe = view.id ? recipes.find(r => r.id === view.id) : null;

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="font-display text-2xl text-stone-400">Loading recipes…</div>
      </div>
    );
  }

  if (view.name === 'list') {
    return (
      <ListView
        recipes={recipes}
        collections={collections}
        search={search}
        setSearch={setSearch}
        onOpen={openRecipe}
        onNew={() => setView({ name: 'add' })}
        onDelete={deleteRecipe}
        onDeleteAll={deleteAllRecipes}
        onCreateCollection={createCollection}
        onUpdateCollection={updateCollection}
        onDeleteCollection={deleteCollection}
        onOpenPantry={() => setView({ name: 'pantry' })}
        onOpenGotos={() => setView({ name: 'gotos' })}
        freshInstall={freshInstall}
        onDismissFresh={() => setFreshInstall(false)}
        onImported={reloadFromStorage}
      />
    );
  }

  if (view.name === 'add') {
    return (
      <AddView
        onCancel={() => setView({ name: 'list' })}
        onManual={() => setView({ name: 'editor', id: null })}
        onBuild={() => setView({ name: 'build' })}
        onAdd={(r) => upsertRecipe(r)}
        onOpen={openRecipe}
        onDone={(ids) => {
          if (ids.length === 1) openRecipe(ids[0]);
          else setView({ name: 'list' });
        }}
      />
    );
  }

  if (view.name === 'detail' && currentRecipe) {
    return (
      <DetailView
        recipe={currentRecipe}
        onBack={() => setView({ name: 'list' })}
        onEdit={() => setView({ name: 'editor', id: currentRecipe.id })}
        onDelete={() => { deleteRecipe(currentRecipe.id); setView({ name: 'list' }); }}
        onStartCooking={() => setView({ name: 'cooking', id: currentRecipe.id, step: 0 })}
        onRegenerateMethods={() => regenerateMethodsForRecipe(currentRecipe.id)}
        onUpdate={upsertRecipe}
        onCreateShoppingList={() => setView({ name: 'shopping-list', id: currentRecipe.id })}
        onApplyFold={applyFoldToRecipe}
        onRevertToOriginal={revertToOriginal}
        collections={collections}
        onToggleCollection={toggleRecipeCollection}
        onCreateCollection={createCollection}
        scale={getScale(currentRecipe.id)}
        onScaleChange={(s) => setScaleFor(currentRecipe.id, s)}
      />
    );
  }

  if (view.name === 'shopping-list' && currentRecipe) {
    return (
      <ShoppingListView
        recipe={currentRecipe}
        scale={getScale(currentRecipe.id)}
        pantry={pantry}
        onBack={() => setView({ name: 'detail', id: currentRecipe.id })}
      />
    );
  }

  if (view.name === 'build') {
    return (
      <BuildView
        onCancel={() => setView({ name: 'add' })}
        onSave={(r) => { upsertRecipe(r); setView({ name: r.incomplete ? 'complete' : 'detail', id: r.id }); }}
      />
    );
  }

  if (view.name === 'complete' && currentRecipe) {
    return (
      <CompleteView
        recipe={currentRecipe}
        onBack={() => setView({ name: 'list' })}
        onEdit={() => setView({ name: 'editor', id: currentRecipe.id })}
        onDelete={() => { deleteRecipe(currentRecipe.id); setView({ name: 'list' }); }}
        onRetry={async () => {
          const result = await retryIncompleteRecipe(currentRecipe.id);
          if (result.ok) setView({ name: 'detail', id: currentRecipe.id });
          return result;
        }}
      />
    );
  }

  if (view.name === 'editor') {
    return (
      <EditorView
        recipe={currentRecipe}
        onCancel={() => setView(currentRecipe ? (currentRecipe.incomplete ? { name: 'complete', id: currentRecipe.id } : { name: 'detail', id: currentRecipe.id }) : { name: 'list' })}
        onSave={(r) => { upsertRecipe(r); setView({ name: 'detail', id: r.id }); }}
      />
    );
  }

  if (view.name === 'pantry') {
    return (
      <PantryView
        pantry={pantry}
        onAdd={addPantryItem}
        onRemove={removePantryItem}
        onBack={() => setView({ name: 'list' })}
      />
    );
  }

  if (view.name === 'gotos') {
    return (
      <GotosView
        sections={gotos}
        recipes={recipes}
        onAddItem={addGotoItem}
        onRemoveItem={removeGotoItem}
        onUpdateItem={updateGotoItem}
        onAddSection={addGotoSection}
        onRemoveSection={removeGotoSection}
        onOpenRecipe={openRecipe}
        onBack={() => setView({ name: 'list' })}
      />
    );
  }

  if (view.name === 'cooking' && currentRecipe) {
    return (
      <CookingMode
        recipe={currentRecipe}
        initialStep={view.step || 0}
        scale={getScale(currentRecipe.id)}
        onExit={() => setView({ name: 'detail', id: currentRecipe.id })}
      />
    );
  }

  return (
    <div className="p-8 text-center">
      Something went sideways.{' '}
      <button onClick={() => setView({ name: 'list' })} className="underline">Back to recipes</button>
    </div>
  );
}


function BackupModal({ onClose, onImported }) {
  const [meta, setMeta] = useState(() => loadMeta());
  const [savedJustNow, setSavedJustNow] = useState(false);
  const [error, setError] = useState('');
  const [pending, setPending] = useState(null); // { bundle, summary }
  const [done, setDone] = useState(''); // post-import message
  const [syncStatus, setSyncStatus] = useState(() => RecipeSync.getStatus());
  const fileRef = useRef(null);

  useEffect(() => RecipeSync.subscribe(setSyncStatus), []);

  const SYNC_UI = {
    init:   { dot: '#C8A45E', text: 'Connecting…' },
    saving: { dot: '#C8A45E', text: 'Saving…' },
    synced: { dot: '#5B8C5A', text: 'Synced' },
    offline:{ dot: '#A8A19A', text: 'Offline — changes save when you’re back online' },
    error:  { dot: '#B8543A', text: 'Sync error' },
    off:    { dot: '#A8A19A', text: 'Not syncing' },
  };
  const sync = SYNC_UI[syncStatus] || SYNC_UI.init;
  const build = window.APP_BUILD || {};

  const myRecipeCount = (() => { try { return (loadRecipes() || []).length; } catch (e) { return 0; } })();

  const handleExport = () => {
    setError('');
    try {
      downloadBackup();
      setMeta(loadMeta());
      setSavedJustNow(true);
      setTimeout(() => setSavedJustNow(false), 2500);
    } catch (e) {
      setError('Couldn\u2019t save the file. ' + (e.message || ''));
    }
  };

  const handleFile = async (e) => {
    setError('');
    setDone('');
    const file = e.target.files && e.target.files[0];
    if (fileRef.current) fileRef.current.value = ''; // allow re-picking the same file
    if (!file) return;
    try {
      const text = await file.text();
      const bundle = parseBackupFile(text);
      setPending({ bundle, summary: summarizeBundle(bundle) });
    } catch (err) {
      setError(err.message || 'Couldn\u2019t read that file.');
    }
  };

  const runImport = (mode) => {
    if (!pending) return;
    try {
      applyBackup(pending.bundle, mode);
      setMeta(loadMeta());
      setPending(null);
      setDone(mode === 'replace' ? 'Replaced with your backup.' : 'Merged your backup in.');
      if (onImported) onImported();
    } catch (e) {
      setError('Import failed. ' + (e.message || ''));
      setPending(null);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center sm:p-4 z-50">
      <div onClick={e => e.stopPropagation()} className="bg-white rounded-t-3xl sm:rounded-2xl p-6 max-w-md w-full max-h-[90vh] overflow-auto">
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-display text-2xl">Backup &amp; sync</h3>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-stone-200/60"><Icon name="x" size={18} /></button>
        </div>
        <p className="text-sm text-stone-500 mb-5">
          Your recipes sync automatically across your devices. Saving to a file is a manual backup you can keep or move yourself.
        </p>

        <div className="flex items-center gap-2.5 mb-6 px-4 py-2.5 rounded-xl bg-stone-50">
          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: sync.dot }} />
          <span className="text-sm text-stone-700 flex-1">Sync · {sync.text}</span>
        </div>

        {!pending && !done && (
          <div className="space-y-3">
            <button
              onClick={handleExport}
              style={{ background: '#1F1B16', color: '#FAF6EF' }}
              className="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              <Icon name="download" size={16} />
              {savedJustNow ? 'Saved \u2713' : 'Save my data to a file'}
            </button>
            <button
              onClick={() => fileRef.current && fileRef.current.click()}
              className="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-50 transition"
            >
              <Icon name="upload" size={16} />
              Load data from a file
            </button>
            <input ref={fileRef} type="file" accept="application/json,.json" onChange={handleFile} className="hidden" />
          </div>
        )}

        {pending && (
          <div className="space-y-4">
            <div className="rounded-xl px-4 py-3.5 text-sm" style={{ background: '#F1E8DC', color: '#6B5D45' }}>
              <div className="font-medium mb-1.5">This backup has:</div>
              <div>{pending.summary.recipeCount} recipe{pending.summary.recipeCount === 1 ? '' : 's'}{pending.summary.collectionCount > 0 ? ' \u00b7 ' + pending.summary.collectionCount + ' collection' + (pending.summary.collectionCount === 1 ? '' : 's') : ''}{pending.summary.pantryCount > 0 ? ' \u00b7 ' + pending.summary.pantryCount + ' pantry item' + (pending.summary.pantryCount === 1 ? '' : 's') : ''}</div>
              {pending.summary.exportedAt && <div className="text-xs mt-1.5 opacity-80">Saved {formatBackupTime(pending.summary.exportedAt)}</div>}
              <div className="text-xs mt-1.5 opacity-80">You currently have {myRecipeCount} recipe{myRecipeCount === 1 ? '' : 's'}.</div>
            </div>

            {pending.summary.newerThanApp && (
              <div className="rounded-xl px-4 py-2.5 text-xs" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
                This file was saved by a newer version of the app. Import should still work, but update the app if anything looks off.
              </div>
            )}

            <div className="space-y-2">
              <button
                onClick={() => runImport('merge')}
                style={{ background: '#1F1B16', color: '#FAF6EF' }}
                className="w-full px-5 py-3 rounded-full text-sm font-medium hover:opacity-90 transition"
              >
                Merge — keep both, newest wins
              </button>
              <button
                onClick={() => runImport('replace')}
                className="w-full px-5 py-3 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-50 transition"
              >
                Replace everything with this file
              </button>
              <button
                onClick={() => setPending(null)}
                className="w-full px-5 py-2.5 rounded-full text-sm text-stone-600 hover:bg-stone-100 transition"
              >
                Cancel
              </button>
            </div>
            <p className="text-xs text-stone-400 leading-relaxed">
              Merge is safe with an older file — your newer recipes are kept. Replace wipes what\u2019s here first and loads only the file.
            </p>
          </div>
        )}

        {done && (
          <div className="space-y-4">
            <div className="rounded-xl px-4 py-3.5 text-sm flex items-center gap-2" style={{ background: '#E7EFE3', color: '#3F5A3A' }}>
              <Icon name="check" size={16} strokeWidth={2.5} />
              {done}
            </div>
            <button
              onClick={onClose}
              style={{ background: '#1F1B16', color: '#FAF6EF' }}
              className="w-full px-5 py-3 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              Done
            </button>
          </div>
        )}

        {error && (
          <div className="mt-4 rounded-xl px-4 py-2.5 text-sm" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
            {error}
          </div>
        )}

        {!pending && (
          <div className="mt-6 pt-4 border-t border-stone-100 text-xs text-stone-400 space-y-1">
            {meta.lastExportedAt && <div>Last saved: {formatBackupTime(meta.lastExportedAt)}</div>}
            {meta.lastImportedAt && <div>Last loaded: {formatBackupTime(meta.lastImportedAt)}</div>}
            {!meta.lastExportedAt && !meta.lastImportedAt && <div>No file backups saved or loaded yet.</div>}
            {build.n && <div className="pt-1 text-stone-300">Build {build.n} · {build.date}</div>}
          </div>
        )}
      </div>
    </div>
  );
}

function AiStatusModal({ onClose }) {
  const [testing, setTesting] = useState(false);
  const [result, setResult] = useState(null);
  const [configured, setConfigured] = useState(isAiConfigured());
  const [editing, setEditing] = useState(!isAiConfigured());
  const [keyDraft, setKeyDraft] = useState('');
  const [showKeyValue, setShowKeyValue] = useState(false);
  const [savedPreview, setSavedPreview] = useState(maskApiKey(getApiKey()));

  const handleSave = () => {
    const trimmed = keyDraft.trim();
    if (!trimmed) return;
    const ok = setApiKey(trimmed);
    if (!ok) {
      setResult({ ok: false, message: 'Could not save key to this browser. Check your browser storage settings.' });
      return;
    }
    setConfigured(true);
    setEditing(false);
    setSavedPreview(maskApiKey(trimmed));
    setKeyDraft('');
    setShowKeyValue(false);
    setResult(null);
  };

  const handleRemove = () => {
    clearApiKey();
    setConfigured(false);
    setEditing(true);
    setSavedPreview('');
    setResult(null);
  };

  const handleCancelEdit = () => {
    setEditing(false);
    setKeyDraft('');
    setShowKeyValue(false);
  };

  const runTest = async () => {
    setTesting(true);
    setResult(null);
    try {
      const { ok, reply } = await aiHealthCheck();
      setResult({ ok, message: ok ? 'Connected. Model responded with "' + reply + '"' : 'Connection works but reply was unexpected: "' + reply + '"' });
    } catch (e) {
      setResult({ ok: false, message: e.message || 'Unknown error' });
    } finally {
      setTesting(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-md w-full">
        <h3 className="font-display text-2xl mb-4">AI status</h3>

        <div className="space-y-2 mb-5 text-sm">
          <div className="flex items-center justify-between">
            <span className="text-stone-500">API key</span>
            <span className={configured ? 'text-stone-800' : 'text-red-700'}>
              {configured ? 'Configured' : 'Not set'}
            </span>
          </div>
          {configured && !editing && (
            <div className="flex items-center justify-between">
              <span className="text-stone-500">Key</span>
              <span className="text-stone-800 font-mono text-xs">{savedPreview}</span>
            </div>
          )}
          <div className="flex items-center justify-between">
            <span className="text-stone-500">Model</span>
            <span className="text-stone-800 font-mono text-xs">{ANTHROPIC_MODEL}</span>
          </div>
        </div>

        {editing && (
          <div className="mb-5">
            <label className="block text-xs text-stone-500 mb-2">
              Paste your Anthropic API key
            </label>
            <div className="flex gap-2">
              <input
                type={showKeyValue ? 'text' : 'password'}
                value={keyDraft}
                onChange={e => setKeyDraft(e.target.value)}
                placeholder="sk-ant-..."
                autoFocus
                className="flex-1 bg-white rounded-xl px-3 py-2 text-sm font-mono border border-stone-200 focus:border-stone-400 focus:outline-none"
              />
              <button
                onClick={() => setShowKeyValue(v => !v)}
                className="px-3 py-2 rounded-xl text-xs text-stone-600 hover:bg-stone-100"
              >
                {showKeyValue ? 'Hide' : 'Show'}
              </button>
            </div>
            <div className="mt-3 flex items-center gap-2">
              <button
                onClick={handleSave}
                disabled={!keyDraft.trim()}
                style={{ background: keyDraft.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
                className="px-4 py-2 rounded-full text-sm font-medium disabled:cursor-not-allowed"
              >
                Save key
              </button>
              {configured && (
                <button
                  onClick={handleCancelEdit}
                  className="px-3 py-2 rounded-full text-xs text-stone-600 hover:bg-stone-100"
                >
                  Cancel
                </button>
              )}
            </div>
            <p className="mt-3 text-xs text-stone-500 leading-relaxed">
              Get a key at console.anthropic.com/account/keys. Stored in this browser only \u2014 never sent anywhere except Anthropic.
            </p>
          </div>
        )}

        {configured && !editing && (
          <div className="mb-5 flex items-center gap-2">
            <button
              onClick={() => setEditing(true)}
              className="px-4 py-2 rounded-full text-sm text-stone-700 border border-stone-300 hover:bg-stone-100"
            >
              Replace key
            </button>
            <button
              onClick={handleRemove}
              className="px-4 py-2 rounded-full text-sm text-red-700 hover:bg-red-50"
            >
              Remove key
            </button>
          </div>
        )}

        <button
          onClick={runTest}
          disabled={!configured || testing}
          style={{ background: (!configured || testing) ? '#A8A19A' : '#1F1B16', color: '#FAF6EF' }}
          className="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium disabled:cursor-not-allowed"
        >
          {testing ? (<><Spinner />{' Testing\u2026'}</>) : 'Run test'}
        </button>

        {result && (
          <div className="mt-4 px-4 py-3 rounded-xl text-xs leading-relaxed" style={result.ok ? { background: '#E8F0E1', color: '#33532A' } : { background: '#FBE4DC', color: '#7A2E16' }}>
            {result.message}
          </div>
        )}

        <div className="mt-5 flex justify-end">
          <button onClick={onClose} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Close</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Go-to meals (the "what to cook" index) ----------
function GotosView({ sections, recipes, onAddItem, onRemoveItem, onUpdateItem, onAddSection, onRemoveSection, onOpenRecipe, onBack }) {
  const [addingTo, setAddingTo] = useState(null);     // sectionId currently showing the add row
  const [draftName, setDraftName] = useState('');
  const [draftDetail, setDraftDetail] = useState('');
  const [editing, setEditing] = useState(null);       // itemId being edited
  const [editName, setEditName] = useState('');
  const [editDetail, setEditDetail] = useState('');
  const [addingSection, setAddingSection] = useState(false);
  const [sectionName, setSectionName] = useState('');
  const [pick, setPick] = useState(null);             // { sectionName, name, detail } surprise result

  const recipeFor = (name) => {
    const n = (name || '').trim().toLowerCase();
    if (!n) return null;
    return (recipes || []).find(r => (r.title || '').trim().toLowerCase() === n) || null;
  };

  const allItems = [];
  (sections || []).forEach(s => (s.items || []).forEach(it => allItems.push({ ...it, sectionName: s.name })));

  const surprise = () => {
    if (allItems.length === 0) return;
    let choice = allItems[Math.floor(Math.random() * allItems.length)];
    // avoid repeating the same pick back to back when possible
    if (pick && allItems.length > 1) {
      let guard = 0;
      while (choice.id === pick.id && guard < 8) { choice = allItems[Math.floor(Math.random() * allItems.length)]; guard++; }
    }
    setPick(choice);
  };

  const startAdd = (sectionId) => { setAddingTo(sectionId); setDraftName(''); setDraftDetail(''); };
  const commitAdd = (sectionId) => {
    if (!draftName.trim()) { setAddingTo(null); return; }
    onAddItem(sectionId, draftName, draftDetail);
    setDraftName(''); setDraftDetail('');
    // keep the add row open for quick multiple entries
  };

  const startEdit = (it) => { setEditing(it.id); setEditName(it.name); setEditDetail(it.detail || ''); };
  const commitEdit = (sectionId, itemId) => {
    if (editName.trim()) onUpdateItem(sectionId, itemId, editName, editDetail);
    setEditing(null);
  };

  const pickRecipe = pick ? recipeFor(pick.name) : null;

  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-8">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          All recipes
        </button>
      </div>

      <p className="text-xs uppercase tracking-[0.18em] text-stone-500 font-medium mb-2">Go-to meals</p>
      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight tracking-tight mb-3">What to cook</h1>
      <p className="text-stone-500 mb-6 max-w-xl">
        Your regulars, grouped by meal — a quick index for when you can’t decide what to make.
      </p>

      <div className="mb-8">
        {pick ? (
          <div className="rounded-2xl px-5 py-4" style={{ background: '#1F1B16', color: '#FAF6EF' }}>
            <div className="text-xs uppercase tracking-[0.15em] mb-1" style={{ color: '#C8A45E' }}>{pick.sectionName}</div>
            <div className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="font-display text-2xl leading-snug">{pick.name}</div>
                {pick.detail && <div className="text-sm mt-0.5" style={{ color: '#C9BEA9' }}>{pick.detail}</div>}
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {pickRecipe && (
                  <button onClick={() => onOpenRecipe(pickRecipe.id)} className="px-3 py-1.5 rounded-full text-xs font-medium" style={{ background: '#FAF6EF', color: '#1F1B16' }}>
                    Open recipe
                  </button>
                )}
                <button onClick={surprise} className="inline-flex items-center justify-center w-9 h-9 rounded-full" style={{ background: 'rgba(250,246,239,0.12)', color: '#FAF6EF' }} title="Pick another" aria-label="Pick another">
                  <Icon name="rotate" size={15} />
                </button>
              </div>
            </div>
          </div>
        ) : (
          <button
            onClick={surprise}
            disabled={allItems.length === 0}
            className="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-50 transition disabled:opacity-40"
          >
            🎲 Surprise me
          </button>
        )}
      </div>

      <div className="space-y-8">
        {(sections || []).map(section => (
          <div key={section.id}>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium">{section.name}</h3>
              {(section.items || []).length === 0 && (
                <button onClick={() => onRemoveSection(section.id)} className="text-xs text-stone-400 hover:text-red-700 underline-offset-2 hover:underline">
                  Remove
                </button>
              )}
            </div>

            <ul className="space-y-1.5">
              {(section.items || []).map(it => {
                const rec = recipeFor(it.name);
                const isEditing = editing === it.id;
                if (isEditing) {
                  return (
                    <li key={it.id} className="rounded-xl bg-white border border-stone-200 p-3 space-y-2">
                      <input value={editName} onChange={e => setEditName(e.target.value)} placeholder="Meal" className="w-full px-3 py-2 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400" />
                      <input value={editDetail} onChange={e => setEditDetail(e.target.value)} placeholder="Note (optional)" className="w-full px-3 py-2 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400" />
                      <div className="flex justify-end gap-2">
                        <button onClick={() => setEditing(null)} className="px-3 py-1.5 rounded-full text-xs text-stone-600 hover:bg-stone-100">Cancel</button>
                        <button onClick={() => commitEdit(section.id, it.id)} style={{ background: '#1F1B16', color: '#FAF6EF' }} className="px-3 py-1.5 rounded-full text-xs font-medium">Save</button>
                      </div>
                    </li>
                  );
                }
                return (
                  <li key={it.id} className="group flex items-start gap-2 rounded-xl px-3 py-2 hover:bg-stone-50 transition">
                    <span className="text-stone-300 mt-2 shrink-0" style={{ fontSize: '6px' }}>●</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        {rec ? (
                          <button onClick={() => onOpenRecipe(rec.id)} className="text-[15px] text-stone-900 font-medium inline-flex items-center gap-1 hover:underline underline-offset-2" style={{ color: '#8C5A3A' }}>
                            {it.name}
                            <Icon name="chevronRight" size={13} />
                          </button>
                        ) : (
                          <span className="text-[15px] text-stone-900 font-medium">{it.name}</span>
                        )}
                      </div>
                      {it.detail && <div className="text-sm text-stone-500">{it.detail}</div>}
                    </div>
                    <div className="flex items-center gap-1 shrink-0 sm:opacity-0 sm:group-hover:opacity-100 transition">
                      <button onClick={() => startEdit(it)} className="p-1.5 rounded-full hover:bg-stone-200/60 text-stone-400 hover:text-stone-700" aria-label="Edit"><Icon name="pencil" size={13} /></button>
                      <button onClick={() => onRemoveItem(section.id, it.id)} className="p-1.5 rounded-full hover:bg-stone-200/60 text-stone-400 hover:text-red-600" aria-label="Remove"><Icon name="x" size={13} /></button>
                    </div>
                  </li>
                );
              })}
            </ul>

            {addingTo === section.id ? (
              <div className="mt-2 rounded-xl bg-white border border-stone-200 p-3 space-y-2">
                <input autoFocus value={draftName} onChange={e => setDraftName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitAdd(section.id); } }} placeholder="Meal, e.g. Shakshuka" className="w-full px-3 py-2 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400" />
                <input value={draftDetail} onChange={e => setDraftDetail(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitAdd(section.id); } }} placeholder="Note (optional), e.g. with a side of rice" className="w-full px-3 py-2 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setAddingTo(null)} className="px-3 py-1.5 rounded-full text-xs text-stone-600 hover:bg-stone-100">Done</button>
                  <button onClick={() => commitAdd(section.id)} disabled={!draftName.trim()} style={{ background: draftName.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }} className="px-4 py-1.5 rounded-full text-xs font-medium disabled:cursor-not-allowed">Add</button>
                </div>
              </div>
            ) : (
              <button onClick={() => startAdd(section.id)} className="mt-2 inline-flex items-center gap-1.5 text-sm text-stone-500 hover:text-stone-900">
                <Icon name="plus" size={14} strokeWidth={2.5} /> Add a meal
              </button>
            )}
          </div>
        ))}
      </div>

      <div className="mt-10 pt-6 border-t border-stone-200/70">
        {addingSection ? (
          <div className="rounded-xl bg-white border border-stone-200 p-3 space-y-2 max-w-sm">
            <input autoFocus value={sectionName} onChange={e => setSectionName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (sectionName.trim()) { onAddSection(sectionName); setSectionName(''); setAddingSection(false); } } }} placeholder="e.g. Snacks, Desserts, Sides" className="w-full px-3 py-2 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400" />
            <div className="flex justify-end gap-2">
              <button onClick={() => { setAddingSection(false); setSectionName(''); }} className="px-3 py-1.5 rounded-full text-xs text-stone-600 hover:bg-stone-100">Cancel</button>
              <button onClick={() => { if (sectionName.trim()) { onAddSection(sectionName); setSectionName(''); setAddingSection(false); } }} disabled={!sectionName.trim()} style={{ background: sectionName.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }} className="px-4 py-1.5 rounded-full text-xs font-medium disabled:cursor-not-allowed">Add meal type</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setAddingSection(true)} className="inline-flex items-center gap-1.5 text-sm text-stone-500 hover:text-stone-900">
            <Icon name="plus" size={14} strokeWidth={2.5} /> Add a meal type
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- Pantry (staples you always have) ----------
function PantryView({ pantry, onAdd, onRemove, onBack }) {
  const [name, setName] = useState('');
  const [category, setCategory] = useState('spices');

  const grouped = {};
  for (const item of pantry || []) {
    const cat = item.category || 'other';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  }
  for (const cat of Object.keys(grouped)) {
    grouped[cat].sort((a, b) => a.name.localeCompare(b.name));
  }

  const submit = () => {
    if (!name.trim()) return;
    onAdd(name, category);
    setName('');
  };

  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-8">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          All recipes
        </button>
      </div>

      <p className="text-xs uppercase tracking-[0.18em] text-stone-500 font-medium mb-2">Pantry</p>
      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight tracking-tight mb-3">Staples you always have</h1>
      <p className="text-stone-500 mb-8 max-w-xl">
        Anything you add here is treated as already-owned when you build a shopping list, so you never have to keep ticking off the same cumin or olive oil.
      </p>

      <div className="rounded-2xl bg-white border border-stone-200 p-4 mb-8">
        <div className="flex flex-wrap gap-2">
          <input
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }}
            placeholder="e.g. cumin, paprika, olive oil"
            className="flex-1 min-w-0 px-3.5 py-2.5 rounded-full text-sm border border-stone-200 focus:outline-none focus:border-stone-400 bg-stone-50"
          />
          <select
            value={category}
            onChange={e => setCategory(e.target.value)}
            className="px-3.5 py-2.5 rounded-full text-sm border border-stone-200 focus:outline-none focus:border-stone-400 bg-stone-50"
          >
            {PANTRY_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
          <button
            onClick={submit}
            disabled={!name.trim()}
            style={{ background: name.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
            className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm font-medium disabled:cursor-not-allowed"
          >
            <Icon name="plus" size={14} strokeWidth={2.5} /> Add
          </button>
        </div>
      </div>

      {(pantry || []).length === 0 ? (
        <div className="px-5 py-8 rounded-2xl text-center text-sm text-stone-500" style={{ background: '#F1E8DC' }}>
          Nothing in your pantry yet. Add the staples you always keep in stock.
        </div>
      ) : (
        <div className="space-y-8">
          {PANTRY_CATEGORIES.map(cat => {
            const items = grouped[cat.id] || [];
            if (items.length === 0) return null;
            return (
              <div key={cat.id}>
                <h3 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-3">{cat.label}</h3>
                <ul className="flex flex-wrap gap-2">
                  {items.map(item => (
                    <li key={item.id} className="inline-flex items-center gap-1.5 pl-3 pr-1 py-1 rounded-full text-sm" style={{ background: '#F1E8DC', color: '#6B5D45' }}>
                      <span>{item.name}</span>
                      <button
                        onClick={() => onRemove(item.id)}
                        className="p-1 rounded-full hover:bg-stone-200/60"
                        aria-label={'Remove ' + item.name}
                        title="Remove"
                      >
                        <Icon name="x" size={11} strokeWidth={2.5} />
                      </button>
                    </li>
                  ))}
                </ul>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

              value={name}
              onChange={e => setName(e.target.value)}
              autoFocus
              placeholder="e.g. Weeknight rotation"
              onKeyDown={e => { if (e.key === 'Enter' && name.trim()) onSave({ name, description }); }}

            />
          </div>
          <div>

              value={description}
              onChange={e => setDescription(e.target.value)}
              placeholder="What goes in here?"
              className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none"
            />
          </div>
        </div>
        <div className="mt-5 flex justify-end gap-2">
          <button onClick={onCancel} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>

          >
            {isEdit ? 'Save' : 'Create'}

        </div>
      </div>
    </div>
  );
}

  return (

              <RecipeCard recipe={r} onClick={() => onOpen(r.id)} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ListView({ recipes, collections, search, setSearch, onOpen, onNew, onDelete, onDeleteAll, onCreateCollection, onUpdateCollection, onDeleteCollection, onOpenPantry, onOpenGotos, freshInstall, onDismissFresh, onImported }) {
  const [showAiStatus, setShowAiStatus] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [deleteId, setDeleteId] = useState(null);
  const [showDeleteAll, setShowDeleteAll] = useState(false);
  const [collectionModal, setCollectionModal] = useState(null); // null | {mode:'create'} | {mode:'edit', collection}
  const [confirmDeleteCol, setConfirmDeleteCol] = useState(null);
  const [expanded, setExpanded] = useState(null); // { title, recipes } for "See all"
  const searching = !!search.trim();

  // ---- Build the categorized rows (non-search) ----
  const live = recipes.filter(r => !r.incomplete);
  const needsAttention = recipes.filter(r => r.incomplete);
  const byRecent = [...live].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const statusRows = {
    trying: live.filter(r => (r.status || 'wantto') === 'trying'),
    wantto: live.filter(r => (r.status || 'wantto') === 'wantto'),
    liked:  live.filter(r => r.status === 'liked'),
  };
  const titleCase = (s) => String(s || '').replace(/\b\w/g, c => c.toUpperCase());

  // AI-derived rows: group by tag value within a dimension, keep values with 2+ recipes.
  const valueRows = (dimKey) => {
    const counts = {};
    for (const r of live) {
      for (const v of normalizeLabels(r.labels)[dimKey]) {
        if (!counts[v]) counts[v] = [];
        counts[v].push(r);
      }
    }
    return Object.entries(counts)
      .filter(([v, rs]) => rs.length >= 2)
      .sort((a, b) => b[1].length - a[1].length)
      .map(([v, rs]) => ({ value: v, recipes: rs }));
  };
  const aiRows = [
    ...valueRows('cuisine').slice(0, 3).map(x => ({ id: 'cuisine:' + x.value, title: titleCase(x.value), recipes: x.recipes })),
    ...valueRows('protein').filter(x => x.value !== 'none').slice(0, 3).map(x => ({ id: 'protein:' + x.value, title: titleCase(x.value), recipes: x.recipes })),
    ...valueRows('method').slice(0, 2).map(x => ({ id: 'method:' + x.value, title: titleCase(x.value), recipes: x.recipes })),
  ];

  const quickWeeknight = live.filter(r => cookTimeBucket(r) === 'quick');

  // N5: which category rows (excluding Recently added & collections) actually qualify?
  const anyCategoryRow =
    statusRows.trying.length >= 2 || statusRows.wantto.length >= 2 || statusRows.liked.length >= 2 ||
    aiRows.length > 0 || quickWeeknight.length >= 2;
  // Recently added shows normally at 2+, or as the low-volume fallback when nothing else qualifies.
  const recentRow = (byRecent.length >= 2 || (byRecent.length >= 1 && !anyCategoryRow)) ? byRecent.slice(0, 10) : null;
  const showLowVolumeHint = live.length > 0 && !anyCategoryRow && collections.length === 0;
  const filtered = recipes.filter(r => {
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return (
      r.title.toLowerCase().includes(q) ||
      (r.description || '').toLowerCase().includes(q) ||
      (r.tags || []).some(t => t.toLowerCase().includes(q)) ||
      (r.ingredients || []).some(i => i.toLowerCase().includes(q))
    );
  });

  const deleteTarget = deleteId ? recipes.find(r => r.id === deleteId) : null;

  return (
    <div className="max-w-5xl mx-auto px-5 sm:px-8 py-8 sm:py-12">
      {freshInstall && (
        <div className="mb-6 rounded-2xl px-5 py-4 flex items-start sm:items-center justify-between gap-4 flex-wrap" style={{ background: '#F1E8DC' }}>
          <div className="min-w-0">
            <div className="text-sm font-medium" style={{ color: '#4A3F2E' }}>New copy of the app?</div>
            <div className="text-sm" style={{ color: '#6B5D45' }}>Bring your recipes and notes over from a backup file.</div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button
              onClick={() => setShowBackup(true)}
              style={{ background: '#1F1B16', color: '#FAF6EF' }}
              className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              <Icon name="upload" size={14} />
              Load my data
            </button>
            <button
              onClick={onDismissFresh}
              className="p-1.5 rounded-full hover:bg-stone-200/60"
              aria-label="Dismiss"
            >
              <Icon name="x" size={16} />
            </button>
          </div>
        </div>
      )}

      <div className="flex items-start justify-between gap-4 mb-8 sm:mb-12">
        <div>
          <h1 className="font-display text-5xl sm:text-6xl font-light tracking-tight">Recipes</h1>
          <p className="mt-2 text-sm text-stone-500 inline-flex items-center gap-3">
            <span>{recipes.length} {recipes.length === 1 ? 'recipe' : 'recipes'} in your book</span>
            {recipes.length > 0 && onDeleteAll && (
              <button
                onClick={() => setShowDeleteAll(true)}
                className="text-xs text-stone-400 hover:text-red-700 underline-offset-2 hover:underline transition"
              >
                Delete all
              </button>
            )}
          </p>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button
            onClick={onOpenGotos}
            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-50 transition"
          >
            🎲 What to cook
          </button>
          <button
            onClick={onNew}
            style={{ background: '#1F1B16', color: '#FAF6EF' }}
            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition"
          >
            <Icon name="plus" size={16} strokeWidth={2.5} />
            New recipe
          </button>
        </div>
      </div>

      <div className="mb-8">
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400">
            <Icon name="search" size={16} />
          </span>
          <input
            value={search}
            onChange={e => { setSearch(e.target.value); if (e.target.value) setExpanded(null); }}
            placeholder="Search by title, ingredient, or tag…"
            className="w-full pl-11 pr-4 py-3 rounded-full bg-white border border-stone-200 text-sm focus:outline-none focus:border-stone-400 transition"
          />
        </div>
      </div>

      {searching ? (
        filtered.length === 0 ? (
          <EmptyState onNew={onNew} hasRecipes={recipes.length > 0} />
        ) : (
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
            {filtered.map(r => (
              <RecipeCard key={r.id} recipe={r} onClick={() => onOpen(r.id)} onDelete={() => setDeleteId(r.id)} />
            ))}
          </div>
        )
      ) : recipes.length === 0 ? (
        <EmptyState onNew={onNew} hasRecipes={false} />
      ) : expanded ? (
        <div>
          <button onClick={() => setExpanded(null)} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900 mb-6">
            <Icon name="arrowLeft" size={16} /> All categories
          </button>
          <h2 className="font-display text-3xl font-light mb-6">{expanded.title}</h2>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
            {expanded.recipes.map(r => (
              <RecipeCard key={r.id} recipe={r} onClick={() => onOpen(r.id)} onDelete={() => setDeleteId(r.id)} />
            ))}
          </div>
        </div>
      ) : (
        <div className="space-y-10">
          {needsAttention.length > 0 && (
            <CategoryRow title="Needs attention" recipes={needsAttention} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Needs attention', recipes: needsAttention })} accent="#B8543A" />
          )}

          {showLowVolumeHint && (
            <div className="rounded-2xl px-5 py-4" style={{ background: '#F1E8DC' }}>
              <p className="text-sm" style={{ color: '#6B5D45' }}>
                Add a few more recipes and they'll sort themselves into rows by cuisine, protein, cook time, and more.
              </p>
            </div>
          )}

          {statusRows.trying.length >= 2 && (
            <CategoryRow title="Trying now" recipes={statusRows.trying} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Trying now', recipes: statusRows.trying })} />
          )}
          {statusRows.wantto.length >= 2 && (
            <CategoryRow title="Want to try" recipes={statusRows.wantto} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Want to try', recipes: statusRows.wantto })} />
          )}
          {recentRow && (
            <CategoryRow title="Recently added" recipes={recentRow} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Recently added', recipes: byRecent })} />
          )}

          <div>
            <div className="flex items-center justify-between mb-1">
              <h2 className="font-display text-2xl font-light">My collections</h2>
              <button onClick={() => setCollectionModal({ mode: 'create' })} className="text-sm text-stone-600 hover:text-stone-900 inline-flex items-center gap-1.5">
                <Icon name="plus" size={14} strokeWidth={2.5} /> Create collection
              </button>
            </div>
            {collections.length === 0 ? (
              <p className="text-sm text-stone-500 mt-2">Group recipes into collections like “Weeknight rotation” or “Holiday baking,” then add recipes from any recipe page.</p>
            ) : (
              <div className="space-y-8 mt-4">
                {collections.map(col => (
                  <CollectionRow
                    key={col.id}
                    collection={col}
                    members={recipes.filter(r => recipeCollectionIds(r).includes(col.id))}
                    onOpen={onOpen}
                    onRename={() => setCollectionModal({ mode: 'edit', collection: col })}
                    onDelete={() => setConfirmDeleteCol(col)}
                  />
                ))}
              </div>
            )}
          </div>

          {aiRows.map(row => (
            <CategoryRow key={row.id} title={row.title} recipes={row.recipes} onOpen={onOpen} onSeeAll={() => setExpanded({ title: row.title, recipes: row.recipes })} />
          ))}

          {quickWeeknight.length >= 2 && (
            <CategoryRow title="Quick weeknight" recipes={quickWeeknight} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Quick weeknight', recipes: quickWeeknight })} />
          )}
          {statusRows.liked.length >= 2 && (
            <CategoryRow title="Liked" recipes={statusRows.liked} onOpen={onOpen} onSeeAll={() => setExpanded({ title: 'Liked', recipes: statusRows.liked })} />
          )}
        </div>
      )}

      <div className="pt-8 mt-8 border-t border-stone-200/70 text-center flex items-center justify-center gap-5">
        <button
          onClick={onOpenPantry}
          className="text-xs text-stone-400 hover:text-stone-700 underline-offset-2 hover:underline"
        >
          Pantry
        </button>
        <span className="text-stone-300">·</span>
        <button
          onClick={() => setShowBackup(true)}
          className="text-xs text-stone-400 hover:text-stone-700 underline-offset-2 hover:underline"
        >
          Backup &amp; sync
        </button>
        <span className="text-stone-300">·</span>
        <button
          onClick={() => setShowAiStatus(true)}
          className="text-xs text-stone-400 hover:text-stone-700 underline-offset-2 hover:underline"
        >
          AI status
        </button>
      </div>

      {deleteTarget && (
        <div onClick={() => setDeleteId(null)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Delete this recipe?</h3>
            <p className="text-sm text-stone-600 mb-5">
              "{deleteTarget.title}" will be removed permanently. This can't be undone.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setDeleteId(null)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button onClick={() => { onDelete(deleteId); setDeleteId(null); }} className="px-4 py-2 rounded-full text-sm text-white bg-red-700 hover:bg-red-800">Delete</button>
            </div>
          </div>
        </div>
      )}

      {showDeleteAll && (
        <div onClick={() => setShowDeleteAll(false)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Delete all {recipes.length} recipes?</h3>
            <p className="text-sm text-stone-600 mb-5">Every recipe in your book will be removed permanently. This can't be undone.</p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowDeleteAll(false)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button
                onClick={() => { onDeleteAll(); setShowDeleteAll(false); }}
                className="px-4 py-2 rounded-full text-sm text-white bg-red-700 hover:bg-red-800"
              >
                Delete all
              </button>
            </div>
          </div>
        </div>
      )}

      {showAiStatus && (
        <AiStatusModal onClose={() => setShowAiStatus(false)} />
      )}

      {showBackup && (
        <BackupModal
          onClose={() => setShowBackup(false)}
          onImported={() => { if (onImported) onImported(); }}
        />
      )}

      {collectionModal && (
        <CollectionEditModal
          initial={collectionModal.mode === 'edit' ? collectionModal.collection : null}
          onCancel={() => setCollectionModal(null)}
          onSave={({ name, description }) => {
            if (collectionModal.mode === 'edit') onUpdateCollection(collectionModal.collection.id, { name, description });
            else onCreateCollection(name, description);
            setCollectionModal(null);
          }}
        />
      )}

      {confirmDeleteCol && (
        <div onClick={() => setConfirmDeleteCol(null)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Delete “{confirmDeleteCol.name}”?</h3>
            <p className="text-sm text-stone-600 mb-5">The collection is removed, but the recipes in it stay in your book.</p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setConfirmDeleteCol(null)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button onClick={() => { onDeleteCollection(confirmDeleteCol.id); setConfirmDeleteCol(null); }} className="px-4 py-2 rounded-full text-sm text-white bg-red-700 hover:bg-red-800">Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RecipeCardImage({ recipe }) {
  const [errored, setErrored] = useState(false);
  const url = recipe.image && !errored ? recipe.image : null;
  if (url) {
    return (
      <div className="relative w-full aspect-[3/2] rounded-xl overflow-hidden bg-stone-100 mb-3">
        <img
          src={url}
          alt=""
          loading="lazy"
          onError={() => setErrored(true)}
          className="w-full h-full object-cover"
        />
      </div>
    );
  }
  // Clean placeholder: neutral tile with the recipe's first letter over a soft food icon.
  const letter = (recipe.title || '?').trim().charAt(0).toUpperCase() || '?';
  return (
    <div className="relative w-full aspect-[3/2] rounded-xl overflow-hidden mb-3 flex items-center justify-center" style={{ background: '#F1E8DC' }}>
      <span className="absolute opacity-20" style={{ color: '#8B5A2B' }}><Icon name="chef" size={44} strokeWidth={1.5} /></span>
      <span className="relative font-display text-4xl" style={{ color: '#8B5A2B' }}>{letter}</span>
    </div>
  );
}

function RecipeCard({ recipe, onClick, onDelete }) {
  const handleDelete = (e) => {
    e.stopPropagation();
    if (onDelete) onDelete();
  };
  const isIncomplete = !!recipe.incomplete;
  const wrapperClass = isIncomplete
    ? "relative text-left bg-stone-50 rounded-2xl p-3 border border-dashed border-stone-300 hover:border-stone-400 hover:shadow-sm transition group cursor-pointer h-full"
    : "relative text-left bg-white rounded-2xl p-3 border border-stone-200/70 hover:border-stone-300 hover:shadow-sm transition group cursor-pointer h-full";
  return (
    <div
      onClick={onClick}
      role="button"
      tabIndex={0}
      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } }}
      className={wrapperClass}
    >
      <RecipeCardImage recipe={recipe} />
      {onDelete && (
        <button
          onClick={handleDelete}
          title="Delete recipe"
          aria-label="Delete recipe"
          className="absolute top-5 right-5 p-1.5 rounded-full bg-white/85 backdrop-blur text-stone-400 hover:text-red-700 transition opacity-0 group-hover:opacity-100"
        >
          <Icon name="trash" size={14} />
        </button>
      )}
      <div className="px-2 pb-1">
        {isIncomplete && (
          <div className="mb-2">
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium uppercase tracking-wider" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
              <Icon name="alert" size={10} strokeWidth={3} />
              Needs attention
            </span>
          </div>
        )}
        <h3 className={"font-display text-xl font-normal leading-tight mb-1.5 " + (isIncomplete ? "text-stone-500" : "")}>{recipe.title}</h3>
        {!isIncomplete && recipe.description && (
          <p className="text-sm text-stone-500 line-clamp-2 mb-3">{recipe.description}</p>
        )}
        {isIncomplete && recipe.source && (
          <p className="text-xs text-stone-400 truncate mb-2" title={recipe.source}>{recipe.source}</p>
        )}
        {!isIncomplete && (recipe.servings || recipe.prepTime || recipe.cookTime) && (
          <div className="flex items-center gap-4 text-xs text-stone-500">
            {recipe.servings && (
              <span className="inline-flex items-center gap-1.5">
                <Icon name="users" size={13} />
                {recipe.servings}
              </span>
            )}
            {(recipe.prepTime || recipe.cookTime) && (
              <span className="inline-flex items-center gap-1.5">
                <Icon name="clock" size={13} />
                {[recipe.prepTime, recipe.cookTime].filter(Boolean).join(' + ')}
              </span>
            )}
          </div>
        )}
        {isIncomplete && (
          <p className="text-xs text-stone-500 italic">Tap to retry or edit</p>
        )}
      </div>
    </div>
  );
}


function EmptyState({ onNew, hasRecipes }) {
  return (
    <div className="text-center py-20 px-4">
      <div className="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4" style={{ background: '#F1E8DC' }}>
        <span style={{ color: '#8B5A2B' }}><Icon name="book" size={28} /></span>
      </div>
      <h3 className="font-display text-2xl mb-2">
        {hasRecipes ? 'Nothing matches that filter' : 'Your recipe book is empty'}
      </h3>
      <p className="text-stone-500 text-sm mb-6 max-w-sm mx-auto">
        {hasRecipes ? 'Try a different status or search term.' : 'Add your first recipe to get started.'}
      </p>
      {!hasRecipes && (
        <button
          onClick={onNew}
          style={{ background: '#1F1B16', color: '#FAF6EF' }}
          className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium"
        >
          <Icon name="plus" size={16} strokeWidth={2.5} />
          New recipe
        </button>
      )}
    </div>
  );
}

// ---------- Detail ----------
function NotesSection({ recipe, onUpdate, onApplyNotes, foldBusy }) {
  const persistedNotes = migrateNotes(recipe.notes, recipe.createdAt);
  const sorted = [...persistedNotes].sort((a, b) => (b.date || 0) - (a.date || 0));
  const unappliedCount = persistedNotes.filter(n => !n.applied).length;
  const canFold = isAiConfigured() && onApplyNotes && unappliedCount > 0;

  const [editingId, setEditingId] = useState(null);
  const [draftText, setDraftText] = useState('');
  const [draftingNew, setDraftingNew] = useState(null);
  const [pendingDeleteId, setPendingDeleteId] = useState(null);

  const persistNotes = (newNotes) => {
    onUpdate({ ...recipe, notes: newNotes });
  };

  const addNote = () => {
    if (draftingNew) return;
    const draft = { id: newId(), date: Date.now() };
    setDraftingNew(draft);
    setEditingId(draft.id);
    setDraftText('');
    setPendingDeleteId(null);
  };

  const startEdit = (note) => {
    setEditingId(note.id);
    setDraftText(note.text);
    setPendingDeleteId(null);
  };

  const saveEdit = () => {
    const trimmed = draftText.trim();
    if (draftingNew && draftingNew.id === editingId) {
      if (trimmed) {
        persistNotes([{ id: draftingNew.id, date: draftingNew.date, text: trimmed }, ...persistedNotes]);
      }
      setDraftingNew(null);
      setEditingId(null);
      setDraftText('');
      return;
    }
    if (!trimmed) {
      persistNotes(persistedNotes.filter(n => n.id !== editingId));
    } else {
      persistNotes(persistedNotes.map(n => n.id === editingId ? { ...n, text: trimmed } : n));
    }
    setEditingId(null);
    setDraftText('');
  };

  const cancelEdit = () => {
    if (draftingNew && draftingNew.id === editingId) {
      setDraftingNew(null);
    }
    setEditingId(null);
    setDraftText('');
  };

  const askDelete = (id) => {
    setPendingDeleteId(id);
    setEditingId(null);
  };
  const cancelDelete = () => setPendingDeleteId(null);
  const doDelete = (id) => {
    persistNotes(persistedNotes.filter(n => n.id !== id));
    setPendingDeleteId(null);
  };

  const display = draftingNew
    ? [{ id: draftingNew.id, date: draftingNew.date, text: '' }, ...sorted]
    : sorted;

  return (
    <section className="mb-10">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-sm uppercase tracking-[0.18em] text-stone-500 font-medium">Notes</h2>
        <div className="flex items-center gap-4">
          {canFold && (
            <button
              onClick={onApplyNotes}
              disabled={foldBusy}
              className="text-xs inline-flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed"
              style={{ color: '#B8543A' }}
            >
              {foldBusy ? (<><Spinner /> Reading notes…</>) : (<>{'✨ Apply notes with AI'}</>)}
            </button>
          )}
          <button
            onClick={addNote}
            disabled={!!draftingNew}
            className="text-xs text-stone-600 hover:text-stone-900 disabled:text-stone-400 disabled:cursor-not-allowed"
          >
            + Add note
          </button>
        </div>
      </div>

      {display.length === 0 ? (
        <p className="text-sm text-stone-500 italic">Add a note after you cook it — what worked, what to tweak.</p>
      ) : (
        <ul className="space-y-3">
