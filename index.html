          {display.map(note => {
            const isEditing = editingId === note.id;
            const isPendingDelete = pendingDeleteId === note.id;
            return (
              <li key={note.id} className="p-4 rounded-2xl" style={{ background: '#F1E8DC' }}>
                <div className="flex items-center justify-between mb-2 gap-3">
                  <span className="text-xs uppercase tracking-wider text-stone-500 inline-flex items-center gap-2">
                    {formatNoteDate(note.date)}
                    {note.applied && (
                      <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full normal-case tracking-normal text-[10px] font-medium" style={{ background: '#DCE7CE', color: '#4A5D38' }}>
                        <Icon name="check" size={9} strokeWidth={3} /> Applied
                      </span>
                    )}
                  </span>
                  {!isEditing && !isPendingDelete && (
                    <div className="flex gap-3 text-xs">
                      <button onClick={() => startEdit(note)} className="text-stone-600 hover:text-stone-900">Edit</button>
                      <button onClick={() => askDelete(note.id)} className="text-stone-600 hover:text-red-700">Delete</button>
                    </div>
                  )}
                  {isPendingDelete && (
                    <div className="flex gap-3 text-xs items-center">
                      <span className="text-stone-600">Delete this note?</span>
                      <button onClick={cancelDelete} className="text-stone-600 hover:text-stone-900">Cancel</button>
                      <button onClick={() => doDelete(note.id)} className="text-red-700 font-medium">Delete</button>
                    </div>
                  )}
                </div>
                {isEditing ? (
                  <>
                    <textarea
                      value={draftText}
                      onChange={e => setDraftText(e.target.value)}
                      placeholder="What worked, what to tweak..."
                      autoFocus
                      rows={4}
                      className="w-full bg-white/70 rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none resize-y"
                    />
                    <div className="mt-2 flex justify-end gap-2">
                      <button
                        onClick={cancelEdit}
                        className="px-3 py-1.5 rounded-full text-xs text-stone-700 hover:bg-stone-100"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={saveEdit}
                        disabled={!draftText.trim()}
                        style={{ background: draftText.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
                        className="px-3 py-1.5 rounded-full text-xs font-medium disabled:cursor-not-allowed"
                      >
                        Save
                      </button>
                    </div>
                  </>
                ) : (
                  <p className="text-[15px] leading-relaxed text-stone-700 whitespace-pre-wrap">{note.text}</p>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </section>
  );
}

// Read-only chips for a recipe's category labels (incl. computed cook-time bucket).
function RecipeLabelsDisplay({ recipe }) {
  const labels = normalizeLabels(recipe.labels);
  const bucket = cookTimeBucket(recipe);
  const chips = [];
  for (const dim of LABEL_DIMENSIONS) {
    for (const v of labels[dim.key]) chips.push({ key: dim.key + ':' + v, text: v });
  }
  if (bucket) chips.push({ key: 'cook', text: COOK_TIME_BUCKET_SHORT[bucket], accent: true });
  if (chips.length === 0) return null;
  return (
    <div className="flex flex-wrap gap-1.5">
      {chips.map(c => (
        <span key={c.key} className="px-2.5 py-1 rounded-full text-xs capitalize"
          style={c.accent ? { background: '#E7DECB', color: '#6B5D45' } : { background: '#F1E8DC', color: '#6B5D45' }}>
          {c.text}
        </span>
      ))}
    </div>
  );
}

// Per-dimension chip toggles + free-text add. Cook-time bucket is computed, not edited here.
function LabelsEditor({ value, onChange }) {
  const labels = normalizeLabels(value);
  const [customDraft, setCustomDraft] = useState({});

  const toggle = (dim, opt) => {
    const cur = labels[dim] || [];
    const next = cur.includes(opt) ? cur.filter(x => x !== opt) : [...cur, opt];
    onChange({ ...labels, [dim]: next });
  };
  const addCustom = (dim) => {
    const raw = (customDraft[dim] || '').toLowerCase().trim();
    if (!raw) return;
    const cur = labels[dim] || [];
    if (!cur.includes(raw)) onChange({ ...labels, [dim]: [...cur, raw] });
    setCustomDraft(d => ({ ...d, [dim]: '' }));
  };

  return (
    <div className="space-y-5">
      {LABEL_DIMENSIONS.map(dim => {
        const selected = labels[dim.key] || [];
        const extras = selected.filter(s => !dim.options.includes(s));
        const allOpts = [...dim.options, ...extras];
        return (
          <div key={dim.key}>
            <div className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">{dim.label}</div>
            <div className="flex flex-wrap gap-1.5 items-center">
              {allOpts.map(opt => {
                const on = selected.includes(opt);
                return (
                  <button
                    key={opt}
                    onClick={() => toggle(dim.key, opt)}
                    className={'px-3 py-1 rounded-full text-xs border transition capitalize ' + (on ? 'text-white border-transparent' : 'border-stone-300 text-stone-600 hover:border-stone-500')}
                    style={on ? { background: '#1F1B16' } : {}}
                  >
                    {opt}
                  </button>
                );
              })}
              {dim.free && (
                <input
                  value={customDraft[dim.key] || ''}
                  onChange={e => setCustomDraft(d => ({ ...d, [dim.key]: e.target.value }))}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCustom(dim.key); } }}
                  onBlur={() => addCustom(dim.key)}
                  placeholder="+ add"
                  className="px-2.5 py-1 rounded-full text-xs border border-dashed border-stone-300 bg-transparent focus:outline-none focus:border-stone-500 w-24"
                />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function DetailView({ recipe, onBack, onEdit, onDelete, onStartCooking, onRegenerateMethods, onUpdate, onCreateShoppingList, onApplyFold, onRevertToOriginal, collections, onToggleCollection, onCreateCollection, scale, onScaleChange }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [viewMode, setViewMode] = useState(() => loadViewMode());
  const [checksAll, setChecksAll] = useState(() => loadChecks(recipe.id));
  const [generatingMethods, setGeneratingMethods] = useState(false);
  const [methodError, setMethodError] = useState('');

  // ---- Notes folding (recipe iteration) ----
  const [foldStage, setFoldStage] = useState('idle'); // idle | loading | review | error
  const [foldResult, setFoldResult] = useState(null);
  const [foldError, setFoldError] = useState('');
  const [foldApplying, setFoldApplying] = useState(false);
  const [showOriginal, setShowOriginal] = useState(false);
  const [showImportOriginal, setShowImportOriginal] = useState(false);
  const [confirmRevert, setConfirmRevert] = useState(false);

  const allNotes = migrateNotes(recipe.notes, recipe.createdAt);
  const unappliedNotes = allNotes.filter(n => !n.applied);
  const hasOriginal = !!recipe.original;

  // ---- Inline label editing ----
  const [editingLabels, setEditingLabels] = useState(false);
  const [labelDraft, setLabelDraft] = useState(null);
  const startEditLabels = () => { setLabelDraft(normalizeLabels(recipe.labels)); setEditingLabels(true); };
  const saveLabels = () => { onUpdate({ ...recipe, labels: labelDraft }); setEditingLabels(false); setLabelDraft(null); };
  const cancelLabels = () => { setEditingLabels(false); setLabelDraft(null); };

  // ---- Collections membership ----
  const [showCollectionMenu, setShowCollectionMenu] = useState(false);
  const [newColName, setNewColName] = useState('');
  const cols = collections || [];
  const memberOf = recipeCollectionIds(recipe);
  const memberCollections = cols.filter(c => memberOf.includes(c.id));
  const addNewCollectionAndJoin = () => {
    const name = newColName.trim();
    if (!name || !onCreateCollection) return;
    const id = onCreateCollection(name, '');
    if (id && onToggleCollection) onToggleCollection(recipe.id, id);
    setNewColName('');
  };

  const runFold = async () => {
    if (!isAiConfigured()) { setFoldError('AI isn’t set up. Open AI status on the home page to add your key.'); setFoldStage('error'); return; }
    if (unappliedNotes.length === 0) return;
    setFoldStage('loading');
    setFoldError('');
    try {
      const result = await aiFoldNotesIntoRecipe(recipe, unappliedNotes);
      setFoldResult(result);
      setFoldStage('review');
    } catch (e) {
      console.error('Notes fold failed:', e);
      setFoldError((e && e.message) || 'Something went wrong.');
      setFoldStage('error');
    }
  };

  const acceptFold = async () => {
    if (!foldResult || !onApplyFold) return;
    setFoldApplying(true);
    try {
      await onApplyFold(recipe.id, foldResult);
      setFoldStage('idle');
      setFoldResult(null);
    } catch (e) {
      console.error('Applying fold failed:', e);
      setFoldError((e && e.message) || 'Couldn’t save the revision.');
      setFoldStage('error');
    } finally {
      setFoldApplying(false);
    }
  };

  const cancelFold = () => { setFoldStage('idle'); setFoldResult(null); setFoldError(''); };

  const hasGuided = Array.isArray(recipe.guidedSteps) && recipe.guidedSteps.length > 0;
  const hasQuick  = Array.isArray(recipe.quickSteps)  && recipe.quickSteps.length > 0;
  const hasAnyStyled = hasGuided || hasQuick;

  // Method view state: resolve saved preference against what's actually available
  const initialMethodView = (() => {
    const saved = loadMethodView(recipe.id);
    if (saved) {
      if (saved.view === 'original') return { view: 'original', lastStyle: saved.lastStyle };
      if (saved.view === 'guided' && hasGuided) return { view: 'guided', lastStyle: 'guided' };
      if (saved.view === 'quick'  && hasQuick)  return { view: 'quick',  lastStyle: 'quick'  };
      // Saved style isn't available — fall back
      if (hasGuided) return { view: 'guided', lastStyle: 'guided' };
      if (hasQuick)  return { view: 'quick',  lastStyle: 'quick'  };
      return { view: 'original', lastStyle: 'guided' };
    }
    // No saved preference — default to Guided if present, else Quick, else original
    if (hasGuided) return { view: 'guided', lastStyle: 'guided' };
    if (hasQuick)  return { view: 'quick',  lastStyle: 'quick'  };
    return { view: 'original', lastStyle: 'guided' };
  })();
  const [methodView, setMethodViewRaw] = useState(initialMethodView.view);
  const [lastStyle, setLastStyleRaw]   = useState(initialMethodView.lastStyle);

  const switchMethodView = (newView) => {
    let newLast = lastStyle;
    if (newView === 'guided' || newView === 'quick') newLast = newView;
    setMethodViewRaw(newView);
    setLastStyleRaw(newLast);
    saveMethodView(recipe.id, newView, newLast);
  };

  const currentChecks = checksAll[viewMode] || {};
  const toggleCheck = (key) => {
    const nextView = { ...currentChecks, [key]: !currentChecks[key] };
    const next = { ...checksAll, [viewMode]: nextView };
    setChecksAll(next);
    saveChecks(recipe.id, next);
  };
  const anyChecked = Object.values(currentChecks).some(Boolean);
  const clearChecks = () => {
    const next = { ...checksAll, [viewMode]: {} };
    setChecksAll(next);
    saveChecks(recipe.id, next);
  };

  const totalMinutes = parseMinutes(recipe.prepTime) + parseMinutes(recipe.cookTime);
  const totalTime = totalMinutes > 0 ? formatMinutes(totalMinutes) : '';

  let stepSourceArray;
  if (methodView === 'guided' && hasGuided)      stepSourceArray = recipe.guidedSteps;
  else if (methodView === 'quick' && hasQuick)   stepSourceArray = recipe.quickSteps;
  else                                            stepSourceArray = recipe.steps || [];

  const originalCleaned = (recipe.steps || []).map(s => cleanRecipeText(s));
  const ovenTemps = extractOvenTemps(originalCleaned);
  const equipment = extractEquipmentFromSteps(originalCleaned);

  const cleanedSteps = stepSourceArray.map(s => cleanRecipeText(s));
  const visibleSteps = cleanedSteps
    .map(s => ovenTemps.length > 0 ? stripOvenTempFromStep(s) : s)
    .filter(s => s && s.length > 0);

  const stepIngredientRegex = buildIngredientRegex(recipe.ingredients);

  const handleRegenerateMethods = async () => {
    if (generatingMethods) return;
    setGeneratingMethods(true);
    setMethodError('');
    try {
      const { guided, quick } = await onRegenerateMethods();
      // If user has no view preference yet and a style just got generated, jump to it
      if (!hasGuided && guided && methodView === 'original') switchMethodView('guided');
      else if (!hasQuick && quick && !guided && methodView === 'original') switchMethodView('quick');
      const newlyMissing = [];
      if (!guided) newlyMissing.push('Guided');
      if (!quick)  newlyMissing.push('Quick');
      if (newlyMissing.length > 0 && newlyMissing.length === 2) {
        setMethodError('Couldn\u2019t generate either rewrite. Check AI status on the home page.');
      } else if (newlyMissing.length === 1) {
        setMethodError(newlyMissing[0] + ' rewrite didn\u2019t generate. You can retry.');
      }
    } catch (e) {
      setMethodError((e && e.message) || 'Generation failed.');
    } finally {
      setGeneratingMethods(false);
    }
  };

  return (
    <div className="max-w-3xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-8">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900 transition">
          <Icon name="arrowLeft" size={16} />
          All recipes
        </button>
        <div className="flex items-center gap-1">
          <button onClick={onEdit} className="p-2 rounded-full hover:bg-stone-200/60 transition text-stone-600" title="Edit">
            <Icon name="pencil" size={17} />
          </button>
          <button onClick={() => setConfirmDelete(true)} className="p-2 rounded-full hover:bg-stone-200/60 transition text-stone-600" title="Delete">
            <Icon name="trash" size={17} />
          </button>
        </div>
      </div>

      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight tracking-tight mb-3">{recipe.title}</h1>
      {recipe.description && (
        <p className="text-lg text-stone-600 leading-relaxed mb-6 max-w-2xl">{recipe.description}</p>
      )}

      {(() => {
        // "Adapted from [Author] at [Site]" — honest framing, since the app
        // reformats and rewrites the method. Links to the original when we have it.
        const site = recipe.sourceName || (recipe.source ? getDomain(recipe.source) : '');
        const author = recipe.sourceAuthor || '';
        if (!site && !author && !recipe.source) return null;
        const label = 'Adapted from ' + (author ? (author + (site ? ' at ' + site : '')) : (site || getDomain(recipe.source) || 'the original'));
        return (
          <p className={'text-sm text-stone-600 ' + (recipe.description ? '-mt-3 mb-6' : 'mb-6')}>
            {recipe.source ? (
              <a
                href={recipe.source}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-1.5 hover:text-stone-900 transition underline-offset-2 hover:underline"
                style={{ color: '#8C5A3A' }}
              >
                <Icon name="link" size={13} />
                {label}
              </a>
            ) : (
              <span style={{ color: '#8C5A3A' }}>{label}</span>
            )}
          </p>
        );
      })()}

      {recipe.importOriginal && (
        <button
          onClick={() => setShowImportOriginal(true)}
          className="mb-6 inline-flex items-center gap-1.5 text-xs text-stone-500 hover:text-stone-900 underline-offset-2 hover:underline"
        >
          Fixed some typos at import — view original text
        </button>
      )}

      {hasOriginal && (
        <div className="mb-6 px-4 py-3 rounded-2xl flex items-center justify-between flex-wrap gap-3" style={{ background: '#F1E8DC' }}>
          <span className="text-sm inline-flex items-center gap-2" style={{ color: '#6B5D45' }}>
            <span>✨</span> Refined from your notes.
          </span>
          <div className="flex items-center gap-4 text-sm">
            <button onClick={() => setShowOriginal(true)} className="underline-offset-2 hover:underline" style={{ color: '#6B5D45' }}>
              View original
            </button>
            <button onClick={() => setConfirmRevert(true)} className="underline-offset-2 hover:underline" style={{ color: '#B8543A' }}>
              Revert to original
            </button>
          </div>
        </div>
      )}

      <div className="mb-8">
        {!editingLabels ? (
          <div className="flex items-start justify-between gap-3">
            {(hasAnyLabels(recipe.labels) || cookTimeBucket(recipe))
              ? <RecipeLabelsDisplay recipe={recipe} />
              : <span className="text-sm text-stone-400 italic">No tags yet</span>}
            <button onClick={startEditLabels} className="text-xs text-stone-500 hover:text-stone-900 shrink-0 underline-offset-2 hover:underline">
              Edit tags
            </button>
          </div>
        ) : (
          <div className="p-4 rounded-2xl border border-stone-200 bg-white">
            <LabelsEditor value={labelDraft} onChange={setLabelDraft} />
            <div className="mt-4 flex justify-end gap-2">
              <button onClick={cancelLabels} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button onClick={saveLabels} style={{ background: '#1F1B16', color: '#FAF6EF' }} className="px-5 py-2 rounded-full text-sm font-medium">Save tags</button>
            </div>
          </div>
        )}
      </div>

      <div className="mb-8 flex items-center gap-3 flex-wrap">
        <div className="relative">
          <button
            onClick={() => setShowCollectionMenu(o => !o)}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 transition"
          >
            <Icon name="plus" size={13} strokeWidth={2.5} /> Add to collection
          </button>
          {showCollectionMenu && (
            <>
              <div className="fixed inset-0 z-10" onClick={() => setShowCollectionMenu(false)} />
              <div className="absolute left-0 mt-2 w-64 bg-white rounded-2xl shadow-lg border border-stone-200 p-2 z-20">
                {cols.length > 0 ? (
                  <ul className="max-h-56 overflow-auto">
                    {cols.map(c => {
                      const inIt = memberOf.includes(c.id);
                      return (
                        <li key={c.id}>
                          <button
                            onClick={() => onToggleCollection && onToggleCollection(recipe.id, c.id)}
                            className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-xl hover:bg-stone-100 text-left"
                          >
                            <span className={'inline-flex items-center justify-center w-4 h-4 rounded border shrink-0 ' + (inIt ? 'bg-stone-900 border-stone-900 text-white' : 'border-stone-300 bg-white')}>
                              {inIt && <Icon name="check" size={11} strokeWidth={3} />}
                            </span>
                            <span className="text-sm text-stone-800 truncate">{c.name}</span>
                          </button>
                        </li>
                      );
                    })}
                  </ul>
                ) : (
                  <p className="text-xs text-stone-500 px-2.5 py-2">No collections yet. Create your first below.</p>
                )}
                <div className="border-t border-stone-200 mt-1 pt-2 px-1">
                  <div className="flex items-center gap-1.5">
                    <input
                      value={newColName}
                      onChange={e => setNewColName(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addNewCollectionAndJoin(); } }}
                      placeholder="New collection…"
                      className="flex-1 min-w-0 px-2.5 py-1.5 rounded-lg text-sm border border-stone-200 focus:outline-none focus:border-stone-400"
                    />
                    <button
                      onClick={addNewCollectionAndJoin}
                      disabled={!newColName.trim()}
                      style={{ background: newColName.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
                      className="px-3 py-1.5 rounded-lg text-xs font-medium disabled:cursor-not-allowed shrink-0"
                    >
                      Add
                    </button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
        {memberCollections.map(c => (
          <button
            key={c.id}
            onClick={() => onToggleCollection && onToggleCollection(recipe.id, c.id)}
            title="Remove from collection"
            className="group inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs"
            style={{ background: '#E7DECB', color: '#6B5D45' }}
          >
            {c.name}
            <span className="text-stone-400 group-hover:text-red-700"><Icon name="x" size={11} strokeWidth={3} /></span>
          </button>
        ))}
      </div>

      <div className="flex flex-wrap items-center gap-x-6 gap-y-2 py-4 mb-8 border-y border-stone-200 text-sm text-stone-700">
        {(() => {
          const parsedSv = parseServings(recipe.servings);
          const sc = (scale && scale > 0) ? scale : 1;
          // Parseable servings: interactive stepper around base × scale.
          if (parsedSv) {
            const current = Math.max(1, Math.round(parsedSv.base * sc));
            const dec = () => onScaleChange && onScaleChange(Math.max(1, current - 1) / parsedSv.base);
            const inc = () => onScaleChange && onScaleChange((current + 1) / parsedSv.base);
            const onType = (v) => {
              const n = parseInt(String(v).replace(/[^\d]/g, ''), 10);
              if (Number.isFinite(n) && n >= 1) onScaleChange && onScaleChange(n / parsedSv.base);
            };
            const reset = () => onScaleChange && onScaleChange(1);
            return (
              <span className="inline-flex items-center gap-2">
                <span className="text-stone-400"><Icon name="users" size={15} /></span>
                <span className="inline-flex items-center rounded-full border border-stone-200 overflow-hidden">
                  <button onClick={dec} disabled={current <= 1} className="px-2.5 py-1 text-stone-600 hover:bg-stone-100 disabled:opacity-40 disabled:cursor-not-allowed" aria-label="Decrease">−</button>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={current}
                    onChange={e => onType(e.target.value)}
                    className="w-10 text-center font-medium bg-transparent focus:outline-none tabular-nums"
                  />
                  <button onClick={inc} className="px-2.5 py-1 text-stone-600 hover:bg-stone-100" aria-label="Increase">+</button>
                </span>
                {parsedSv.unit && <span className="text-stone-600">{parsedSv.unit}</span>}
                {sc !== 1 && (
                  <button onClick={reset} className="text-xs text-stone-400 hover:text-stone-700 underline-offset-2 hover:underline">reset</button>
                )}
              </span>
            );
          }
          // Unparseable servings: fall back to the literal string, no stepper.
          if (recipe.servings) {
            return (
              <span className="inline-flex items-center gap-2">
                <span className="text-stone-400"><Icon name="users" size={15} /></span>
                <span><b className="font-medium">{recipe.servings}</b></span>
              </span>
            );
          }
          return null;
        })()}
        {recipe.prepTime && (
          <span className="inline-flex items-center gap-2">
            <span className="text-stone-400"><Icon name="clock" size={15} /></span>
            <span>Prep <b className="font-medium">{recipe.prepTime}</b></span>
          </span>
        )}
        {recipe.cookTime && (
          <span className="inline-flex items-center gap-2">
            <span className="text-stone-400"><Icon name="chef" size={15} /></span>
            <span>Cook <b className="font-medium">{recipe.cookTime}</b></span>
          </span>
        )}
        {totalTime && (
          <span className="inline-flex items-center gap-2">
            <span className="text-stone-400"><Icon name="clock" size={15} /></span>
            <span>Total <b className="font-medium">{totalTime}</b></span>
          </span>
        )}
        {ovenTemps.length > 0 && (
          <span className="inline-flex items-center gap-2">
            <span className="text-stone-400"><Icon name="thermometer" size={15} /></span>
            <span>Oven <b className="font-medium">{ovenTemps.join(' \u2192 ')}</b></span>
          </span>
        )}
      </div>

      {equipment.length > 0 && (
        <div className="flex flex-wrap items-center gap-2 mb-8">
          <span className="text-xs uppercase tracking-[0.18em] text-stone-500 font-medium mr-1 inline-flex items-center gap-1.5">
            <Icon name="tools" size={13} />
            Equipment
          </span>
          {equipment.map(e => (
            <span key={e} className="text-xs px-2.5 py-1 rounded-full bg-stone-100 text-stone-700">{e}</span>
          ))}
        </div>
      )}

      <button
        onClick={onStartCooking}
        style={{ background: '#B8543A', color: '#FFFFFF' }}
        className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-full text-sm font-medium tracking-wide hover:opacity-90 transition mb-10"
      >
        <Icon name="chef" size={17} strokeWidth={2.2} />
        Start cooking
      </button>

      <section className="mb-10">
        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
          <div className="flex items-baseline gap-3">
            <h2 className="font-display text-sm uppercase tracking-[0.18em] text-stone-500 font-medium">Ingredients</h2>
            {anyChecked && viewMode !== 'preset' && (
              <button onClick={clearChecks} className="text-xs text-stone-500 hover:text-stone-800 underline-offset-2 hover:underline">
                Clear checks
              </button>
            )}
          </div>
          <ViewToggle value={viewMode} onChange={(m) => { setViewMode(m); saveViewMode(m); }} />
        </div>
        <IngredientsDisplay
          ingredients={recipe.ingredients}
          mode={viewMode}
          checks={currentChecks}
          onToggleCheck={toggleCheck}
          scale={scale}
        />
        {viewMode === 'shopping' && (recipe.ingredients || []).length > 0 && (() => {
          const { total, unchecked } = countUncheckedShopping(recipe.ingredients, currentChecks);
          if (total === 0) return null;
          const allHave = unchecked === 0;
          return (
            <div className="mt-6 pt-5 border-t border-stone-200">
              <p className="text-xs text-stone-500 mb-3">Check off what you already have, then create a list of what to buy.</p>
              <button
                onClick={() => onCreateShoppingList && onCreateShoppingList()}
                disabled={allHave}
                style={{ background: allHave ? '#A8A19A' : '#1F1B16', color: '#FAF6EF' }}
                className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium tracking-wide hover:opacity-90 transition disabled:cursor-not-allowed"
                title={allHave ? 'You have everything — nothing to buy.' : ''}
              >
                <Icon name="shoppingCart" size={15} strokeWidth={2.2} />
                {allHave ? 'You have everything' : ('Create shopping list (' + unchecked + ')')}
              </button>
            </div>
          );
        })()}
      </section>

      <section className="mb-10">
        <div className="flex items-baseline justify-between gap-3 mb-5 flex-wrap">
          <h2 className="font-display text-sm uppercase tracking-[0.18em] text-stone-500 font-medium">Method</h2>
          <div className="inline-flex items-center gap-3 flex-wrap">
            {hasAnyStyled && (
              <MethodToggle
                value={lastStyle}
                onChange={(v) => switchMethodView(v)}
                hasGuided={hasGuided}
                hasQuick={hasQuick}
                active={methodView !== 'original'}
              />
            )}
            {hasAnyStyled && (
              <button
                onClick={() => switchMethodView(methodView === 'original' ? lastStyle : 'original')}
                className={'text-xs underline-offset-2 hover:underline ' + (methodView === 'original' ? 'text-stone-700' : 'text-stone-400 hover:text-stone-700')}
              >
                {methodView === 'original' ? 'Hide original' : 'View original'}
              </button>
            )}
            {isAiConfigured() && (!hasGuided || !hasQuick) && (
              <button
                onClick={handleRegenerateMethods}
                disabled={generatingMethods}
                className="text-xs text-stone-600 hover:text-stone-900 inline-flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed"
              >
                {generatingMethods
                  ? (<><Spinner />{' Generating\u2026'}</>)
                  : (!hasGuided && !hasQuick
                      ? (<>{'\u2728 Generate styled versions'}</>)
                      : (<>{'\u2728 Generate ' + (!hasGuided ? 'Guided' : 'Quick')}</>))}
              </button>
            )}
          </div>
        </div>
        {methodError && (
          <div className="mb-4 px-4 py-2.5 rounded-xl text-xs" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
            {methodError}
          </div>
        )}
        <ol className="space-y-5">
          {visibleSteps.map((step, i) => {
            const annotated = annotateStep(step, recipe.ingredients, scale, recipe.partials, i);
            const { optional: stepOptional, text: stepText } = extractOptional(annotated);
            const time = extractStepTime(step);
            return (
              <li key={i} className="flex gap-4">
                <span className="font-display text-3xl text-stone-300 leading-none w-8 shrink-0">
                  {String(i + 1).padStart(2, '0')}
                </span>
                <div className="pt-1.5 flex-1">
                  <p className="text-[16px] leading-relaxed text-stone-800">
                    {stepOptional && (
                      <span className="text-xs italic text-stone-400 mr-1.5">optional</span>
                    )}
                    {renderStepWithBoldIngredients(stepText, stepIngredientRegex)}
                  </p>
                  {time && (
                    <span className="mt-2 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-stone-100 text-stone-600 text-xs font-medium">
                      <Icon name="clock" size={11} />
                      {time}
                    </span>
                  )}
                </div>
              </li>
            );
          })}
        </ol>
      </section>

      <NotesSection recipe={recipe} onUpdate={onUpdate} onApplyNotes={runFold} foldBusy={foldStage === 'loading'} />

      {foldStage === 'error' && (
        <div onClick={cancelFold} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Couldn't apply notes</h3>
            <p className="text-sm text-stone-600 mb-5">{foldError}</p>
            <div className="flex justify-end gap-2">
              <button onClick={cancelFold} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Close</button>
              <button onClick={runFold} style={{ background: '#1F1B16', color: '#FAF6EF' }} className="px-5 py-2 rounded-full text-sm font-medium">Try again</button>
            </div>
          </div>
        </div>
      )}

      {foldStage === 'review' && foldResult && (
        <div onClick={cancelFold} className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center sm:p-6 z-50">
          <div onClick={e => e.stopPropagation()} className="w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl p-6 max-h-[85vh] overflow-auto">
            <h3 className="font-display text-2xl mb-1">Review the changes</h3>
            <p className="text-sm text-stone-500 mb-5">Nothing is saved until you accept.</p>

            {!foldResult.changed ? (
              <div className="px-4 py-3 rounded-xl text-sm mb-5" style={{ background: '#F3EEE3', color: '#5A5044' }}>
                None of your notes call for a change — they read as observations. Nothing to apply.
              </div>
            ) : (
              <>
                <div className="mb-5">
                  <h4 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">What changed</h4>
                  <ul className="space-y-1.5">
                    {foldResult.summary.map((s, i) => (
                      <li key={i} className="text-[15px] text-stone-800 flex gap-2">
                        <span style={{ color: '#B8543A' }} className="mt-1.5 shrink-0" ><span className="block w-1.5 h-1.5 rounded-full" style={{ background: '#B8543A' }} /></span>
                        {s}
                      </li>
                    ))}
                    {foldResult.summary.length === 0 && <li className="text-sm text-stone-500 italic">No summary provided.</li>}
                  </ul>
                </div>

                {foldResult.applied.length > 0 && (
                  <div className="mb-4">
                    <h4 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Notes applied</h4>
                    <ul className="space-y-2">
                      {foldResult.applied.map((a, i) => {
                        const n = allNotes.find(x => x.id === a.id);
                        return (
                          <li key={i} className="text-sm text-stone-700 p-3 rounded-xl" style={{ background: '#F1E8DC' }}>
                            <span className="text-stone-800">{n ? n.text : a.id}</span>
                            {a.change && <span className="block text-xs text-stone-500 mt-1">→ {a.change}</span>}
                          </li>
                        );
                      })}
                    </ul>
                  </div>
                )}
              </>
            )}

            {foldResult.skipped.length > 0 && (
              <div className="mb-5">
                <h4 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Skipped ({foldResult.skipped.length})</h4>
                <ul className="space-y-1.5">
                  {foldResult.skipped.map((a, i) => {
                    const n = allNotes.find(x => x.id === a.id);
                    return <li key={i} className="text-sm text-stone-500">{n ? n.text : a.id}</li>;
                  })}
                </ul>
              </div>
            )}

            <div className="flex justify-end gap-2 pt-2 border-t border-stone-200 mt-2">
              <button onClick={cancelFold} disabled={foldApplying} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100 disabled:opacity-50">Discard</button>
              {foldResult.changed && (
                <button
                  onClick={acceptFold}
                  disabled={foldApplying}
                  style={{ background: '#1F1B16', color: '#FAF6EF' }}
                  className="px-5 py-2 rounded-full text-sm font-medium inline-flex items-center gap-2 disabled:opacity-60"
                >
                  {foldApplying ? (<><Spinner /> Saving & rewriting…</>) : 'Accept changes'}
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      {showOriginal && hasOriginal && (
        <div onClick={() => setShowOriginal(false)} className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center sm:p-6 z-50">
          <div onClick={e => e.stopPropagation()} className="w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl p-6 max-h-[85vh] overflow-auto">
            <div className="flex items-center justify-between mb-1">
              <h3 className="font-display text-2xl">Original version</h3>
              <button onClick={() => setShowOriginal(false)} className="p-1.5 rounded-full hover:bg-stone-200/60"><Icon name="x" size={18} /></button>
            </div>
            <p className="text-sm text-stone-500 mb-5">Before any notes were folded in.</p>
            <h4 className="font-display text-lg mb-2">{recipe.original.title}</h4>
            <div className="mb-5">
              <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Ingredients</h5>
              <ul className="space-y-1.5">
                {(recipe.original.ingredients || []).map((ing, i) => {
                  const { optional, text } = extractOptional(formatIngredient(ing));
                  return (
                    <li key={i} className="text-[15px] text-stone-700 flex gap-2">
                      <span className="text-stone-300 mt-1.5" style={{ fontSize: '7px' }}>●</span>
                      <span>
                        {optional && <span className="text-xs italic text-stone-400 mr-1.5">optional</span>}
                        {text}
                      </span>
                    </li>
                  );
                })}
              </ul>
            </div>
            <div>
              <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Method</h5>
              <ol className="space-y-3">
                {(recipe.original.steps || []).map((s, i) => {
                  const { optional, text } = extractOptional(cleanRecipeText(s));
                  return (
                    <li key={i} className="text-[15px] text-stone-700 flex gap-3">
                      <span className="font-display text-stone-300">{i + 1}</span>
                      <span>
                        {optional && <span className="text-xs italic text-stone-400 mr-1.5">optional</span>}
                        {text}
                      </span>
                    </li>
                  );
                })}
              </ol>
            </div>
          </div>
        </div>
      )}

      {confirmRevert && (
        <div onClick={() => setConfirmRevert(false)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Revert to original?</h3>
            <p className="text-sm text-stone-600 mb-5">This undoes all folded-in changes and restores the first version. Your notes stay, but lose their "applied" mark.</p>
            <div className="flex justify-end gap-2">
              <button onClick={() => setConfirmRevert(false)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button
                onClick={() => { onRevertToOriginal && onRevertToOriginal(recipe.id); setConfirmRevert(false); }}
                style={{ background: '#B8543A', color: '#FFF' }}
                className="px-5 py-2 rounded-full text-sm font-medium"
              >
                Revert
              </button>
            </div>
          </div>
        </div>
      )}

      {showImportOriginal && recipe.importOriginal && (
        <div onClick={() => setShowImportOriginal(false)} className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center sm:p-6 z-50">
          <div onClick={e => e.stopPropagation()} className="w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl p-6 max-h-[85vh] overflow-auto">
            <div className="flex items-center justify-between mb-1">
              <h3 className="font-display text-2xl">Original imported text</h3>
              <button onClick={() => setShowImportOriginal(false)} className="p-1.5 rounded-full hover:bg-stone-200/60"><Icon name="x" size={18} /></button>
            </div>
            <p className="text-sm text-stone-500 mb-5">As pulled from the source, before typo cleanup.</p>
            {recipe.importOriginal.title && recipe.importOriginal.title !== recipe.title && (
              <div className="mb-4">
                <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-1">Title</h5>
                <p className="text-[15px] text-stone-700">{recipe.importOriginal.title}</p>
              </div>
            )}
            {recipe.importOriginal.description && recipe.importOriginal.description !== recipe.description && (
              <div className="mb-4">
                <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-1">Description</h5>
                <p className="text-[15px] text-stone-700 leading-relaxed">{recipe.importOriginal.description}</p>
              </div>
            )}
            {(recipe.importOriginal.ingredients || []).length > 0 && (
              <div className="mb-5">
                <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Ingredients</h5>
                <ul className="space-y-1.5">
                  {recipe.importOriginal.ingredients.map((ing, i) => (
                    <li key={i} className="text-[15px] text-stone-700 flex gap-2">
                      <span className="text-stone-300 mt-1.5" style={{ fontSize: '7px' }}>●</span>
                      <span>{ing}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
            {(recipe.importOriginal.steps || []).length > 0 && (
              <div>
                <h5 className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium mb-2">Method</h5>
                <ol className="space-y-3">
                  {recipe.importOriginal.steps.map((s, i) => (
                    <li key={i} className="text-[15px] text-stone-700 flex gap-3">
                      <span className="font-display text-stone-300">{i + 1}</span>
                      <span>{s}</span>
                    </li>
                  ))}
                </ol>
              </div>
            )}
          </div>
        </div>
      )}

      {confirmDelete && (
        <div onClick={() => setConfirmDelete(false)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Delete this recipe?</h3>
            <p className="text-sm text-stone-600 mb-5">
              "{recipe.title}" will be removed permanently. This can't be undone.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setConfirmDelete(false)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button onClick={onDelete} className="px-4 py-2 rounded-full text-sm text-white bg-red-700 hover:bg-red-800">Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Shopping list (built on demand from a single recipe) ----------
function ShoppingListView({ recipe, scale, pantry, onBack }) {
  // Compute the binned list once at mount from the saved "I have this at home" checks.
  // The shopping list itself isn't persisted — we regenerate it from the recipe + checks
  // whenever the user opens this view.
  const pantrySet = useMemo(() => pantryNameSet(pantry || []), [pantry]);
  const fullList = useMemo(() => {
    const allChecks = loadChecks(recipe.id) || {};
    const shoppingChecks = allChecks.shopping || {};
    return buildShoppingList(recipe.ingredients || [], shoppingChecks, scale, pantrySet);
  }, [recipe.id, recipe.ingredients, scale, pantrySet]);

  // Session-only override: pantry items the user has manually moved back onto the buy
  // list ("I'm actually out of this"). Resets when the view unmounts.
  const [pantryOverrides, setPantryOverrides] = useState({}); // key -> true means "I do need to buy this"
  const overrideAdd = (key) => setPantryOverrides(o => ({ ...o, [key]: true }));
  const overrideClear = (key) => setPantryOverrides(o => { const n = { ...o }; delete n[key]; return n; });

  // Effective lists, applying overrides:
  const initialList = useMemo(() => {
    const overriddenItems = (fullList.pantry || []).filter(it => pantryOverrides[it.key]);
    if (overriddenItems.length === 0) return fullList.bins;
    // Drop overridden items back into their original bins.
    const cloned = fullList.bins.map(s => ({ ...s, items: [...s.items] }));
    for (const it of overriddenItems) {
      let sec = cloned.find(s => s.binId === it.binId);
      if (!sec) {
        sec = { binId: it.binId, label: SHOPPING_BIN_LABELS[it.binId] || it.binId, items: [] };
        cloned.push(sec);
      }
      sec.items.push({ display: it.display, raw: it.raw, key: it.key });
    }
    return cloned;
  }, [fullList, pantryOverrides]);
  const pantryItems = useMemo(() => (fullList.pantry || []).filter(it => !pantryOverrides[it.key]), [fullList, pantryOverrides]);

  // Local "I bought this" ticks for the user to cross items off as they shop.
  // Not persisted — gone when they leave this view.
  const [bought, setBought] = useState({});
  const toggleBought = (key) => setBought(b => ({ ...b, [key]: !b[key] }));

  const [copyState, setCopyState] = useState('idle'); // idle | copied | failed
  const [copyError, setCopyError] = useState('');

  const totalItems = initialList.reduce((sum, sec) => sum + sec.items.length, 0);

  const buildPlainText = () => {
    const lines = [];
    lines.push('Shopping list — ' + recipe.title);
    lines.push('');
    for (const sec of initialList) {
      lines.push(sec.label.toUpperCase());
      for (const it of sec.items) {
        lines.push('- ' + it.display);
      }
      lines.push('');
    }
    return lines.join('\n').trim() + '\n';
  };

  const handleCopy = async () => {
    const text = buildPlainText();
    setCopyError('');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        // Fallback for older browsers / non-secure contexts.
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (!ok) throw new Error('Copy command was rejected by the browser.');
      }
      setCopyState('copied');
      setTimeout(() => setCopyState('idle'), 2000);
    } catch (e) {
      setCopyState('failed');
      setCopyError((e && e.message) || 'Couldn’t copy to clipboard.');
    }
  };

  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-8">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          Back to recipe
        </button>
      </div>

      <p className="text-xs uppercase tracking-[0.18em] text-stone-500 font-medium mb-2">Shopping list</p>
      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight tracking-tight mb-3">{recipe.title}</h1>
      <p className="text-stone-500 mb-10">
        {totalItems === 0 && pantryItems.length === 0
          ? 'You have everything — nothing to buy.'
          : totalItems === 0
            ? 'Nothing to buy — everything you need is in your pantry.'
            : (totalItems + ' item' + (totalItems === 1 ? '' : 's') + ' to buy' + (pantryItems.length > 0 ? ' \u00b7 ' + pantryItems.length + ' covered by pantry' : '') + '.')}
      </p>

      {(totalItems > 0 || pantryItems.length > 0) && (
        <>
          {totalItems > 0 && (
            <div className="space-y-6 mb-10">
              {initialList.map(sec => (
                <BinSection key={sec.binId} title={sec.label}>
                  <ul className="space-y-2.5">
                    {sec.items.map(item => {
                      const isBought = !!bought[item.key];
                      const { optional, text: displayText } = extractOptional(item.display);
                      const isOverride = !!pantryOverrides[item.key];
                      return (
                        <li key={item.key} className="flex gap-3 text-[15px] leading-relaxed">
                          <button
                            onClick={() => toggleBought(item.key)}
                            className="mt-0.5 shrink-0"
                            aria-label={isBought ? 'Uncheck' : 'Check'}
                          >
                            <span className={'inline-flex items-center justify-center w-4 h-4 rounded border transition ' + (
                              isBought ? 'bg-stone-900 border-stone-900 text-white' : 'border-stone-300 hover:border-stone-500 bg-white'
                            )}>
                              {isBought && <Icon name="check" size={11} strokeWidth={3} />}
                            </span>
                          </button>
                          <span className={'text-stone-800 flex-1 ' + (isBought ? 'line-through opacity-50' : '')}>
                            {optional && <span className="text-xs italic text-stone-400 mr-1.5">optional</span>}
                            {displayText}
                          </span>
                          {isOverride && (
                            <button
                              onClick={() => overrideClear(item.key)}
                              className="text-xs text-stone-400 hover:text-stone-700 underline-offset-2 hover:underline shrink-0"
                              title="Move back to pantry — I do have this"
                            >
                              have it
                            </button>
                          )}
                        </li>
                      );
                    })}
                  </ul>
                </BinSection>
              ))}
            </div>
          )}

          {pantryItems.length > 0 && (
            <div className="mb-10 rounded-2xl px-5 py-4" style={{ background: '#F1E8DC' }}>
              <div className="flex items-baseline justify-between gap-2 mb-3">
                <h3 className="text-xs uppercase tracking-[0.15em] font-medium" style={{ color: '#6B5D45' }}>Already in your pantry</h3>
                <span className="text-xs" style={{ color: '#8C7A5A' }}>not on buy list</span>
              </div>
              <ul className="space-y-2">
                {pantryItems.map(item => {
                  const { optional, text: displayText } = extractOptional(item.display);
                  return (
                    <li key={item.key} className="flex items-baseline justify-between gap-3 text-[15px]">
                      <span className="text-stone-600">
                        {optional && <span className="text-xs italic text-stone-400 mr-1.5">optional</span>}
                        {displayText}
                      </span>
                      <button
                        onClick={() => overrideAdd(item.key)}
                        className="text-xs underline-offset-2 hover:underline shrink-0"
                        style={{ color: '#B8543A' }}
                        title="I'm actually out — put it on the buy list"
                      >
                        I need this
                      </button>
                    </li>
                  );
                })}
              </ul>
            </div>
          )}

          <div className="flex flex-wrap gap-2 pt-6 border-t border-stone-200">
            <button
              onClick={handleCopy}
              style={{ background: '#1F1B16', color: '#FAF6EF' }}
              className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              {copyState === 'copied' ? (<><Icon name="check" size={14} strokeWidth={3} /> Copied</>) : 'Copy as text'}
            </button>
            <button
              onClick={onBack}
              className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-100"
            >
              Done
            </button>
          </div>
          {copyState === 'failed' && (
            <div className="mt-3 px-4 py-3 rounded-xl text-xs leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
              Couldn’t copy: {copyError}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ---------- Complete (placeholder for failed imports) ----------
function CompleteView({ recipe, onBack, onEdit, onDelete, onRetry }) {
  const [retrying, setRetrying] = useState(false);
  const [retryError, setRetryError] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(false);

  const handleRetry = async () => {
    setRetrying(true);
    setRetryError('');
    try {
      const r = await onRetry();
      if (r && !r.ok) setRetryError(r.error || 'Still failed');
    } catch (e) {
      setRetryError((e && e.message) || 'Still failed');
    } finally {
      setRetrying(false);
    }
  };

  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-12">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          Back
        </button>
      </div>

      <div className="mb-6">
        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium uppercase tracking-wider" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
          <Icon name="alert" size={10} strokeWidth={3} />
          Needs attention
        </span>
      </div>

      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight tracking-tight mb-3">{recipe.title}</h1>

      {recipe.source && (
        <p className="text-sm text-stone-500 break-all mb-6">
          <a href={recipe.source} target="_blank" rel="noopener noreferrer" className="hover:text-stone-900 underline underline-offset-2">
            {recipe.source}
          </a>
        </p>
      )}

      <div className="mb-8 px-4 py-3 rounded-xl text-sm leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
        <span className="font-medium">Import didn’t complete.</span>{' '}
        {recipe.failureReason || 'Couldn\u2019t extract the recipe from this page.'}
      </div>

      <div className="space-y-3">
        <p className="text-sm font-medium text-stone-700">Complete this recipe:</p>
        <div className="flex flex-wrap gap-2">
          <button
            onClick={handleRetry}
            disabled={retrying || !recipe.source}
            style={{ background: (retrying || !recipe.source) ? '#A8A19A' : '#1F1B16', color: '#FAF6EF' }}
            className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium disabled:cursor-not-allowed"
          >
            {retrying ? (<><Spinner />{' Retrying\u2026'}</>) : 'Retry import'}
          </button>
          <button
            onClick={onEdit}
            className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-100"
          >
            Edit manually
          </button>
          <button
            onClick={() => setConfirmDelete(true)}
            className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium text-red-700 hover:bg-red-50"
          >
            Delete this card
          </button>
        </div>
        {retryError && (
          <div className="mt-3 px-4 py-3 rounded-xl text-xs leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
            Still couldn’t import: {retryError}
          </div>
        )}
      </div>

      {confirmDelete && (
        <div onClick={() => setConfirmDelete(false)} className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-display text-xl mb-2">Delete this card?</h3>
            <p className="text-sm text-stone-600 mb-5">
              "{recipe.title}" will be removed. You can add the link again any time.
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setConfirmDelete(false)} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">Cancel</button>
              <button onClick={onDelete} className="px-4 py-2 rounded-full text-sm text-white bg-red-700 hover:bg-red-800">Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Add (URL ingest + paste page text) ----------
function AddView({ onCancel, onManual, onBuild, onAdd, onOpen, onDone }) {
  // Mode toggle: 'url' (default, paste a link) or 'text' (paste page text for AI extraction).
  const [mode, setMode] = useState('url');

  // URL-mode state (unchanged from before).
  const [input, setInput] = useState('');
  const [results, setResults] = useState([]);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  const [error, setError] = useState('');
  const [cancelled, setCancelled] = useState(false);

  // Holds the in-flight AbortController for whichever import path is running so
  // the Cancel button can abort fetches and AI calls mid-stride.
  const abortRef = useRef(null);
  const cancelImport = () => {
    if (abortRef.current) {
      try { abortRef.current.abort(); } catch (e) {}
    }
  };
  const resetImportState = () => {
    abortRef.current = null;
    setInput('');
    setResults([]);
    setRunning(false);
    setFinished(false);
    setError('');
    setCancelled(false);
    setPasteText('');
    setPasteUrl('');
    setPasteError('');
    setTextStatus('idle');
    setTextResult(null);
    setFindStatus('idle');
    setFindResult(null);
    setFindError('');
  };

  // Text-mode state.
  const [pasteText, setPasteText]   = useState('');
  const [pasteUrl, setPasteUrl]     = useState('');
  const [pasteError, setPasteError] = useState('');
  // textStatus: 'idle' | 'loading' | 'rewriting' | 'done' | 'partial' | 'no-recipe' | 'fail' | 'cancelled'
  const [textStatus, setTextStatus] = useState('idle');
  const [textResult, setTextResult] = useState(null); // { recipeId, title, missing }

  // Find-a-dish mode state.
  const [findQuery, setFindQuery]   = useState('');
  // findStatus: 'idle' | 'searching' | 'done' | 'empty' | 'fail' | 'cancelled'
  const [findStatus, setFindStatus] = useState('idle');
  const [findResult, setFindResult] = useState(null); // { note, overview, plainOverview, candidates }
  const [findError, setFindError]   = useState('');
  const [compareStyle, setCompareStyle] = useState('recipe'); // 'recipe' | 'plain'

  const runFind = async () => {
    const q = findQuery.trim();
    if (!q) return;
    if (!isAiConfigured()) {
      setFindError('AI isn\u2019t set up. Open AI status on the home page to add your key.');
      setFindStatus('fail');
      return;
    }
    setFindStatus('searching');
    setFindResult(null);
    setFindError('');

    const controller = new AbortController();
    abortRef.current = controller;
    const signal = controller.signal;

    try {
      const found = await aiFindAndCompare(q, signal);
      if (signal.aborted) { setFindStatus('cancelled'); return; }
      if (!found) {
        setFindStatus('empty');
        return;
      }
      setFindResult(found);
      setCompareStyle('recipe');
      setFindStatus('done');
    } catch (e) {
      if (isCancelled(e, signal)) { setFindStatus('cancelled'); return; }
      console.error('Find & compare failed:', e);
      setFindError((e && e.message) || 'Something went wrong.');
      setFindStatus('fail');
    } finally {
      abortRef.current = null;
    }
  };

  // Importing a picked candidate rides the existing URL import pipeline — same
  // cleanup, tagging, duplicate detection, and 403 → paste-text safety net.
  const importCandidate = (url) => {
    setMode('url');
    setInput(url);
    importBatch('fresh', [url]);
  };

  const isValidUrl = (s) => {
    try { const u = new URL(s.trim()); return u.protocol === 'http:' || u.protocol === 'https:'; }
    catch (e) { return false; }
  };

  const dedupedUrls = [...new Set(
    input.split(/[\s,;]+/).map(s => s.trim()).filter(s => s && isValidUrl(s))
  )];

  const shortenUrl = (url) => {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\./, '');
      let path = u.pathname.replace(/\/$/, '');
      const max = 48;
      if ((host + path).length > max) {
        const left = Math.max(8, max - host.length - 1);
        path = path.slice(0, left) + '\u2026';
      }
      return host + path;
    } catch (e) { return url; }
  };

  const importBatch = async (mode, urlsOverride) => {
    setError('');
    setRunning(true);
    setFinished(false);
    setCancelled(false);

    const controller = new AbortController();
    abortRef.current = controller;
    const signal = controller.signal;

    let local;
    if (mode === 'retry') {
      local = results.map(r => r.status === 'error' ? { url: r.url, status: 'pending' } : r);
    } else {
      const urls = Array.isArray(urlsOverride) && urlsOverride.length > 0 ? urlsOverride : dedupedUrls;
      local = urls.map(url => ({ url, status: 'pending' }));
    }
    setResults(local);

    for (let i = 0; i < local.length; i++) {
      if (signal.aborted) break; // cancelled before starting this row
      if (local[i].status !== 'pending') continue;
      local[i] = { url: local[i].url, status: 'loading' };
      setResults([...local]);
      try {
        const persisted = loadRecipes() || [];

        // If there's an existing incomplete placeholder for this URL, this is a retry of
        // a previously failed import. The shared helper grafts its identity onto the
        // parsed result so we replace the placeholder rather than create a sibling.
        const placeholder = findIncompletePlaceholderForUrl(local[i].url, persisted);

        let recipe = await buildRecipeFromUrl(local[i].url, placeholder, (stage) => {
          if (stage === 'extracting') {
            local[i] = { url: local[i].url, status: 'extracting' };
            setResults([...local]);
          } else if (stage === 'rewriting') {
            local[i] = { url: local[i].url, status: 'rewriting' };
            setResults([...local]);
          }
        }, signal);

        // Cancellation that snuck in between awaits — bail without saving.
        if (signal.aborted) break;

        // Auto-extraction can yield a partial recipe — save it as a needs-attention card
        // (with whatever was found) and surface the manual-paste pivot, mirroring N1.
        if (recipe.incomplete) {
          onAdd(recipe);
          local[i] = { url: local[i].url, status: 'error', recipeId: recipe.id, error: recipe.failureReason || 'Partial recipe — needs attention.' };
          setResults([...local]);
          continue;
        }

        const match = findDuplicateRecipe(recipe, persisted);

        // Hard duplicate (same URL, or same title with no URL conflict) → skip by default,
        // but stash the candidate so the user can choose "Import anyway" from the result row.
        if (match && match.type === 'duplicate') {
          local[i] = {
            url: local[i].url,
            status: 'duplicate',
            duplicateId: match.match.id,
            duplicateTitle: match.match.title,
            pendingRecipe: recipe,
          };
          setResults([...local]);
          continue;
        }

        // Ambiguous (same title, different URLs) → hold for user decision.
        if (match && match.type === 'ambiguous') {
          local[i] = {
            url: local[i].url,
            status: 'ambiguous',
            pendingRecipe: recipe,
            existingId: match.match.id,
            existingTitle: match.match.title,
          };
          setResults([...local]);
          continue;
        }

        onAdd(recipe);
        local[i] = { url: local[i].url, status: 'success', recipeId: recipe.id, guided: !!recipe.guidedSteps, quick: !!recipe.quickSteps, completedPlaceholder: !!placeholder };
      } catch (e) {
        // Cancel is not a failure — abandon this row without leaving a placeholder behind.
        if (isCancelled(e, signal)) {
          local[i] = { url: local[i].url, status: 'pending' };
          break;
        }
        const errMsg = (e && e.message) || 'Failed to import';
        // Save (or update) an incomplete placeholder so the link isn't lost.
        const persisted = loadRecipes() || [];
        const existing = findIncompletePlaceholderForUrl(local[i].url, persisted);
        if (existing) {
          onAdd({ ...existing, failureReason: errMsg });
          local[i] = { url: local[i].url, status: 'error', recipeId: existing.id, error: errMsg };
        } else {
          const placeholder = makePlaceholderRecipe(local[i].url, errMsg);
          onAdd(placeholder);
          local[i] = { url: local[i].url, status: 'error', recipeId: placeholder.id, error: errMsg };
        }
      }
      setResults([...local]);
    }

    // Mark anything not finished as cancelled (the row currently in flight + queued rows).
    if (signal.aborted) {
      local = local.map(r => (r.status === 'pending' || r.status === 'loading' || r.status === 'extracting' || r.status === 'rewriting')
        ? { url: r.url, status: 'cancelled' }
        : r);
      setResults([...local]);
      setCancelled(true);
    }

    abortRef.current = null;
    setRunning(false);
    setFinished(true);

    const anyUnresolved   = local.some(r => r.status === 'error' || r.status === 'ambiguous' || r.status === 'duplicate');
    const successIds      = local.filter(r => r.status === 'success').map(r => r.recipeId);
    const duplicateIds    = local.filter(r => r.status === 'duplicate').map(r => r.duplicateId);
    const errorIds        = local.filter(r => r.status === 'error' && r.recipeId).map(r => r.recipeId);
    const doneIds = [...successIds, ...duplicateIds, ...errorIds];
    if (!anyUnresolved && !signal.aborted && doneIds.length > 0) onDone(doneIds);
  };

  const submit = () => {
    if (dedupedUrls.length === 0) {
      setError('Paste one or more recipe URLs.');
      return;
    }
    importBatch('fresh');
  };

  // Validate optional URL field. Empty is OK; if filled, must look like a URL.
  const isPasteUrlValid = () => {
    const v = (pasteUrl || '').trim();
    if (!v) return true;
    try {
      const u = new URL(v);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch (e) { return false; }
  };

  const submitText = async () => {
    setPasteError('');
    const text = (pasteText || '').trim();
    if (text.length < 40) {
      setPasteError('Paste the full page text (at least a few sentences).');
      return;
    }
    if (!isPasteUrlValid()) {
      setPasteError('That source URL doesn\u2019t look right \u2014 leave it blank or fix it.');
      return;
    }
    if (!isAiConfigured()) {
      setPasteError('AI isn\u2019t set up. Open AI status on the home page to add your key.');
      return;
    }

    setTextStatus('loading');
    setTextResult(null);

    const controller = new AbortController();
    abortRef.current = controller;
    const signal = controller.signal;

    try {
      const built = await buildRecipeFromText(text, (pasteUrl || '').trim(), (stage) => {
        if (stage === 'rewriting') setTextStatus('rewriting');
      }, signal);

      if (signal.aborted) {
        setTextStatus('cancelled');
        return;
      }

      if (!built) {
        setTextStatus('no-recipe');
        return;
      }

      // Duplicate check (only meaningful if we have a URL or a confident title).
      const persisted = loadRecipes() || [];
      const match = findDuplicateRecipe(built.recipe, persisted);

      // Both hard duplicate (same URL or same title) and ambiguous (same title, different URL)
      // share a single "this looks like a duplicate" state in the text-paste flow.
      // The user can choose to override; the suffix logic keeps things distinguishable.
      if (match && (match.type === 'duplicate' || match.type === 'ambiguous')) {
        setTextStatus('duplicate');
        setTextResult({
          duplicateType: match.type,
          duplicateId: match.match.id,
          duplicateTitle: match.match.title,
          pendingRecipe: built.recipe,
        });
        return;
      }

      onAdd(built.recipe);
      setTextStatus(built.partial ? 'partial' : 'done');
      setTextResult({
        recipeId: built.recipe.id,
        title: built.recipe.title,
        missing: built.missing || [],
      });
    } catch (e) {
      if (isCancelled(e, signal)) {
        // Cancel is not a failure — drop everything, leave no placeholder.
        setTextStatus('cancelled');
        return;
      }
      console.error('Text-paste extraction failed:', e);
      setTextStatus('fail');
      setTextResult({ error: (e && e.message) || 'Something went wrong.' });
    } finally {
      abortRef.current = null;
    }
  };

  // Apply the lowest-unused suffix and save when the user overrides a text-paste duplicate.
  const forceImportTextDuplicate = () => {
    if (!textResult || !textResult.pendingRecipe) return;
    const persisted = loadRecipes() || [];
    const newTitle = titleWithLowestUnusedSuffix(textResult.pendingRecipe.title, persisted);
    const r = { ...textResult.pendingRecipe, title: newTitle };
    onAdd(r);
    setTextStatus('done');
    setTextResult({
      recipeId: r.id,
      title: r.title,
      missing: [],
    });
  };

  // Reactive entry point: from a failed URL row, jump to text-paste mode with
  // the failed URL pre-filled as the eventual source.
  const pivotToTextPaste = (failedUrl) => {
    setMode('text');
    setPasteUrl(failedUrl || '');
    setPasteText('');
    setPasteError('');
    setTextStatus('idle');
    setTextResult(null);
    // Reset the URL-side results so the screen is clean for the pivot.
    setResults([]);
    setRunning(false);
    setFinished(false);
    setError('');
    setInput('');
  };

  const resetTextForRetry = () => {
    setTextStatus('idle');
    setTextResult(null);
    setPasteError('');
  };

  const handleContinue = () => {
    const successIds   = results.filter(r => r.status === 'success').map(r => r.recipeId);
    const duplicateIds = results.filter(r => r.status === 'duplicate').map(r => r.duplicateId);
    const errorIds     = results.filter(r => r.status === 'error' && r.recipeId).map(r => r.recipeId);
    const doneIds = [...successIds, ...duplicateIds, ...errorIds];
    if (doneIds.length > 0) onDone(doneIds); else onCancel();
  };

  const confirmAmbiguous = (idx) => {
    const row = results[idx];
    if (!row || row.status !== 'ambiguous' || !row.pendingRecipe) return;
    // Apply the lowest-unused (N) suffix so the new recipe stays distinguishable
    // from the existing one with the same title.
    const persisted = loadRecipes() || [];
    const newTitle = titleWithLowestUnusedSuffix(row.pendingRecipe.title, persisted);
    const r = { ...row.pendingRecipe, title: newTitle };
    onAdd(r);
    const next = [...results];
    next[idx] = {
      url: row.url,
      status: 'success',
      recipeId: r.id,
      guided: !!r.guidedSteps,
      quick: !!r.quickSteps,
    };
    setResults(next);
  };

  const skipAmbiguous = (idx) => {
    const row = results[idx];
    if (!row || row.status !== 'ambiguous') return;
    const next = [...results];
    next[idx] = {
      url: row.url,
      status: 'duplicate',
      duplicateId: row.existingId,
      duplicateTitle: row.existingTitle,
    };
    setResults(next);
  };

  // "Import anyway" from a hard-duplicate row (same URL, or same title with no URL conflict).
  // Same logic as confirmAmbiguous: append the lowest unused numeric suffix, then save.
  const forceImportDuplicate = (idx) => {
    const row = results[idx];
    if (!row || row.status !== 'duplicate' || !row.pendingRecipe) return;
    const persisted = loadRecipes() || [];
    const newTitle = titleWithLowestUnusedSuffix(row.pendingRecipe.title, persisted);
    const r = { ...row.pendingRecipe, title: newTitle };
    onAdd(r);
    const next = [...results];
    next[idx] = {
      url: row.url,
      status: 'success',
      recipeId: r.id,
      guided: !!r.guidedSteps,
      quick: !!r.quickSteps,
    };
    setResults(next);
  };

  const handleKey = (e) => {
    // Enter submits when input is a single line; Shift+Enter or multi-line input adds a newline
    if (e.key === 'Enter' && !e.shiftKey && !input.includes('\n') && !running && !finished) {
      e.preventDefault();
      submit();
    }
  };

  const successCount   = results.filter(r => r.status === 'success').length;
  const errorCount     = results.filter(r => r.status === 'error').length;
  const duplicateCount = results.filter(r => r.status === 'duplicate').length;
  const ambiguousCount = results.filter(r => r.status === 'ambiguous').length;
  const loadingIdx     = results.findIndex(r => r.status === 'loading' || r.status === 'rewriting' || r.status === 'extracting');
  const showUrlForm    = mode === 'url'  && !running && results.length === 0;
  const showTextForm   = mode === 'text' && textStatus === 'idle';
  const showFindForm   = mode === 'find' && findStatus === 'idle';
  const showAnyForm    = showUrlForm || showTextForm || showFindForm;
  const countLabel     = dedupedUrls.length <= 1 ? 'Add recipe' : ('Add ' + dedupedUrls.length + ' recipes');
  const showTextStatus = mode === 'text' && textStatus !== 'idle';
  const showFindStatus = mode === 'find' && findStatus !== 'idle';

  const tagline = (() => {
    if (showUrlForm)  return 'Paste one or more recipe links \u2014 separated by spaces, commas, or new lines.';
    if (showTextForm) return 'Paste the full page text and we\u2019ll extract the recipe.';
    if (showFindForm) return 'Name a dish \u2014 we\u2019ll find the best versions out there and lay out how they differ.';
    if (mode === 'find' && findStatus === 'searching') return 'Searching the web for the best versions\u2026';
    if (mode === 'find' && findStatus === 'done') return 'Pick the one that sounds right \u2014 it imports straight in.';
    if (mode === 'find') return 'Find a dish to cook.';
    if (mode === 'text' && textStatus !== 'idle') return 'Extracting recipe from pasted text\u2026';
    return 'Importing ' + results.length + ' link' + (results.length === 1 ? '' : 's') + '.';
  })();

  const disableCancel = running || textStatus === 'loading' || textStatus === 'rewriting' || findStatus === 'searching';

  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-12">
        {disableCancel ? (
          <span className="text-sm text-stone-400 inline-flex items-center gap-2">
            <Spinner />
            {findStatus === 'searching' ? 'Searching…' : 'Importing…'}
          </span>
        ) : (
          <button onClick={onCancel} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
            <Icon name="arrowLeft" size={16} />
            {finished || textStatus === 'done' || textStatus === 'partial' || textStatus === 'no-recipe' || textStatus === 'fail' || textStatus === 'duplicate' || textStatus === 'cancelled' || findStatus === 'done' || findStatus === 'empty' || findStatus === 'fail' || findStatus === 'cancelled' ? 'Back' : 'Cancel'}
          </button>
        )}
      </div>

      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight mb-3">New recipe</h1>
      <p className="text-stone-500 mb-8">{tagline}</p>

      {showAnyForm && (
        <div className="mb-6 inline-flex rounded-full bg-stone-100 p-1 text-xs">
          <button
            onClick={() => setMode('url')}
            className={'px-4 py-1.5 rounded-full transition ' + (mode === 'url' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500 hover:text-stone-800')}
          >
            Paste a link
          </button>
          <button
            onClick={() => setMode('text')}
            className={'px-4 py-1.5 rounded-full transition ' + (mode === 'text' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500 hover:text-stone-800')}
          >
            Paste page text
          </button>
