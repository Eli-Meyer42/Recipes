                    </span>
                    <span className={'text-sm truncate flex-1 min-w-0 ' + (r.status === 'cancelled' ? 'text-stone-400' : 'text-stone-700')}>{shortenUrl(r.url)}</span>
                    {r.status === 'cancelled' && (
                      <span className="text-xs text-stone-400 hidden sm:inline">cancelled</span>
                    )}
                    {r.status === 'rewriting' && (
                      <span className="text-xs text-stone-500 hidden sm:inline">rewriting in Guided + Quick…</span>
                    )}
                    {r.status === 'extracting' && (
                      <span className="text-xs text-stone-500 hidden sm:inline">couldn’t read directly — trying AI extraction…</span>
                    )}
                    {r.status === 'duplicate' && (
                      <button
                        onClick={() => onOpen && onOpen(r.duplicateId)}
                        className="text-xs text-stone-500 hover:text-stone-900 underline underline-offset-2 truncate max-w-[45%]"
                        title={'View: ' + (r.duplicateTitle || '')}
                      >
                        {'already saved\u2002\u00b7\u2002\u201c' + (r.duplicateTitle || '') + '\u201d'}
                      </button>
                    )}
                    {r.error && r.status === 'error' && r.recipeId && (
                      <button
                        onClick={() => onOpen && onOpen(r.recipeId)}
                        className="text-xs text-stone-500 hover:text-stone-900 underline underline-offset-2 truncate max-w-[45%] hidden sm:inline"
                        title={r.error}
                      >
                        saved as needs attention
                      </button>
                    )}
                    {r.error && !r.recipeId && <span className="text-xs text-stone-500 truncate max-w-[40%] hidden sm:inline">{r.error}</span>}
                  </div>
                  {r.status === 'error' && finished && (
                    <div className="pl-8 flex flex-wrap gap-x-3 gap-y-1 items-center">
                      <button
                        onClick={() => pivotToTextPaste(r.url)}
                        className="text-xs text-stone-700 hover:text-stone-900 underline underline-offset-2"
                      >
                        Try pasting the page text instead
                      </button>
                    </div>
                  )}
                  {r.status === 'duplicate' && finished && r.pendingRecipe && (
                    <div className="pl-8 flex flex-wrap gap-x-3 gap-y-1 items-center">
                      <button
                        onClick={() => forceImportDuplicate(i)}
                        className="text-xs text-stone-700 hover:text-stone-900 underline underline-offset-2"
                      >
                        Import anyway
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {finished && (errorCount > 0 || ambiguousCount > 0 || successCount > 0) && (
            <div className="flex gap-2 flex-wrap pt-2">
              {errorCount > 0 && (
                <button
                  onClick={() => importBatch('retry')}
                  className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium border border-stone-300 text-stone-800 hover:bg-stone-100"
                >
                  Retry failed
                </button>
              )}
              <button
                onClick={handleContinue}
                disabled={ambiguousCount > 0}
                style={ambiguousCount > 0 ? { background: '#A8A19A', color: '#FAF6EF' } : { background: '#1F1B16', color: '#FAF6EF' }}
                className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium disabled:cursor-not-allowed"
                title={ambiguousCount > 0 ? 'Resolve the possible duplicates above first.' : ''}
              >
                {successCount === 0 ? 'Back to recipes' : ('Continue with ' + successCount)}
              </button>
            </div>
          )}
        </div>
      )}

      {showAnyForm && (
        <div className="mt-12 pt-8 border-t border-stone-200 text-center flex items-center justify-center gap-4">
          <button onClick={onManual} className="text-sm text-stone-600 hover:text-stone-900 underline-offset-2 hover:underline">
            Add manually
          </button>
          <span className="text-stone-300">·</span>
          <button onClick={onBuild} className="text-sm text-stone-600 hover:text-stone-900 underline-offset-2 hover:underline">
            Build your own with AI
          </button>
        </div>
      )}
    </div>
  );
}

      <path d="M12 2 A10 10 0 0 1 22 12" stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" />

  );
}

function EditorView({ recipe, onCancel, onSave, heading, saveLabel, cancelLabel, banner, onRegenerate, regenerating }) {
  const isNew = !recipe;
  const [title, setTitle] = useState(recipe?.title || '');
  const [description, setDescription] = useState(recipe?.description || '');
  const [status, setStatus] = useState(recipe?.status || 'wantto');
  const [servings, setServings] = useState(recipe?.servings || '');
  const [prepTime, setPrepTime] = useState(recipe?.prepTime || '');
  const [cookTime, setCookTime] = useState(recipe?.cookTime || '');
  const [source, setSource] = useState(recipe?.source || '');
  const [sourceName, setSourceName] = useState(recipe?.sourceName || '');
  const [sourceAuthor, setSourceAuthor] = useState(recipe?.sourceAuthor || '');
  const [ingredientsText, setIngredientsText] = useState((recipe?.ingredients || []).join('\n'));
  const [stepsText, setStepsText] = useState((recipe?.steps || []).join('\n\n'));
  const [tagsText, setTagsText] = useState((recipe?.tags || []).join(', '));
  const [labels, setLabels] = useState(() => normalizeLabels(recipe?.labels));

  const handleSave = () => {
    if (!title.trim()) return;
    const newIngredients = ingredientsText.split('\n').map(s => s.trim()).filter(Boolean);
    const newSteps = stepsText.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    // If ingredients or steps changed, any stored partial-of-total annotations are stale —
    // drop them. They can be regenerated via "Regenerate methods" afterwards.
    const ingredientsChanged = JSON.stringify(newIngredients) !== JSON.stringify(recipe?.ingredients || []);
    const stepsChanged = JSON.stringify(newSteps) !== JSON.stringify(recipe?.steps || []);
    const next = {
      id: recipe?.id || newId(),
      title: title.trim(),
      description: description.trim(),
      status,
      servings: servings.trim(),
      prepTime: prepTime.trim(),
      cookTime: cookTime.trim(),
      source: source.trim(),
      sourceName: sourceName.trim(),
      sourceAuthor: sourceAuthor.trim(),
      ingredients: newIngredients,
      steps: newSteps,
      notes: recipe?.notes || [],
      tags: tagsText.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      labels: normalizeLabels(labels),
      collections: recipe?.collections || [],
      image: recipe?.image || '',
      guidedSteps: recipe?.guidedSteps || null,
      quickSteps: recipe?.quickSteps || null,
      partials: (ingredientsChanged || stepsChanged) ? null : (recipe?.partials || null),
      importOriginal: recipe?.importOriginal || null,
      incomplete: false,
      failureReason: '',
      createdAt: recipe?.createdAt || Date.now(),
    };
    onSave(applyOptionalToRecipe(next));
  };

  return (
    <div className="max-w-3xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-8 gap-3">
        <button onClick={onCancel} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          {cancelLabel || 'Cancel'}
        </button>
        <div className="flex items-center gap-2">
          {onRegenerate && (
            <button
              onClick={onRegenerate}
              disabled={regenerating}
              className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 disabled:opacity-60 disabled:cursor-not-allowed"
            >
              {regenerating ? (<><Spinner /> Reassembling…</>) : 'Regenerate'}
            </button>
          )}
          <button
            onClick={handleSave}
            disabled={!title.trim()}
            style={{ background: title.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
            className="px-5 py-2 rounded-full text-sm font-medium disabled:cursor-not-allowed"
          >
            {saveLabel || (isNew ? 'Save recipe' : 'Save changes')}
          </button>
        </div>
      </div>

      <h1 className="font-display text-3xl sm:text-4xl font-light mb-8">
        {heading || (isNew ? 'New recipe' : 'Edit recipe')}
      </h1>

      {banner}

      <div className="space-y-6">
        <Field label="Title">
          <input
            value={title}
            onChange={e => setTitle(e.target.value)}
            placeholder="e.g. Brown Butter Shortbread"
            className="font-display w-full text-2xl bg-transparent border-0 border-b border-stone-300 focus:border-stone-600 focus:outline-none py-2"
          />
        </Field>

        <Field label="One-line description" hint="Optional. What's the vibe?">
          <textarea
            value={description}
            onChange={e => setDescription(e.target.value)}
            placeholder="Buttery, sandy, just sweet enough."
            rows={2}
            className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none resize-none"
          />
        </Field>

        <Field label="Status">
          <div className="flex flex-wrap gap-2">
            {STATUSES.map(s => (
              <button
                key={s.id}
                onClick={() => setStatus(s.id)}
                style={status === s.id ? { background: s.bg, color: s.text, borderColor: s.dot } : {}}
                className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium tracking-wide uppercase border border-stone-200 bg-white text-stone-600"
              >
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: s.dot }} />
                {s.label}
              </button>
            ))}
          </div>
        </Field>

        <div className="grid grid-cols-3 gap-3">
          <Field label="Servings">
            <input value={servings} onChange={e => setServings(e.target.value)} placeholder="4" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
          </Field>
          <Field label="Prep time">
            <input value={prepTime} onChange={e => setPrepTime(e.target.value)} placeholder="15 min" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
          </Field>
          <Field label="Cook time">
            <input value={cookTime} onChange={e => setCookTime(e.target.value)} placeholder="30 min" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
          </Field>
        </div>

        <Field label="Source URL" hint="Optional. Where you got it from.">
          <input value={source} onChange={e => setSource(e.target.value)} placeholder="https://…" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
        </Field>

        <Field label="Credit" hint={'Optional. Shows as \u201cAdapted from [Author] at [Source]\u201d on the recipe \u2014 works for cookbooks and friends too.'}>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <input value={sourceAuthor} onChange={e => setSourceAuthor(e.target.value)} placeholder="Author, e.g. Deb Perelman" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
            <input value={sourceName} onChange={e => setSourceName(e.target.value)} placeholder="Source, e.g. Smitten Kitchen" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
          </div>
        </Field>

        <Field label="Ingredients" hint="One per line.">
          <textarea
            value={ingredientsText}
            onChange={e => setIngredientsText(e.target.value)}
            rows={8}
            placeholder={'200g flour\n100g butter, cold\n50g sugar\nPinch of salt'}
            className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none"
            style={{ fontFamily: 'ui-monospace, SFMono-Regular, monospace' }}
          />
        </Field>

        <Field label="Method" hint="One step per paragraph. Separate steps with a blank line.">
          <textarea
            value={stepsText}
            onChange={e => setStepsText(e.target.value)}
            rows={10}
            placeholder={'Heat the oven to 175°C.\n\nCream the butter and sugar until pale.\n\nFold in the flour and salt until just combined.'}
            className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none"
          />
        </Field>

        <Field label="Tags" hint="Comma-separated.">
          <input value={tagsText} onChange={e => setTagsText(e.target.value)} placeholder="dessert, baking, quick" className="w-full bg-white rounded-xl px-3 py-2 text-[15px] border border-stone-200 focus:border-stone-400 focus:outline-none" />
        </Field>

        <div>
          <div className="flex items-baseline justify-between mb-3">
            <label className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium">Categories</label>
            <span className="text-xs text-stone-400">Cook time is set automatically</span>
          </div>
          <LabelsEditor value={labels} onChange={setLabels} />
        </div>
      </div>

      <div className="mt-10 pt-6 border-t border-stone-200 flex justify-end gap-2">
        <button onClick={onCancel} className="px-4 py-2 rounded-full text-sm text-stone-700 hover:bg-stone-100">{cancelLabel || 'Cancel'}</button>
        <button
          onClick={handleSave}
          disabled={!title.trim()}
          style={{ background: title.trim() ? '#1F1B16' : '#A8A19A', color: '#FAF6EF' }}
          className="px-5 py-2 rounded-full text-sm font-medium disabled:cursor-not-allowed"
        >
          {saveLabel || (isNew ? 'Save recipe' : 'Save changes')}
        </button>
      </div>
    </div>
  );

// ---------- Build your own (AI assembly from freeform notes) ----------
function BuildView({ onCancel, onSave }) {
  const [notes, setNotes] = useState(() => loadScratchpad());
  const [stage, setStage] = useState('notes'); // notes | assembling | review | no-recipe | fail
  const [assembled, setAssembled] = useState(null); // { recipe, inferences, partial, missing }
  const [error, setError] = useState('');
  const [version, setVersion] = useState(0); // bump to force the review editor to remount
  const [regenerating, setRegenerating] = useState(false);

  // ---- Continuous voice dictation (Web Speech API) ----
  // Feature-detected; the mic button is hidden entirely when unsupported (e.g. Firefox).
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const [dictating, setDictating] = useState(false);
  const [micError, setMicError] = useState('');
  const recRef = useRef(null);          // live recognition instance
  const dictatingRef = useRef(false);   // intent flag — drives auto-restart in continuous mode
  const committedRef = useRef('');      // scratchpad text with finalized speech baked in
  const interimRef = useRef('');        // in-flight (not yet final) transcript
  const anchorRef = useRef(0);          // insertion point within committed text
  const taRef = useRef(null);           // the textarea, for reading cursor position

  // Insert `chunk` into `text` at `pos`, adding a space before/after when the
  // neighbours aren't already whitespace. Returns [newText, newPos-after-chunk].
  const insertWithSpacing = (text, pos, chunk) => {
    const trimmed = chunk.trim();
    if (!trimmed) return [text, pos];
    const before = text.slice(0, pos);
    const after = text.slice(pos);
    const lead = before && !/\s$/.test(before) ? ' ' : '';
    const tail = after && !/^\s/.test(after) ? ' ' : '';
    const inserted = lead + trimmed + tail;
    return [before + inserted + after, pos + lead.length + trimmed.length];
  };

  const renderDictationDisplay = () => {
    const committed = committedRef.current;
    const pos = anchorRef.current;
    const interim = interimRef.current;
    if (!interim.trim()) {
      setNotes(committed);
      return;
    }
    const [display] = insertWithSpacing(committed, pos, interim);
    setNotes(display); // interim shows live but only committed text is persisted
  };

  const stopDictation = () => {
    dictatingRef.current = false;
    // Bake any visible interim text into the committed notes so nothing the user
    // saw on screen disappears when they stop.
    if (interimRef.current.trim()) {
      const [next, nextPos] = insertWithSpacing(committedRef.current, anchorRef.current, interimRef.current);
      committedRef.current = next;
      anchorRef.current = nextPos;
      interimRef.current = '';
    }
    setNotes(committedRef.current);
    saveScratchpad(committedRef.current);
    setDictating(false);
    if (recRef.current) {
      try { recRef.current.stop(); } catch (e) {}
      recRef.current = null;
    }
  };

  const startDictation = () => {
    if (!SpeechRec) return;
    setMicError('');
    committedRef.current = notes;
    interimRef.current = '';
    // Anchor at the textarea cursor if we can read one; otherwise append at the end.
    const ta = taRef.current;
    anchorRef.current = (ta && typeof ta.selectionStart === 'number' && document.activeElement === ta)
      ? ta.selectionStart
      : notes.length;

    const rec = new SpeechRec();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = navigator.language || 'en-US';

    rec.onresult = (e) => {
      let finals = '';
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finals += t;
        else interim += t;
      }
      if (finals.trim()) {
        const [next, nextPos] = insertWithSpacing(committedRef.current, anchorRef.current, finals);
        committedRef.current = next;
        anchorRef.current = nextPos;
        saveScratchpad(next); // persist finalized speech immediately
      }
      interimRef.current = interim;
      renderDictationDisplay();
    };

    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        dictatingRef.current = false;
        setDictating(false);
        setMicError('Microphone access needed for voice dictation.');
        recRef.current = null;
      }
      // 'no-speech' / 'network' / 'aborted' are transient — onend's restart handles them.
    };

    // Browsers end recognition sessions on their own schedule even in continuous
    // mode; while the user hasn't pressed stop, immediately start a fresh session.
    rec.onend = () => {
      if (dictatingRef.current && recRef.current === rec) {
        setTimeout(() => {
          if (dictatingRef.current && recRef.current === rec) {
            try { rec.start(); } catch (e) {}
          }
        }, 200);
      }
    };

    recRef.current = rec;
    dictatingRef.current = true;
    setDictating(true);
    try { rec.start(); } catch (e) {
      dictatingRef.current = false;
      setDictating(false);
      recRef.current = null;
      setMicError('Couldn\u2019t start the microphone. Try again.');
    }
  };

  const toggleDictation = () => {
    if (dictating) stopDictation();
    else startDictation();
  };

  // Stop listening if the user leaves this screen mid-dictation. Finalized text is
  // already persisted, so nothing is lost.
  useEffect(() => () => {
    dictatingRef.current = false;
    if (recRef.current) {
      try { recRef.current.stop(); } catch (e) {}
      recRef.current = null;
    }
  }, []);

  const updateNotes = (text) => {
    if (dictating) {
      // The user typed while dictating: treat what's on screen (including any visible
      // interim) as the new committed text, and move the anchor to their cursor.
      committedRef.current = text;
      interimRef.current = '';
      const ta = taRef.current;
      anchorRef.current = (ta && typeof ta.selectionStart === 'number') ? ta.selectionStart : text.length;
    }
    setNotes(text);
    saveScratchpad(text);
  };

  const clearNotes = () => {
    if (dictating) stopDictation();
    committedRef.current = '';
    anchorRef.current = 0;
    interimRef.current = '';
    setNotes('');
    saveScratchpad('');
  };

  const runAssembly = async (isRegen) => {
    if (dictating) stopDictation();
    if (!isAiConfigured()) {
      setError('AI isn’t set up. Open AI status on the home page to add your key.');
      setStage('fail');
      return;
    }
    if (isRegen) setRegenerating(true); else setStage('assembling');
    setError('');
    try {
      const result = await aiAssembleRecipeFromNotes(notes);
      if (!result) {
        setStage('no-recipe');
        return;
      }
      // Typo / mechanical-error proofread on the assembled recipe (before tagging/review).
      if (result.recipe) {
        const before = {
          title: result.recipe.title || '',
          description: result.recipe.description || '',
          ingredients: [...(result.recipe.ingredients || [])],
          steps: [...(result.recipe.steps || [])],
        };
        const corrected = await aiTypoCorrectRecipe(result.recipe);
        if (corrected) {
          result.recipe = { ...result.recipe, ...corrected };
          if (typoDiffsExist(before, corrected)) result.recipe.importOriginal = before;
        }
      }
      // Final cleanup pass for optional cues, before tagging and review.
      result.recipe = applyOptionalToRecipe(result.recipe);
      // Auto-label the assembled recipe (best-effort) so tags show in review and save with it.
      if (!result.partial && result.recipe) {
        const labels = await aiLabelRecipe(result.recipe);
        if (labels) result.recipe = { ...result.recipe, labels };
        if ((result.recipe.steps || []).length >= 2 && (result.recipe.ingredients || []).length >= 2) {
          const rawPartials = await aiDetectPartials(result.recipe);
          const reconciled = reconcilePartials(rawPartials, result.recipe);
          if (reconciled.length > 0) result.recipe = { ...result.recipe, partials: reconciled };
        }
      }
      setAssembled(result);
      setVersion(v => v + 1);
      setStage('review');
    } catch (e) {
      console.error('Notes assembly failed:', e);
      setError((e && e.message) || 'Something went wrong.');
      setStage('fail');
    } finally {
      setRegenerating(false);
    }
  };

  const handleSaveFromReview = (r) => {
    const missing = [];
    if (!r.ingredients || r.ingredients.length === 0) missing.push('ingredients');
    if (!r.steps || r.steps.length === 0) missing.push('method');
    let final = r;
    if (missing.length > 0) {
      final = { ...r, incomplete: true, failureReason: 'Assembled from notes — missing ' + missing.join(' and ') + '.' };
    }
    saveScratchpad(''); // notes have become a recipe; clear the pad
    onSave(final);
  };

  // ---- Review stage: hand the assembled recipe to the editor for review/edit ----
  if (stage === 'review' && assembled) {
    const { inferences, partial, missing } = assembled;
    const banner = (
      <div className="mb-8 space-y-3">
        {partial && (
          <div className="px-4 py-3 rounded-xl text-sm leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
            Your notes were missing {missing.join(' and ')}. Fill it in below, or save as is — it'll be marked "Needs attention" so you can finish later.
          </div>
        )}
        {inferences && inferences.length > 0 && (
          <div className="px-4 py-3 rounded-xl text-sm leading-relaxed" style={{ background: '#F3EEE3', color: '#5A5044' }}>
            <div className="font-medium mb-1.5 flex items-center gap-1.5"><span>✨</span> A few calls the AI made — double-check these:</div>
            <ul className="list-disc pl-5 space-y-0.5">
              {inferences.map((inf, i) => <li key={i}>{inf}</li>)}
            </ul>
          </div>
        )}
      </div>
    );
    return (
      <EditorView
        key={version}
        recipe={assembled.recipe}
        heading="Review your recipe"
        saveLabel="Save recipe"
        cancelLabel="Back to notes"
        banner={banner}
        onRegenerate={() => runAssembly(true)}
        regenerating={regenerating}
        onCancel={() => setStage('notes')}
        onSave={handleSaveFromReview}
      />
    );
  }

  // ---- Notes / assembling / error stages ----
  return (
    <div className="max-w-2xl mx-auto px-5 sm:px-8 py-6 sm:py-8">
      <div className="flex items-center justify-between mb-12">
        <button onClick={onCancel} className="inline-flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
          <Icon name="arrowLeft" size={16} />
          Cancel
        </button>
        {notes.trim() && stage === 'notes' && (
          <button onClick={clearNotes} className="text-xs text-stone-500 hover:text-stone-800 underline-offset-2 hover:underline">
            Clear notes
          </button>
        )}
      </div>

      <h1 className="font-display text-4xl sm:text-5xl font-light leading-tight mb-3">Build your own</h1>
      <p className="text-stone-500 mb-8">
        Brain-dump your recipe in any form — ingredients, rough steps, times. The AI will organize it into shape. Your notes are saved as you type.
      </p>

      <div className="relative">
        <textarea
          ref={taRef}
          value={notes}
          onChange={e => updateNotes(e.target.value)}
          disabled={stage === 'assembling'}
          placeholder={'e.g. 2 eggs, handful of flour, splash of milk\nmix till smooth, fry in butter\nmedium heat ~3 min a side\nmakes about a dozen small ones'}
          autoFocus
          rows={14}
          className={'w-full px-4 py-4 rounded-2xl bg-white border text-[15px] focus:outline-none transition resize-y min-h-[280px] leading-relaxed disabled:opacity-60 ' + (dictating ? 'border-red-300 focus:border-red-400 pb-14' : 'border-stone-200 focus:border-stone-400')}
        />
        {SpeechRec && stage !== 'assembling' && (
          <div className="absolute bottom-3 right-3 flex items-center gap-2">
            {dictating && (
              <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-red-50 text-red-600">
                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
                Listening…
              </span>
            )}
            <button
              onClick={toggleDictation}
              title={dictating ? 'Stop dictation' : 'Dictate your notes'}
              aria-label={dictating ? 'Stop dictation' : 'Start dictation'}
              className={'inline-flex items-center justify-center w-10 h-10 rounded-full shadow-sm transition ' + (
                dictating
                  ? 'bg-red-500 text-white hover:bg-red-600'
                  : 'bg-white border border-stone-200 text-stone-500 hover:text-stone-800 hover:border-stone-400'
              )}
            >
              <Icon name={dictating ? 'square' : 'mic'} size={16} strokeWidth={2} />
            </button>
          </div>
        )}
      </div>

      {micError && (
        <div className="mt-3 px-4 py-2.5 rounded-xl text-sm" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
          {micError}
        </div>
      )}

      {!isAiConfigured() && (
        <div className="mt-4 px-4 py-3 rounded-xl text-sm" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
          AI isn’t set up. Open AI status on the home page to add your key.
        </div>
      )}

      {stage === 'fail' && (
        <div className="mt-4 px-4 py-3 rounded-xl text-sm leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
          <div className="font-medium mb-0.5">Couldn’t assemble</div>
          <div className="text-xs">{error}</div>
          <div className="text-xs mt-1">Your notes are safe — try again.</div>
        </div>
      )}

      {stage === 'no-recipe' && (
        <div className="mt-4 px-4 py-3 rounded-xl text-sm leading-relaxed" style={{ background: '#FBE4DC', color: '#7A2E16' }}>
          Couldn’t find a recipe in these notes. Add a bit more — at least some ingredients or steps — and try again.
        </div>
      )}

      <div className="mt-6">
        <button
          onClick={() => runAssembly(false)}
          disabled={!notes.trim() || !isAiConfigured() || stage === 'assembling'}
          style={{ background: (!notes.trim() || !isAiConfigured() || stage === 'assembling') ? '#A8A19A' : '#1F1B16', color: '#FAF6EF' }}
          className="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-full text-sm font-medium tracking-wide hover:opacity-90 transition disabled:cursor-not-allowed"
        >
          {stage === 'assembling' ? (<><Spinner /> Assembling…</>) : (<>{'✨ Assemble recipe'}</>)}
        </button>
      </div>
    </div>
  );
}

function Field({ label, hint, children }) {
  return (
    <div>
      <div className="flex items-baseline justify-between mb-1.5">
        <label className="text-xs uppercase tracking-[0.15em] text-stone-500 font-medium">{label}</label>
        {hint && <span className="text-xs text-stone-400">{hint}</span>}
      </div>
      {children}
    </div>
  );
}

// ---------- Cooking ----------
function CookingMode({ recipe, initialStep, scale, onExit }) {
  const hasGuided = Array.isArray(recipe.guidedSteps) && recipe.guidedSteps.length > 0;
  const hasQuick  = Array.isArray(recipe.quickSteps)  && recipe.quickSteps.length > 0;
  const saved = loadMethodView(recipe.id);
  let sourceArray;
  const view = saved ? saved.view : (hasGuided ? 'guided' : hasQuick ? 'quick' : 'original');
  if (view === 'guided' && hasGuided)      sourceArray = recipe.guidedSteps;
  else if (view === 'quick' && hasQuick)   sourceArray = recipe.quickSteps;
  else                                      sourceArray = recipe.steps || [];

  const originalCleaned = (recipe.steps || []).map(s => cleanRecipeText(s));
  const ovenTemps = extractOvenTemps(originalCleaned);
  const cleanedSteps = sourceArray.map(s => cleanRecipeText(s));
  const visibleSteps = cleanedSteps
    .map(s => ovenTemps.length > 0 ? stripOvenTempFromStep(s) : s)
    .filter(s => s && s.length > 0);
  const [step, setStep] = useState(initialStep || 0);
  const [showIngredients, setShowIngredients] = useState(false);
  // Per-step "done" flags for THIS cook-through. Lives only in this component's state —
  // unmounts (leaving cooking mode) reset it. Never written to the saved recipe.
  const [done, setDone] = useState({});
  const isDone = !!done[step];
  const toggleDone = () => setDone(prev => ({ ...prev, [step]: !prev[step] }));
  const clearAllDone = () => setDone({});
  const anyDone = Object.values(done).some(Boolean);
  const total = visibleSteps.length;
  const isLast = step === total - 1;
  const isFirst = step === 0;

  // ---- Per-step timers ----
  // Keyed by step index. Each: { initial, remaining, endsAt, running, done }.
  // State lives here (not in a per-step child) so timers keep running as the user
  // navigates between steps, and several can run at once.
  const [timers, setTimers] = useState({});
  const firedRef = useRef(new Set());

  const stepDefaultSecs = (idx) => stepTimerSeconds(visibleSteps[idx]);
  const ensureTimer = (prev, idx) => {
    if (prev[idx]) return prev[idx];
    const secs = stepDefaultSecs(idx) || 0;
    return { initial: secs, remaining: secs, endsAt: null, running: false, done: false };
  };
  const liveRemaining = (t) => {
    if (!t) return 0;
    if (t.running && t.endsAt != null) return Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
    return t.remaining;
  };

  const startPauseTimer = (idx) => {
    requestNotificationPermission();
    setTimers(prev => {
      const t = ensureTimer(prev, idx);
      let nt;
      if (t.running) {
        nt = { ...t, running: false, endsAt: null, remaining: liveRemaining(t) };
      } else {
        const base = t.done ? t.initial : (t.remaining > 0 ? t.remaining : t.initial);
        if (base <= 0) return prev;
        nt = { ...t, running: true, done: false, remaining: base, endsAt: Date.now() + base * 1000 };
      }
      return { ...prev, [idx]: nt };
    });
  };

  const resetTimer = (idx) => {
    setTimers(prev => {
      const t = ensureTimer(prev, idx);
      return { ...prev, [idx]: { ...t, running: false, endsAt: null, remaining: t.initial, done: false } };
    });
  };

  const adjustTimer = (idx, delta) => {
    setTimers(prev => {
      const t = ensureTimer(prev, idx);
      const newRem = Math.max(0, liveRemaining(t) + delta);
      if (t.running) {
        return { ...prev, [idx]: { ...t, remaining: newRem, endsAt: Date.now() + newRem * 1000, done: false } };
      }
      return { ...prev, [idx]: { ...t, remaining: newRem, done: false } };
    });
  };

  const dismissTimer = (idx) => {
    setTimers(prev => {
      const t = prev[idx];
      if (!t) return prev;
      return { ...prev, [idx]: { ...t, done: false, running: false, endsAt: null, remaining: t.initial } };
    });
  };

  const anyRunning = Object.values(timers).some(t => t.running);
  useEffect(() => {
    if (!anyRunning) return;
    const id = setInterval(() => {
      setTimers(prev => {
        let changed = false;
        const next = { ...prev };
        const now = Date.now();
        for (const k of Object.keys(next)) {
          const t = next[k];
          if (t.running && t.endsAt != null) {
            const rem = Math.max(0, Math.round((t.endsAt - now) / 1000));
            if (rem <= 0) {
              next[k] = { ...t, running: false, endsAt: null, remaining: 0, done: true };
              changed = true;
            } else if (rem !== t.remaining) {
              next[k] = { ...t, remaining: rem };
              changed = true;
            }
          }
        }
        return changed ? next : prev;
      });
    }, 250);
    return () => clearInterval(id);
  }, [anyRunning]);

  // Fire the alert (sound + notification) exactly once per completion.
  useEffect(() => {
    Object.entries(timers).forEach(([k, t]) => {
      if (t.done && !firedRef.current.has(k)) {
        firedRef.current.add(k);
        playTimerBeep();
        maybeNotifyTimerDone(recipe.title, parseInt(k, 10) + 1);
      } else if (!t.done && firedRef.current.has(k)) {
        firedRef.current.delete(k);
      }
    });
  }, [timers, recipe.title]);

  const otherActiveTimers = Object.entries(timers)
    .map(([k, t]) => ({ idx: parseInt(k, 10), t }))
    .filter(({ idx, t }) => idx !== step && (t.running || t.done))
    .sort((a, b) => a.idx - b.idx);

  useEffect(() => {
    document.body.classList.add('no-scroll');
    return () => document.body.classList.remove('no-scroll');
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' && !isLast) setStep(s => s + 1);
      else if (e.key === 'ArrowLeft' && !isFirst) setStep(s => s - 1);
      else if (e.key === 'Escape') onExit();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isLast, isFirst, onExit]);

  return (
    <div className="fixed inset-0 z-40 flex flex-col" style={{ background: '#1F1B16', color: '#FAF6EF' }}>
      <div className="flex items-center justify-between px-5 sm:px-8 py-4 border-b border-white/10">
        <button onClick={onExit} className="inline-flex items-center gap-2 text-sm text-stone-300 hover:text-white transition">
          <Icon name="x" size={18} />
          Exit
        </button>
        <div className="text-center">
          <div className="font-display text-lg leading-none">{recipe.title}</div>
          <div className="text-[11px] uppercase tracking-[0.2em] text-stone-400 mt-1.5">
            Step {step + 1} of {total}
          </div>
        </div>
        <button onClick={() => setShowIngredients(true)} className="inline-flex items-center gap-2 text-sm text-stone-300 hover:text-white transition">
          <Icon name="list" size={18} />
          <span className="hidden sm:inline">Ingredients</span>
        </button>
      </div>

      {otherActiveTimers.length > 0 && (
        <div className="flex flex-wrap gap-2 justify-center px-4 pt-3 pb-1">
          {otherActiveTimers.map(({ idx, t }) => (
            <button
              key={idx}
              onClick={() => setStep(idx)}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition"
              style={t.done
                ? { background: '#B8543A', borderColor: '#B8543A', color: '#FFF' }
                : { background: 'rgba(255,255,255,0.06)', borderColor: 'rgba(255,255,255,0.2)', color: '#FAF6EF' }}
            >
              {t.done ? <Icon name="bell" size={12} /> : <Icon name="clock" size={12} />}
              Step {idx + 1}
              <span className="tabular-nums">{t.done ? 'Done!' : formatTimer(t.remaining)}</span>
            </button>
          ))}
        </div>
      )}

      <div className="flex-1 flex flex-col items-center justify-center px-6 sm:px-12 py-10 overflow-auto">
        <div className="max-w-2xl w-full">
          <div className="font-display text-7xl sm:text-8xl font-light leading-none text-stone-500 mb-6">
            {String(step + 1).padStart(2, '0')}
          </div>
          <p className={'font-display text-2xl sm:text-3xl leading-snug font-light transition-all ' + (isDone ? 'line-through opacity-40' : '')}>
            {(() => {
              const { optional, text } = extractOptional(visibleSteps[step]);
              return <>{optional && <span className="text-sm italic text-stone-400 mr-2 not-italic font-sans font-normal align-middle">optional</span>}{renderStepWithBoldIngredients(text, null)}</>;
            })()}
          </p>

          <div className="mt-5 flex items-center justify-between gap-3 flex-wrap">
            <button
              onClick={toggleDone}
              className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-sm border transition"
              style={isDone
                ? { background: '#6F8753', borderColor: '#6F8753', color: '#FFF' }
                : { background: 'transparent', borderColor: 'rgba(255,255,255,0.25)', color: '#FAF6EF' }}
              aria-pressed={isDone}
            >
              <span className={'inline-flex items-center justify-center w-4 h-4 rounded-full border ' + (isDone ? 'bg-white border-white' : 'border-white/40')}>
                {isDone && <Icon name="check" size={11} strokeWidth={3} />}
              </span>
              {isDone ? 'Done' : 'Mark step done'}
            </button>
            {anyDone && (
              <button
                onClick={clearAllDone}
                className="text-xs text-stone-400 hover:text-white underline-offset-2 hover:underline"
              >
                Start over
              </button>
            )}
          </div>

          {(() => {
            const def = stepDefaultSecs(step);
            if (def == null) return null;
            const t = timers[step];
            const remaining = t ? t.remaining : def;
            const running = !!(t && t.running);
            const done = !!(t && t.done);
            const panelStyle = done
              ? { background: 'rgba(184,84,58,0.18)', borderColor: '#B8543A' }
              : { background: 'rgba(255,255,255,0.05)', borderColor: 'rgba(255,255,255,0.18)' };
            return (
              <div className="mt-10 rounded-2xl border p-5 sm:p-6 max-w-sm" style={panelStyle}>
                <div className="flex items-center justify-between mb-4">
                  <span className="text-[11px] uppercase tracking-[0.2em] text-stone-400 inline-flex items-center gap-1.5">
                    <Icon name="clock" size={13} /> Timer
                  </span>
                  {done && (
                    <span className="text-xs font-medium inline-flex items-center gap-1.5" style={{ color: '#E8927C' }}>
                      <Icon name="bell" size={13} /> Time's up!
                    </span>
                  )}
                </div>

                <div className="font-display font-light tabular-nums leading-none mb-5"
                     style={{ fontSize: '3.5rem', color: done ? '#E8927C' : '#FAF6EF' }}>
                  {formatTimer(remaining)}
                </div>

                {done ? (
                  <button
                    onClick={() => dismissTimer(step)}
                    style={{ background: '#FAF6EF', color: '#1F1B16' }}
                    className="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition"
                  >
                    Dismiss
                  </button>
                ) : (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => adjustTimer(step, -30)}
                      className="px-3 py-2.5 rounded-full text-xs font-medium border border-white/20 hover:bg-white/10 transition tabular-nums"
                    >
                      −30s
                    </button>
                    <button
                      onClick={() => startPauseTimer(step)}
                      disabled={remaining <= 0 && !running}
                      style={{ background: '#FAF6EF', color: '#1F1B16' }}
                      className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition disabled:opacity-40 disabled:cursor-not-allowed"
                    >
                      <Icon name={running ? 'pause' : 'play'} size={15} />
                      {running ? 'Pause' : (remaining < def ? 'Resume' : 'Start')}
                    </button>
                    <button
                      onClick={() => adjustTimer(step, 30)}
                      className="px-3 py-2.5 rounded-full text-xs font-medium border border-white/20 hover:bg-white/10 transition tabular-nums"
                    >
                      +30s
                    </button>
                    <button
                      onClick={() => resetTimer(step)}
                      aria-label="Reset timer"
                      title="Reset"
                      className="px-3 py-2.5 rounded-full border border-white/20 hover:bg-white/10 transition"
                    >
                      <Icon name="rotate" size={15} />
                    </button>
                  </div>
                )}
              </div>
            );
          })()}
          {isLast && (
            <div className="mt-10 p-5 rounded-2xl border border-white/20 inline-flex items-center gap-3">
              <span style={{ color: '#A6C57F' }}><Icon name="check" size={20} /></span>
              <span className="text-stone-300">Last step. Enjoy.</span>
            </div>
          )}
        </div>
      </div>

      <div className="px-5 sm:px-8 py-5 border-t border-white/10">
        <div className="max-w-2xl mx-auto flex items-center justify-between gap-4">
          <button
            onClick={() => setStep(s => Math.max(0, s - 1))}
            disabled={isFirst}
            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-sm border border-white/20 hover:bg-white/5 transition disabled:opacity-30 disabled:cursor-not-allowed"
          >
            <Icon name="chevronLeft" size={16} />
            Previous
          </button>

          <div className="flex items-center gap-1.5 flex-1 justify-center">
            {recipe.steps.map((_, i) => {
              const sizeCls = i === step ? 'w-6' : 'w-1.5';
              const baseColorCls = i === step ? 'bg-white' : i < step ? 'bg-white/60' : 'bg-white/20';
              return (
                <button
                  key={i}
                  onClick={() => setStep(i)}
                  style={done[i] ? { background: '#A6C57F' } : {}}
                  className={`h-1.5 rounded-full transition-all ${sizeCls} ${done[i] ? '' : baseColorCls}`}
                  aria-label={`Step ${i + 1}${done[i] ? ' (done)' : ''}`}
                />
              );
            })}
          </div>

          {isLast ? (
            <button
              onClick={onExit}
              style={{ background: '#B8543A', color: '#FFF' }}
              className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              Finish
              <Icon name="check" size={16} />
            </button>
          ) : (
            <button
              onClick={() => setStep(s => Math.min(total - 1, s + 1))}
              style={{ background: '#FAF6EF', color: '#1F1B16' }}
              className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium hover:opacity-90 transition"
            >
              Next
              <Icon name="chevronRight" size={16} />
            </button>
          )}
        </div>
      </div>

      {showIngredients && (
        <div onClick={() => setShowIngredients(false)} className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center sm:p-6 z-50">
          <div onClick={e => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[80vh] overflow-auto" style={{ background: '#FAF6EF', color: '#1F1B16' }}>
            <div className="flex items-center justify-between mb-5">
              <h3 className="font-display text-2xl">Ingredients</h3>
              <button onClick={() => setShowIngredients(false)} className="p-1.5 rounded-full hover:bg-stone-200/60">
                <Icon name="x" size={18} />
              </button>
            </div>
            {scale && scale !== 1 && (
              <p className="text-xs text-stone-500 mb-3">Scaled to ×{scale === 0.5 ? '½' : scale}</p>
            )}
            <ul className="space-y-3">
              {recipe.ingredients.map((ing, i) => (
                <li key={i} className="flex gap-3">
                  <span className="text-stone-300 mt-1.5" style={{ fontSize: '8px' }}>●</span>
                  <span className="text-[15px] leading-relaxed">{formatIngredient(ing, scale)}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Mount ----------
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
