const VIBE_PATTERNS = [
  /\bpinch\b/i, /\bto taste\b/i, /\bsplash\b/i, /\bdrizzle\b/i,
  /\bbunch\b/i, /\bhandful\b/i, /\bsprig\b/i, /\bdash\b/i, /\bglug\b/i,
];
function isVibeAmount(str) {
  if (VIBE_PATTERNS.some(p => p.test(str))) return true;
  if (/\d+\s*(?:[-\u2013\u2014]|\bto\b)\s*\d+/.test(str)) return true;
  return false;
}

const FRAC_MAP = { '\u00BC': 1/4, '\u00BD': 1/2, '\u00BE': 3/4, '\u2153': 1/3, '\u2154': 2/3, '\u215B': 1/8, '\u215C': 3/8, '\u215D': 5/8, '\u215E': 7/8 };
const FRAC_SYM_LIST = [
  [1/8, '\u215B'], [1/4, '\u00BC'], [1/3, '\u2153'], [3/8, '\u215C'],
  [1/2, '\u00BD'], [5/8, '\u215D'], [2/3, '\u2154'], [3/4, '\u00BE'], [7/8, '\u215E'],
];
const TOL = 0.015;
const CLEAN_CUP = [0, 1/4, 1/3, 1/2, 2/3, 3/4];
const CLEAN_SMALL = [0, 1/8, 1/4, 1/2];
const CLEAN_LB = [0, 1/4, 1/2];

function parseAmount(s) {
  s = s.replace(/^\s+/, '');
  const m = s.match(/^((?:\d+(?:\.\d+)?))?\s*(\d+\/\d+|[\u00BC\u00BD\u00BE\u2153\u2154\u215B\u215C\u215D\u215E])?/);
  if (!m || (!m[1] && !m[2])) return null;
  const whole = m[1] ? parseFloat(m[1]) : 0;
  let frac = 0;
  if (m[2]) {
    if (m[2].includes('/')) {
      const [n, d] = m[2].split('/').map(parseFloat);
      frac = n / d;
    } else {
      frac = FRAC_MAP[m[2]] || 0;
    }
  }
  return { value: whole + frac, matched: m[0] };
}

const UNIT_PATTERNS = [
  ['kg',   /^(kilograms?|kilos?|kg)\b\.?/i],
  ['g',    /^(grams?|g)\b\.?/i],
  ['lb',   /^(pounds?|lbs?|lb)\b\.?/i],
  ['oz',   /^(ounces?|oz)\b\.?/i],
  ['cup',  /^(cups?|c)\b\.?/i],
  ['tbsp', /^(tablespoons?|tbsps?|tbs)\b\.?/i],
  ['tsp',  /^(teaspoons?|tsps?|tsp)\b\.?/i],
  ['ml',   /^(milliliters?|millilitres?|ml)\b\.?/i],
  ['l',    /^(liters?|litres?|l)\b\.?/i],
];

function parseUnit(s) {
  s = s.replace(/^\s+/, '');
  for (const [canonical, re] of UNIT_PATTERNS) {
    const m = s.match(re);
    if (m) return { unit: canonical, matched: m[0] };
  }
  return null;
}

function parseIngredient(str) {
  let trimmed = (str || '').trim();
  if (!trimmed) return { kind: 'empty' };
  // Strip a leading "(optional)" marker so amount/unit parsing sees the actual ingredient.
  const opt = extractOptional(trimmed);
  if (opt.optional) trimmed = opt.text.trim();
  if (!trimmed) return { kind: 'empty' };
  if (isVibeAmount(trimmed)) return { kind: 'vibe' };
  const amt = parseAmount(trimmed);
  if (!amt) return { kind: 'noamount' };
  let rest = trimmed.slice(amt.matched.length).trim();
  const unitRes = parseUnit(rest);
  let unit = null;
  if (unitRes) {
    unit = unitRes.unit;
    rest = rest.slice(unitRes.matched.length).trim();
  }
  rest = rest.replace(/^of\s+/i, '');
  let ingredient = rest;
  let modifier = '';
  const commaIdx = rest.indexOf(',');
  if (commaIdx >= 0) {
    ingredient = rest.slice(0, commaIdx).trim();
    modifier = rest.slice(commaIdx);
  }
  return { kind: 'parsed', amount: amt.value, unit, ingredient, modifier };
}

function nearestClean(amount, fracs) {
  if (amount < 0) return null;
  const whole = Math.floor(amount + 0.0001);
  const frac = amount - whole;
  for (const f of fracs) {
    if (Math.abs(frac - f) < TOL) return whole + f;
  }
  if (Math.abs(1 - frac) < TOL) return whole + 1;
  return null;
}

function fractionString(amount) {
  if (amount === 0) return '0';
  const whole = Math.floor(amount + 0.0001);
  const frac = amount - whole;
  let sym = '';
  for (const [val, s] of FRAC_SYM_LIST) {
    if (Math.abs(frac - val) < TOL) { sym = s; break; }
  }
  if (whole === 0 && sym) return sym;
  if (whole > 0 && sym) return whole + ' ' + sym;
  if (whole > 0) return String(whole);
  return amount.toFixed(2).replace(/\.?0+$/, '');
}

function pluralizeUnit(unit, amount) {
  if (unit === 'cup' && amount > 1) return 'cups';
  return unit;
}

function lookupIngredient(name) {
  if (!name) return null;
  const normalized = name.toLowerCase().trim();
  if (INGREDIENT_DB[normalized]) return INGREDIENT_DB[normalized];
  const keys = Object.keys(INGREDIENT_DB).sort((a, b) => b.length - a.length);
  for (const key of keys) {
    if (normalized.includes(key)) return INGREDIENT_DB[key];
  }
  return null;
}

function toGrams(parsed, density) {
  const { unit, amount } = parsed;
  if (unit === 'g')  return amount;
  if (unit === 'kg') return amount * 1000;
  if (unit === 'oz') return amount * 28.35;
  if (unit === 'lb') return amount * 453.6;
  if (!density || !density.gPerCup) return null;
  if (unit === 'cup')  return amount * density.gPerCup;
  if (unit === 'tbsp') return amount * density.gPerCup / 16;
  if (unit === 'tsp')  return density.gPerTsp ? amount * density.gPerTsp : amount * density.gPerCup / 48;
  if (unit === 'ml')   return amount * (density.gPerCup / 240);
  if (unit === 'l')    return amount * (density.gPerCup / 240) * 1000;
  return null;
}

function composeVolumeApprox(cups) {
  let cupPart = 0;
  for (let w = 0; w <= Math.ceil(cups) + 1; w++) {
    for (const f of CLEAN_CUP) {
      const v = w + f;
      if (v <= cups + 0.005 && v > cupPart) cupPart = v;
    }
  }
  const remCups = Math.max(0, cups - cupPart);
  const remTbsp = remCups * 16;
  let tbspPart = 0;
  let bestDiff = Infinity;
  for (let w = 0; w <= Math.ceil(remTbsp) + 1; w++) {
    for (const f of CLEAN_SMALL) {
      const v = w + f;
      const diff = Math.abs(v - remTbsp);
      if (diff < bestDiff) { bestDiff = diff; tbspPart = v; }
    }
  }
  const parts = [];
  if (cupPart > 0) parts.push(fractionString(cupPart) + ' ' + pluralizeUnit('cup', cupPart));
  if (tbspPart > 0) parts.push(fractionString(tbspPart) + ' tbsp');
  return parts.join(' + ');
}

function pickCandidate(candidates, category) {
  const byUnit = {};
  for (const c of candidates) byUnit[c.unit] = c;
  if (category === 'meat' || category === 'produce') return byUnit['lb'] || candidates[0];
  if (category === 'spice') {
    if (byUnit['tsp'] && byUnit['tsp'].amount <= 3) return byUnit['tsp'];
    if (byUnit['tbsp']) return byUnit['tbsp'];
    if (byUnit['tsp']) return byUnit['tsp'];
    return byUnit['cup'] || candidates[0];
  }
  // butter, dry, liquid, or default
  if (byUnit['cup'] && byUnit['cup'].amount >= 0.25) return byUnit['cup'];
  if (byUnit['tbsp']) return byUnit['tbsp'];
  if (byUnit['tsp']) return byUnit['tsp'];
  if (byUnit['cup']) return byUnit['cup'];
  return byUnit['lb'] || candidates[0];
}

function renderClean(amount, unit, parsed) {
  return fractionString(amount) + ' ' + pluralizeUnit(unit, amount) + ' ' + parsed.ingredient + (parsed.modifier || '');
}

// Parse a recipe's servings string into a base number + unit phrase, for the
// servings stepper. Returns null if no number is present.
function parseServings(s) {
  if (!s) return null;
  const m = String(s).match(/(\d+)(?:\s*(?:[-\u2013\u2014]|to)\s*(\d+))?(\s+.*)?/);
  if (!m) return null;
  const low = parseInt(m[1], 10);
  if (!low) return null;
  const high = m[2] ? parseInt(m[2], 10) : null;
  const base = high ? Math.round((low + high) / 2) : low;
  const unit = (m[3] || '').trim();
  return { base, low, high, unit };
}

// Conservative singular/plural swap on the first word after the count, used when
// scaling countable ingredients ("1 egg" doubled -> "2 eggs"; "3 cloves" halved -> "1 clove").
// ---------- Optionality (steps and ingredients) ----------
// Detection is fuzzy on purpose — we accept the small false-positive risk on phrases
// like "if using" so common cues like "for garnish" get caught at import.
function detectOptionalCues(text) {
  if (!text) return false;
  const s = String(text);
  if (/^\s*\(\s*optional\s*\)/i.test(s)) return true;
  if (/\(\s*optional\s*\)/i.test(s)) return true;
  if (/^\s*optional\s*[:\u2014\u2013-]\s+/i.test(s)) return true;
  if (/\bif\s+desired\b/i.test(s)) return true;
  if (/\bif\s+using\b/i.test(s)) return true;
  if (/\bif\s+you\s+(?:like|prefer|want)\b/i.test(s)) return true;
  if (/\bfor\s+garnish\b/i.test(s)) return true;
  if (/\bto\s+garnish\b/i.test(s)) return true;
  if (/\bfor\s+serving\b/i.test(s)) return true;
  if (/\bto\s+serve\b/i.test(s)) return true;
  return false;
}

// Normalize any optional cue (or existing marker) to a single canonical "(optional) " prefix.
// Leaves the cook's original phrasing intact aside from de-duplicating "(optional)" markers.
function normalizeOptionalText(text) {
  if (!text) return text;
  if (!detectOptionalCues(text)) return text;
  let s = String(text);
  s = s.replace(/^\s*\(\s*optional\s*\)\s*[:\u2014\u2013-]?\s*/i, '');
  s = s.replace(/^\s*optional\s*[:\u2014\u2013-]\s+/i, '');
  s = s.replace(/\s*\(\s*optional\s*\)\s*/gi, ' ');
  s = s.replace(/\s{2,}/g, ' ').trim();
  return '(optional) ' + s;
}

// Split a "(optional) ..." string into its parts for rendering.
function extractOptional(text) {
  if (!text) return { optional: false, text: '' };
  const m = String(text).match(/^\s*\(\s*optional\s*\)\s*[:\u2014\u2013-]?\s*(.*)$/i);
  if (m) return { optional: true, text: m[1] };
  return { optional: false, text: String(text) };
}

// Final-pass normalizer applied to every imported / assembled recipe.
function applyOptionalToRecipe(recipe) {
  if (!recipe) return recipe;
  const ingredients = (recipe.ingredients || []).map(normalizeOptionalText);
  const steps = (recipe.steps || []).map(normalizeOptionalText);
  return { ...recipe, ingredients, steps };
}

function pluralizeIngredientWord(rest, count) {
  const m = rest.match(/^(\s*)([A-Za-z][A-Za-z'\-]*)/);
  if (!m) return rest;
  const lead = m[1], word = m[2];
  const after = rest.slice(lead.length + word.length);
  let out = word;
  if (count > 1 && !/s$/i.test(word)) {
    if (/(?:s|x|ch|sh)$/i.test(word)) out = word + 'es';
    else if (/[^aeiou]y$/i.test(word)) out = word.slice(0, -1) + 'ies';
    else if (/[bcdfghjklmnpqrstvwxz]o$/i.test(word)) out = word + 'es';
    else out = word + 's';
  } else if (count === 1 && /s$/i.test(word)) {
    if (/ies$/i.test(word)) out = word.slice(0, -3) + 'y';
    else if (/oes$/i.test(word)) out = word.slice(0, -2);
    else if (/(?:ses|xes|ches|shes)$/i.test(word)) out = word.slice(0, -2);
    else if (word.length > 2) out = word.slice(0, -1);
  }
  return lead + out + after;
}

function formatIngredient(str, scale) {
  const s = (scale && scale > 0) ? scale : 1;
  try {
    const rawCleaned = cleanRecipeText(str);
    const { optional, text: cleaned } = extractOptional(rawCleaned);
    const reattach = (out) => optional ? '(optional) ' + out : out;
    const parsed = parseIngredient(cleaned);
    if (parsed.kind !== 'parsed') return reattach(cleaned); // vibe / noamount / empty — leave as-is

    // Countable (no unit): "1 onion" -> "2 onions". Round to whole, minimum 1.
    if (!parsed.unit) {
      if (s === 1) return reattach(cleaned);
      const amt = parseAmount(cleaned);
      if (!amt) return reattach(cleaned);
      const newCount = Math.max(1, Math.round(parsed.amount * s));
      const rest = cleaned.slice(amt.matched.length);
      return reattach(newCount + pluralizeIngredientWord(rest, newCount));
    }

    // Measured ingredient: scale the amount, then run it through the existing
    // measurement-display rules (fractions in the preferred unit; grams fallback).
    const scaledAmount = parsed.amount * s;
    const p = { ...parsed, amount: scaledAmount };

    if (p.unit === 'cup') {
      const cleanedAmt = nearestClean(p.amount, CLEAN_CUP);
      if (cleanedAmt !== null) return reattach(renderClean(cleanedAmt, 'cup', p));
    }
    if (p.unit === 'tbsp') {
      const cleanedAmt = nearestClean(p.amount, CLEAN_SMALL);
      if (cleanedAmt !== null) return reattach(renderClean(cleanedAmt, 'tbsp', p));
    }
    if (p.unit === 'tsp') {
      const cleanedAmt = nearestClean(p.amount, CLEAN_SMALL);
      if (cleanedAmt !== null) return reattach(renderClean(cleanedAmt, 'tsp', p));
    }
    if (p.unit === 'lb') {
      const cleanedAmt = nearestClean(p.amount, CLEAN_LB);
      if (cleanedAmt !== null) return reattach(renderClean(cleanedAmt, 'lb', p));
    }

    const density = lookupIngredient(p.ingredient);
    if (!density) {
      if (s !== 1) return reattach(fractionString(p.amount) + ' ' + pluralizeUnit(p.unit, p.amount) + ' ' + p.ingredient + (p.modifier || ''));
      return str;
    }

    const grams = toGrams(p, density);
    if (grams === null || grams <= 0) return str;

    if (density.category === 'meat' || density.category === 'produce') {
      const lbs = grams / 453.6;
      const cleanLb = nearestClean(lbs, CLEAN_LB);
      if (cleanLb !== null && cleanLb > 0) return reattach(renderClean(cleanLb, 'lb', p));
      return reattach(Math.round(grams) + 'g ' + p.ingredient + (p.modifier || ''));
    }

    const cups = density.gPerCup ? grams / density.gPerCup : null;
    const candidates = [];
    if (cups !== null) {
      const cupAmt  = nearestClean(cups, CLEAN_CUP);
      const tbspAmt = nearestClean(cups * 16, CLEAN_SMALL);
      const tspAmt  = nearestClean(cups * 48, CLEAN_SMALL);
      if (cupAmt  !== null && cupAmt  > 0) candidates.push({ unit: 'cup',  amount: cupAmt  });
      if (tbspAmt !== null && tbspAmt > 0) candidates.push({ unit: 'tbsp', amount: tbspAmt });
      if (tspAmt  !== null && tspAmt  > 0) candidates.push({ unit: 'tsp',  amount: tspAmt  });
    }
    const lbAmt = nearestClean(grams / 453.6, CLEAN_LB);
    if (lbAmt !== null && lbAmt > 0) candidates.push({ unit: 'lb', amount: lbAmt });

    if (candidates.length > 0) {
      const best = pickCandidate(candidates, density.category);
      return reattach(renderClean(best.amount, best.unit, p));
    }

    const gramsStr = Math.round(grams) + 'g';
    const approx = cups !== null ? composeVolumeApprox(cups) : '';
    return reattach(gramsStr + ' ' + p.ingredient + (approx ? ' (' + approx + ')' : '') + (p.modifier || ''));
  } catch (e) {
    return str;
  }
}

const HERBS_AMBIGUOUS = new Set([
  'oregano', 'thyme', 'rosemary', 'sage', 'marjoram', 'bay leaves', 'bay leaf'
]);

const FRESH_HERBS_DEFAULT_FRESH = new Set([
  'basil', 'cilantro', 'parsley', 'mint', 'dill', 'chives', 'tarragon'
]);

function categorizeIngredient(rawString) {
  const parsed = parseIngredient(rawString);
  const nameForLookup = (parsed.kind === 'parsed' && parsed.ingredient) ? parsed.ingredient : rawString;
  const fullLower = (rawString || '').toLowerCase();
  const n = nameForLookup.toLowerCase();
  const isFresh = /\bfresh\b/.test(fullLower) || /\bbunch\b/.test(fullLower);
  const isDried = /\bdried\b/.test(fullLower) || /\bground\b/.test(fullLower);

  const keys = Object.keys(INGREDIENT_BINS).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (n.includes(k)) {
      // Ambiguous herbs default to dried; "fresh" or "bunch" promotes to Produce
      if (HERBS_AMBIGUOUS.has(k) && isFresh && !isDried) {
        return { shopping: 'produce', preset: 'produce' };
      }
      // Usually-fresh herbs default to Produce; "dried" or "ground" demotes to Herbs & Spices
      if (FRESH_HERBS_DEFAULT_FRESH.has(k) && isDried && !isFresh) {
        return { shopping: 'pantry', preset: 'herbs_spices' };
      }
      return INGREDIENT_BINS[k];
    }
  }
  return { shopping: 'pantry', preset: 'pantry' };
}

// ---------- Section detection (cooking view) ----------
function isSectionHeader(str) {
  const s = (str || '').trim();
  if (!s) return false;
  if (/^for\b/i.test(s)) return true;
  if (s.endsWith(':')) {
    const first = s[0];
    if (/[0-9\u00BC\u00BD\u00BE\u2153\u2154\u215B\u215C\u215D\u215E]/.test(first)) return false;
    return true;
  }
  return false;
}

function cleanSectionTitle(str) {
  let s = (str || '').trim().replace(/:\s*$/, '').trim();
  if (s.length > 0) s = s[0].toUpperCase() + s.slice(1);
  return s;
}

function splitIntoSections(ingredients) {
  const sections = [];
  let current = { title: '', items: [] };
  for (const ing of ingredients) {
    if (isSectionHeader(ing)) {
      if (current.items.length > 0) sections.push(current);
      current = { title: cleanSectionTitle(ing), items: [] };
    } else {
      current.items.push(ing);
    }
  }
  if (current.items.length > 0) sections.push(current);
  if (sections.length === 0) return null;
  if (sections.length === 1 && !sections[0].title) return null;
  return sections;
}

// ---------- Shopping list helpers ----------
// The Shopping view's per-item checkboxes mean "I have this at home." These helpers
// turn the recipe's ingredients + the user's "I have this" marks into either a count
// (for enabling/disabling the Create button) or a fully-binned shopping list (for the
// shopping-list view itself).

function shoppingItemKey(binId, idx, raw) {
  return 'shopping:' + binId + ':' + idx + ':' + raw;
}

function countUncheckedShopping(ingredients, shoppingChecks) {
  if (!ingredients || ingredients.length === 0) return { total: 0, unchecked: 0 };
  const bins = buildBinnedIngredients(ingredients, 'shopping');
  let total = 0, unchecked = 0;
  for (const binId of SHOPPING_BIN_ORDER) {
    const items = bins[binId] || [];
    items.forEach((it, idx) => {
      total += 1;
      const key = shoppingItemKey(binId, idx, it.raw);
      if (!shoppingChecks || !shoppingChecks[key]) unchecked += 1;
    });
  }
  return { total, unchecked };
}

// Returns an ordered list of { binId, label, items: [{ display, raw, key }] }.
// Items where shoppingChecks[key] is truthy ("I have this") are dropped.
function buildShoppingList(ingredients, shoppingChecks, scale, pantrySet) {
  const result = { bins: [], pantry: [] };
  if (!ingredients || ingredients.length === 0) return result;
  const bins = buildBinnedIngredients(ingredients, 'shopping', scale);
  for (const binId of SHOPPING_BIN_ORDER) {
    const items = bins[binId] || [];
    const remaining = [];
    items.forEach((it, idx) => {
      const key = shoppingItemKey(binId, idx, it.raw);
      if (shoppingChecks && shoppingChecks[key]) return;
      const item = { display: it.display, raw: it.raw, key, binId };
      if (matchesPantry(it.raw, pantrySet)) {
        result.pantry.push(item);
        return;
      }
      remaining.push(item);
    });
    if (remaining.length > 0) {
      result.bins.push({ binId, label: SHOPPING_BIN_LABELS[binId] || binId, items: remaining });
    }
  }
  return result;
}

// ---------- Import-time cleanups ----------
function cleanRecipeText(s) {
  if (typeof s !== 'string') return s;
  let r = cleanText(s);
  // Strip leading dash inside parens: "(-or ground lamb)" -> "(or ground lamb)"
  r = r.replace(/\(-\s*/g, '(');
  // Strip trailing footnote markers (one or more *, †, ‡, §) at end of string
  r = r.replace(/[*\u2020\u2021\u00A7]+\s*$/, '').trimEnd();
  // Standardize unit names
  r = r.replace(/\bteaspoons?\b/gi, 'tsp')
       .replace(/\btablespoons?\b/gi, 'tbsp')
       .replace(/\bounces?\b/gi, 'oz')
       .replace(/\bpounds?\b/gi, 'lb');
  // Collapse double words ("and and pepper" -> "and pepper")
  r = r.replace(/\b([A-Za-z]+)\s+\1\b/gi, '$1');
  return r.trim();
}

// ---------- Duplicate combining (Shopping / Preset views) ----------
function stripForThePrefix(s) {
  if (!s) return '';
  return s.replace(/^for the\s+/i, '').replace(/^for\s+/i, '').trim();
}

function buildBinnedIngredients(ingredients, mode, scale) {
  const s = (scale && scale > 0) ? scale : 1;
  const sections = splitIntoSections(ingredients);
  let entries;
  if (sections) {
    entries = [];
    for (const sec of sections) {
      for (const item of sec.items) {
        entries.push({ raw: item, parsed: parseIngredient(item), section: sec.title || null });
      }
    }
  } else {
    entries = ingredients
      .filter(i => !isSectionHeader(i))
      .map(item => ({ raw: item, parsed: parseIngredient(item), section: null }));
  }

  const bins = {};
  for (const entry of entries) {
    const cat = categorizeIngredient(entry.raw);
    const bin = mode === 'shopping' ? cat.shopping : cat.preset;
    if (!bins[bin]) bins[bin] = [];
    bins[bin].push(entry);
  }
  for (const bin of Object.keys(bins)) {
    bins[bin] = combineDuplicates(bins[bin], s);
  }
  return bins;
}

function combineDuplicates(entries, scale) {
  const s = (scale && scale > 0) ? scale : 1;
  const groups = new Map();
  const order = [];
  for (const entry of entries) {
    let key;
    if (entry.parsed.kind === 'parsed' && entry.parsed.ingredient) {
      key = entry.parsed.ingredient.toLowerCase().trim();
    } else {
      key = '__uniq__' + order.length + '__' + entry.raw;
    }
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(entry);
  }
  const result = [];
  for (const key of order) {
    const group = groups.get(key);
    if (group.length === 1) {
      result.push({ display: formatIngredient(group[0].raw, s), raw: group[0].raw });
    } else {
      result.push(combineGroup(group, s));
    }
  }
  return result;
}

function combineGroup(group, scale) {
  const s = (scale && scale > 0) ? scale : 1;
  const allParsed = group.every(e => e.parsed.kind === 'parsed' && e.parsed.unit);
  const sameUnit = allParsed && group.every(e => e.parsed.unit === group[0].parsed.unit);
  if (!allParsed || !sameUnit) {
    return { display: group.map(e => formatIngredient(e.raw, s)).join(' \u2022 '), raw: group[0].raw };
  }
  const total = group.reduce((sum, e) => sum + e.parsed.amount, 0);
  const unit = group[0].parsed.unit;
  const ingredient = group[0].parsed.ingredient;
  const modifier = group[0].parsed.modifier || '';
  const fake = total + ' ' + unit + ' ' + ingredient + modifier;
  const base = formatIngredient(fake, s);
  const allHaveSections = group.every(e => e.section);
  if (allHaveSections) {
    // Per-section totals scale too.
    const parts = group.map(e => fractionString(e.parsed.amount * s) + ' for ' + stripForThePrefix(e.section).toLowerCase());
    return { display: base + ' (' + parts.join(', ') + ')', raw: group[0].raw };
  }
  return { display: base, raw: group[0].raw };
}

// ---------- Step formatting (timing badges, inline amounts, bold ingredients) ----------
const STEP_STOPWORDS = new Set(['once', 'when', 'after', 'before', 'if', 'now', 'while', 'as', 'in', 'on', 'with', 'for', 'meanwhile', 'until']);

function extractStepTime(text) {
  if (!text) return null;
  // Range: "5 to 10 minutes", "25-30 min"
  const range = text.match(/\b(\d+)\s*(?:to|[-\u2013\u2014])\s*(\d+)\s*(minutes?|mins?|min|hours?|hrs?|hr|seconds?|secs?|sec)\b/i);
  if (range) {
    const u = range[3].toLowerCase();
    let unit = 'min';
    if (/^sec/.test(u) || u === 'sec') unit = 'sec';
    else if (/^hr|^hour/.test(u)) unit = 'hr';
    return range[1] + '\u2013' + range[2] + ' ' + unit;
  }
  // Compound or single: "1 hour 15 minutes" / "5 min" / "30 seconds"
  const h = text.match(/\b(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|hr)\b/i);
  const m = text.match(/\b(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min)\b/i);
  const s = text.match(/\b(\d+(?:\.\d+)?)\s*(?:seconds?|secs?|sec)\b/i);
  if (h || m) {
    const parts = [];
    if (h) parts.push(h[1] + ' hr');
    if (m) parts.push(m[1] + ' min');
    return parts.join(' ');
  }
  if (s) return s[1] + ' sec';
  return null;
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ---------- Cooking-mode per-step timers ----------
// Parse a step's time into seconds for the countdown default. Mirrors extractStepTime's
// detection, but: ranges use the LOWER bound, and a step with two times uses the FIRST.
function stepTimerSeconds(text) {
  if (!text) return null;
  const range = text.match(/\b(\d+)\s*(?:to|[-\u2013\u2014])\s*(\d+)\s*(minutes?|mins?|min|hours?|hrs?|hr|seconds?|secs?|sec)\b/i);
  if (range) {
    const low = parseInt(range[1], 10);
    const u = range[3].toLowerCase();
    if (/^sec/.test(u)) return low;
    if (/^h/.test(u)) return low * 3600;
    return low * 60;
  }
  const h = text.match(/\b(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|hr)\b/i);
  const m = text.match(/\b(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min)\b/i);
  const s = text.match(/\b(\d+(?:\.\d+)?)\s*(?:seconds?|secs?|sec)\b/i);
  if (h || m) {
    let secs = 0;
    if (h) secs += Math.round(parseFloat(h[1]) * 3600);
    if (m) secs += Math.round(parseFloat(m[1]) * 60);
    return secs > 0 ? secs : null;
  }
  if (s) { const v = Math.round(parseFloat(s[1])); return v > 0 ? v : null; }
  return null;
}

function formatTimer(secs) {
  secs = Math.max(0, Math.round(secs || 0));
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  const pad = n => String(n).padStart(2, '0');
  if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

// Short triple beep via Web Audio (no asset file needed).
function playTimerBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    [0, 0.32, 0.64].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.3);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1600);
  } catch (e) {}
}

function requestNotificationPermission() {
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  } catch (e) {}
}

function maybeNotifyTimerDone(recipeTitle, stepNumber) {
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('Timer done \u2014 ' + recipeTitle, {
        body: 'Step ' + stepNumber + ' timer finished.',

}

function annotateStep(step, ingredients, scale, partials, stepIndex) {
  const s = (scale && scale > 0) ? scale : 1;
  const nameMap = {}; // name → { amount, unit } or null if ambiguous
  for (const ing of ingredients) {
    if (isSectionHeader(ing)) continue;
    const parsed = parseIngredient(ing);
    if (parsed.kind !== 'parsed' || !parsed.ingredient || !parsed.unit) continue;
    const name = parsed.ingredient.toLowerCase().trim();
    if (!(name in nameMap)) {
      nameMap[name] = { amount: parsed.amount, unit: parsed.unit };
    } else if (nameMap[name] && nameMap[name].unit === parsed.unit) {
      nameMap[name].amount += parsed.amount;
    } else {
      nameMap[name] = null;
    }
  }

  // Build partial lookup for THIS step. For ingredients split across steps, the use
  // entry tells us how much this step takes vs the recipe's total.
  const stepPartials = {};
  if (Array.isArray(partials) && typeof stepIndex === 'number') {
    for (const p of partials) {
      if (!p || !Array.isArray(p.uses)) continue;
      const use = p.uses.find(u => u && u.stepIndex === stepIndex);
      if (!use) continue;
      const name = String(p.ingredient || '').toLowerCase().trim();
      if (!name) continue;
      stepPartials[name] = {
        stepAmount: Number(use.amount),
        totalAmount: Number(p.totalAmount),
        unit: String(p.totalUnit || ''),
      };
    }
  }

  // Format helper: "<n> <unit>" with fraction symbols, omitting unit for countables.
  const fmtAmount = (amount, unit) => {
    const str = fractionString(amount);
    return unit ? (str + ' ' + pluralizeUnit(unit, amount)) : str;
  };

  let result = step;
  const handled = new Set();

  // 1) Partial-of-total substitutions take precedence. Convention:
  //    "[step amount] of the [ingredient] ([total amount] total)"
  const partialNames = Object.keys(stepPartials).sort((a, b) => b.length - a.length);
  for (const name of partialNames) {
    if (handled.has(name)) continue;
    const { stepAmount, totalAmount, unit } = stepPartials[name];
    const stepStr = fmtAmount(stepAmount * s, unit);
    const totalStr = fmtAmount(totalAmount * s, unit) + ' total';
    // If the step already has an inline amount in front of the name, don't restate it —
    // just append the "(X total)" hint after the ingredient.
    const inlineRe = new RegExp('\\b\\d+(?:\\.\\d+)?\\s*(?:cups?|tbsps?|tsps?|tablespoons?|teaspoons?|grams?|g|oz|lb|ml|l|kg)?\\s+' + escapeRegex(name) + '\\b', 'i');
    if (inlineRe.test(result)) {
      const re = new RegExp('\\b(' + escapeRegex(name) + ')\\b(?!\\s*\\()', 'i');
      if (re.test(result)) {
        result = result.replace(re, '$1 (' + totalStr + ')');
        handled.add(name);
      }
    } else {
      // Bare mention — substitute with the full "X of the Y (Z total)" phrasing.
      const re = new RegExp('\\b(?:the\\s+)?(' + escapeRegex(name) + ')\\b(?!\\s*\\()', 'i');
      if (re.test(result)) {
        result = result.replace(re, stepStr + ' of the $1 (' + totalStr + ')');
        handled.add(name);
      }
    }
  }

  // 2) For ingredients NOT in partials, the existing inline-amount annotation.
  const names = Object.keys(nameMap).filter(n => nameMap[n] && n.length >= 3 && !handled.has(n)).sort((a, b) => b.length - a.length);
  for (const name of names) {
    if (handled.has(name)) continue;
    const re = new RegExp('\\b(' + escapeRegex(name) + ')\\b(?!\\s*\\()', 'i');
    if (re.test(result)) {
      const { amount, unit } = nameMap[name];
      const scaled = amount * s;
      const amountStr = fractionString(scaled) + ' ' + pluralizeUnit(unit, scaled);
      result = result.replace(re, '$1 (' + amountStr + ')');
      handled.add(name);
    }
  }
  return result;
}

// ---------- Bolding ingredient names within step text ----------
// Collect the bare ingredient names from a recipe (dropping amounts, descriptors,
// and parentheticals) so we can bold them where they appear in the method.
function ingredientNamesForBolding(ingredients) {
  const names = new Set();
  for (const ing of ingredients || []) {
    if (isSectionHeader(ing)) continue;
    const parsed = parseIngredient(ing);
    let name = (parsed.kind === 'parsed' && parsed.ingredient) ? parsed.ingredient : '';
    name = (name || '').toLowerCase().trim();
    name = name.split(',')[0].trim();            // "onions, diced" -> "onions"
    name = name.replace(/\(.*?\)/g, '').trim();  // "onion (large)" -> "onion"
    if (name.length >= 3) names.add(name);
  }
  return names;
}

// One case-insensitive regex matching any ingredient name (plus a simple singular/
// plural variant), longest first so multi-word names win over their fragments.
function buildIngredientRegex(ingredients) {
  const names = ingredientNamesForBolding(ingredients);
  if (names.size === 0) return null;
  const variants = new Set();
  for (const n of names) {
    variants.add(n);
    if (/[^s]s$/.test(n)) variants.add(n.slice(0, -1)); // plural -> singular
    else if (!/s$/.test(n)) variants.add(n + 's');      // singular -> plural
  }
  const sorted = Array.from(variants).filter(v => v.length >= 3).sort((a, b) => b.length - a.length);
  if (sorted.length === 0) return null;
  return new RegExp('\\b(' + sorted.map(escapeRegex).join('|') + ')\\b', 'gi');
}

// ---------- Cooking-term glossary (hover definitions in step text) ----------
// Fixed, baked-in glossary — no AI lookup per view. Definitions are deliberately one
// sentence in plain words. To add a term, append an entry; for ambiguous words like
// "cream" (verb vs. dairy noun), supply a custom `regex` with context lookahead.
const COOKING_GLOSSARY = [
  { term: 'sauté',     def: 'Cook quickly in a small amount of fat over relatively high heat, stirring or tossing often.', regex: /\bsaut[eé](?![a-zA-Z])/i },
  { term: 'fold',      def: 'Combine a light mixture into a heavier one with gentle sweeping strokes so the air isn\u2019t knocked out.' },
  { term: 'deglaze',   def: 'Pour liquid into a hot pan to lift the browned bits off the bottom.' },
  { term: 'sear',      def: 'Cook the surface at high heat to develop a deep brown crust.' },
  { term: 'braise',    def: 'Brown first, then cook slowly in a small amount of liquid, partially covered.' },
  { term: 'blanch',    def: 'Briefly plunge into boiling water, then transfer to ice water to stop the cooking.' },
  { term: 'simmer',    def: 'Keep just below a boil \u2014 small bubbles break the surface but it isn\u2019t rolling.' },
  { term: 'sweat',     def: 'Cook gently in fat over low heat to soften without browning.' },
  { term: 'temper',    def: 'Slowly raise the temperature of something delicate (like eggs) by adding the hot liquid bit by bit.' },
  { term: 'proof',     def: 'Let a dough rest so the yeast does its work and the dough rises.' },
  { term: 'cream',     def: 'Beat butter and sugar together until light, fluffy, and pale.', regex: /\bcream(?=\s+(?:the|together|until|with|butter|sugar|fluffy|pale)\b)/i },
  { term: 'score',     def: 'Make shallow cuts on the surface to help fat render, dough expand, or flavor penetrate.' },
  { term: 'render',    def: 'Slowly cook fat until it melts out and any solids brown.' },
  { term: 'reduce',    def: 'Simmer to evaporate water, concentrating flavor and thickening.', regex: /\breduce(?=\s+(?:by|to|until|the\s+(?:liquid|sauce|wine|stock|broth|cream|mixture|pan|heat\s+and\s+simmer)))/i },
  { term: 'whisk',     def: 'Beat with a whisk to combine, smooth, or aerate.' },
  { term: 'zest',      def: 'Grate the colored outer layer of a citrus peel for flavor; avoid the bitter white pith.' },
  { term: 'julienne',  def: 'Cut into long, thin matchstick-sized strips.' },
  { term: 'dice',      def: 'Cut into small, even cubes \u2014 typically about a quarter-inch.' },
  { term: 'mince',     def: 'Chop into very fine pieces, smaller than dice.' },
];

function glossaryRegexFor(entry) {
  return entry.regex || new RegExp('\\b' + escapeRegex(entry.term) + '\\b', 'i');
}

// Hoverable underline for a cooking-technique mention. Built to also work on tap later:
// onClick toggles the same state hover uses, so mobile gets the same affordance.
function TechniqueTerm({ term, definition, children }) {
  const [open, setOpen] = useState(false);
  return (
    <span className="relative inline-block">
      <span
        className="border-b border-dotted border-stone-400 cursor-help"
        onMouseEnter={() => setOpen(true)}
        onMouseLeave={() => setOpen(false)}
        onClick={() => setOpen(o => !o)}
      >
        {children}
      </span>
      {open && (
        <span
          role="tooltip"
          className="absolute z-30 left-1/2 -translate-x-1/2 top-full mt-2 px-3 py-2 rounded-lg shadow-lg text-xs leading-snug font-normal not-italic pointer-events-none"
          style={{ background: '#1F1B16', color: '#FAF6EF', minWidth: '180px', maxWidth: '260px' }}
        >
          <span className="block font-medium capitalize mb-0.5" style={{ color: '#FCEFD9' }}>{term}</span>
          <span style={{ color: '#D6CFC2' }}>{definition}</span>
        </span>
      )}
    </span>
  );
}

// Split step text into React nodes. Wraps ingredient-name matches in <b> and matched
// cooking-technique terms in a hoverable underlined span. To avoid clutter, each technique
// is wrapped only on its first occurrence; ingredient highlighting wins on overlap.
function renderStepWithBoldIngredients(text, regex) {
  if (!text) return text;
  const matches = []; // { start, end, type, payload }

  if (regex) {
    regex.lastIndex = 0;
    let m;
    while ((m = regex.exec(text)) !== null) {
      if (m[0].length === 0) { regex.lastIndex++; continue; }
      matches.push({ start: m.index, end: m.index + m[0].length, type: 'ing', text: m[0] });
    }
  }

  // First-occurrence-only per technique term.
  const seenTerms = new Set();
  for (const entry of COOKING_GLOSSARY) {
    if (seenTerms.has(entry.term)) continue;
    const re = glossaryRegexFor(entry);
    const m = re.exec(text);
    if (!m) continue;
    matches.push({ start: m.index, end: m.index + m[0].length, type: 'tech', text: m[0], term: entry.term, def: entry.def });
    seenTerms.add(entry.term);
  }

  // Ingredient highlighting wins on overlap.
  const ingRanges = matches.filter(x => x.type === 'ing').map(x => [x.start, x.end]);
  const accepted = matches.filter(x => x.type === 'ing' || !ingRanges.some(([s, e]) => x.start < e && x.end > s));
  accepted.sort((a, b) => a.start - b.start || (a.type === 'ing' ? -1 : 1));

  // Drop any tech that overlaps an earlier accepted range (e.g., a second ingredient
  // sitting inside a technique match — unusual, but be safe).
  const nodes = [];
  let last = 0, key = 0;
  for (const m of accepted) {
    if (m.start < last) continue;
    if (m.start > last) nodes.push(text.slice(last, m.start));
    if (m.type === 'ing') {
      nodes.push(<b key={'ing' + key++} className="font-semibold text-stone-900">{m.text}</b>);
    } else {
      nodes.push(<TechniqueTerm key={'tech' + key++} term={m.term} definition={m.def}>{m.text}</TechniqueTerm>);
    }
    last = m.end;
  }
  if (last < text.length) nodes.push(text.slice(last));
  return nodes;
}

// ---------- Time totals & domain ----------
function parseMinutes(timeStr) {
  if (!timeStr || typeof timeStr !== 'string') return 0;
  let total = 0;
  const h = timeStr.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|hr)\b/i);
  if (h) total += parseFloat(h[1]) * 60;
  const m = timeStr.match(/(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min)\b/i);
  if (m) total += parseFloat(m[1]);
  return Math.round(total);
}

function formatMinutes(min) {
  if (!min || min <= 0) return '';
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h && m) return h + ' hr ' + m + ' min';
  if (h) return h + ' hr';
  return m + ' min';
}

// ---------- Category labels (structured tags across dimensions) ----------
// AI-assigned at import (meal type, diet, protein, cuisine, method); cook-time bucket
// is computed from the recipe's total time. All editable. These feed the main-page rows.
const LABEL_DIMENSIONS = [
  { key: 'mealType', label: 'Meal',    free: false, options: ['breakfast', 'lunch', 'dinner', 'dessert', 'snack', 'side'] },
  { key: 'diet',     label: 'Diet',    free: true,  options: ['vegetarian', 'vegan', 'gluten-free', 'dairy-free', 'pescatarian', 'keto', 'low-carb'] },
  { key: 'protein',  label: 'Protein', free: true,  options: ['chicken', 'beef', 'pork', 'seafood', 'lamb', 'turkey', 'tofu', 'eggs', 'none'] },
  { key: 'cuisine',  label: 'Cuisine', free: true,  options: ['italian', 'mexican', 'thai', 'french', 'indian', 'chinese', 'japanese', 'mediterranean', 'american', 'middle eastern', 'korean', 'greek', 'spanish'] },
  { key: 'method',   label: 'Method',  free: true,  options: ['oven', 'stovetop', 'slow cooker', 'no-cook', 'grilled', 'air fryer', 'pressure cooker', 'baked'] },
];
const LABEL_KEYS = LABEL_DIMENSIONS.map(d => d.key);

// Return a complete labels object (all dimensions present as arrays).
function normalizeLabels(labels) {
  const out = {};
  for (const k of LABEL_KEYS) {
    const v = labels ? labels[k] : null;
    out[k] = Array.isArray(v) ? v.map(s => String(s).toLowerCase().trim()).filter(Boolean) : [];
  }
  return out;
}

function hasAnyLabels(labels) {
  const n = normalizeLabels(labels);
  return LABEL_KEYS.some(k => n[k].length > 0);
}

// Computed (no AI): quick (<30 min), medium (30–60), long (>60). Null if no time known.
function cookTimeBucket(recipe) {
  const mins = parseMinutes(recipe.prepTime) + parseMinutes(recipe.cookTime);
  if (!mins || mins <= 0) return null;
  if (mins < 30) return 'quick';
  if (mins <= 60) return 'medium';
  return 'long';
}
const COOK_TIME_BUCKET_LABELS = { quick: 'Quick · under 30 min', medium: 'Medium · 30–60 min', long: 'Long · over 1 hr' };
const COOK_TIME_BUCKET_SHORT  = { quick: 'Quick', medium: 'Medium', long: 'Long' };

function getDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch (e) { return null; }
}

function loadChecks(recipeId) {
