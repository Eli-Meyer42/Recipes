const STORAGE_KEY = 'recipes_v1';

const STATUSES = [

];

const statusById = (id) => STATUSES.find(s => s.id === id) || STATUSES[0];
const newId = () => 'r_' + Math.random().toString(36).slice(2, 10);

// Notes can live on a recipe in two shapes: legacy single string, or modern array
// of { id, date, text } entries. Always migrate before rendering.
function migrateNotes(notes, fallbackDate) {
  if (Array.isArray(notes)) {
    return notes.filter(n => n && typeof n.text === 'string' && n.text.trim());
  }
  if (typeof notes === 'string' && notes.trim()) {
    return [{ id: newId(), date: fallbackDate || Date.now(), text: notes.trim() }];
  }
  return [];
}

function formatNoteDate(timestamp) {
  try {
    return new Date(timestamp).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch (e) {
    return '';
  }
}

// Turn a URL slug into a human-readable title.
// "https://example.com/recipes/the-best-classic-shepherds-pie" → "The Best Classic Shepherds Pie"
function slugToTitle(url) {
  try {
    const u = new URL(url);
    const parts = u.pathname.split('/').filter(Boolean);
    const last = parts.length > 0
      ? parts[parts.length - 1].replace(/\.html?$|\.php$|\.aspx?$/i, '')
      : u.hostname.replace(/^www\./, '');
    const words = last.replace(/[-_]+/g, ' ').split(' ').filter(Boolean);
    if (words.length === 0) return u.hostname.replace(/^www\./, '') || 'Untitled recipe';
    return words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ').trim();
  } catch (e) {
    return 'Untitled recipe';
  }
}

// A placeholder recipe shape — created when URL import fails so the user doesn't lose the link.
function makePlaceholderRecipe(url, errMsg) {
  return {
    id: newId(),
    title: slugToTitle(url),
    description: '',
    status: 'wantto',
    servings: '',
    prepTime: '',
    cookTime: '',
    source: url,
    ingredients: [],
    steps: [],
    notes: [],
    tags: [],
    incomplete: true,
    failureReason: errMsg || 'Import failed.',
    createdAt: Date.now(),
  };
}

// Find an existing incomplete placeholder for this URL (used to update during retries).
function findIncompletePlaceholderForUrl(url, existing) {
  const norm = normalizeRecipeUrl(url);
  if (!norm || !Array.isArray(existing)) return null;
  return existing.find(r => r && r.incomplete && normalizeRecipeUrl(r.source) === norm) || null;
}

// Shared retry path: fetch a URL, run the AI rewrite if configured, and graft an existing
// placeholder's identity onto the result when present (so a successful retry replaces the
// placeholder instead of duplicating it). Throws on fetch failure; AI failures are tolerated
// and just leave guided/quick null. Used by both the import-screen retry and the
// placeholder-card retry, so they share one code path.
async function buildRecipeFromUrl(url, placeholder, onProgress, signal) {
  let recipe = null;
  let viaAi = false;

  try {
    // Cascade step 1: structured-data import (fast, free, no AI).
    recipe = await fetchAndParseRecipe(url, signal);
  } catch (e) {
    throwIfAborted(signal);
    if (isCancelled(e, signal)) throw e;
    // Cascade step 2: page was reachable but lacked clean structured data → fetch its
    // text and run AI extraction automatically. No user action required.
    if (e && e.code === 'no_structured_data' && e.pageBody && isAiConfigured()) {
      if (onProgress) onProgress('extracting');
      const text = htmlToText(e.pageBody);
      const extracted = await aiExtractRecipeFromText(text, url, signal); // throws on AI failure; null if no recipe
      throwIfAborted(signal);
      if (!extracted) {
        const err = new Error('We loaded the page but couldn\u2019t find a recipe on it. Try pasting the page text instead.');
        err.code = 'no_recipe';
        throw err;
      }
      recipe = extracted;
      viaAi = true;
    } else {
      // Cascade step 3: page hard-blocked (fetch_failed), or AI unavailable → propagate so
      // the import screen offers manual paste.
      throw e;
    }
  }
  throwIfAborted(signal);

  // AI text-extraction can come back partial (e.g. ingredients but no method).
  const missing = [];
  if (!recipe.ingredients || recipe.ingredients.length === 0) missing.push('ingredients');
  if (!recipe.steps || recipe.steps.length === 0) missing.push('method');
  const partial = viaAi && missing.length > 0;

  // Typo correction — runs FIRST so styled rewrites / labels / partials all work on clean text.
  if (isAiConfigured()) {
    const before = {
      title: recipe.title || '',
      description: recipe.description || '',
      ingredients: [...(recipe.ingredients || [])],
      steps: [...(recipe.steps || [])],
    };
    const corrected = await aiTypoCorrectRecipe(recipe, signal);
    throwIfAborted(signal);
    if (corrected) {
      recipe = { ...recipe, ...corrected };
      if (typoDiffsExist(before, corrected)) recipe.importOriginal = before;
    }
  }

  if (isAiConfigured() && recipe.steps && recipe.steps.length > 0) {
    if (onProgress) onProgress('rewriting');
    const { guidedSteps, quickSteps } = await generateBothStyles(recipe, signal);
    throwIfAborted(signal);
    recipe = { ...recipe, guidedSteps, quickSteps };
  }
  if (isAiConfigured() && !partial) {
    const labels = await aiLabelRecipe(recipe, signal);
    throwIfAborted(signal);
    if (labels) recipe = { ...recipe, labels };
  }
  if (isAiConfigured() && !partial && (recipe.steps || []).length >= 2 && (recipe.ingredients || []).length >= 2) {
    const rawPartials = await aiDetectPartials(recipe, signal);
    throwIfAborted(signal);
    const reconciled = reconcilePartials(rawPartials, recipe);
    if (reconciled.length > 0) recipe = { ...recipe, partials: reconciled };
  }

  if (partial) {
    recipe = {
      ...recipe,
      incomplete: true,
      failureReason: 'AI extracted partial data \u2014 missing ' + missing.join(' and ') + '.',
    };
  }

  if (placeholder) {
    recipe = {
      ...recipe,
      id: placeholder.id,
      createdAt: placeholder.createdAt,
      notes: Array.isArray(placeholder.notes) ? placeholder.notes : (recipe.notes || []),
      status: (placeholder.status && placeholder.status !== 'wantto') ? placeholder.status : (recipe.status || 'wantto'),
    };
    if (!partial) {
      recipe.incomplete = false;
      recipe.failureReason = '';
    }
  }
  return applyOptionalToRecipe(recipe);
}

// Parallel path to buildRecipeFromUrl: AI extracts a recipe from arbitrary pasted page text.
// Returns { recipe, partial, missing } on success, or null if the AI says no recipe is present.
// Throws on AI/network failure so the caller can offer a retry with the user's text intact.
async function buildRecipeFromText(pastedText, sourceUrl, onProgress, signal) {
  const raw = await aiExtractRecipeFromText(pastedText, sourceUrl, signal);
  throwIfAborted(signal);
  if (!raw) return null;

  const missing = [];
  if (!raw.ingredients || raw.ingredients.length === 0) missing.push('ingredients');
  if (!raw.steps || raw.steps.length === 0) missing.push('method');
  const partial = missing.length > 0;

  let recipe = raw;
  // Typo correction first, so downstream passes work on clean text.
  if (isAiConfigured()) {
    const before = {
      title: recipe.title || '',
      description: recipe.description || '',
      ingredients: [...(recipe.ingredients || [])],
      steps: [...(recipe.steps || [])],
    };
    const corrected = await aiTypoCorrectRecipe(recipe, signal);
    throwIfAborted(signal);
    if (corrected) {
      recipe = { ...recipe, ...corrected };
      if (typoDiffsExist(before, corrected)) recipe.importOriginal = before;
    }
  }

  if (!partial && recipe.steps.length > 0) {
    if (onProgress) onProgress('rewriting');
    try {
      const { guidedSteps, quickSteps } = await generateBothStyles(recipe, signal);
      throwIfAborted(signal);
      recipe = { ...recipe, guidedSteps, quickSteps };
    } catch (e) {
      if (isCancelled(e, signal)) throw e;
      // Style rewrite is a nice-to-have; tolerate failure and keep the raw steps.
      console.warn('Style rewrite failed for pasted-text extraction:', e);
    }
    const labels = await aiLabelRecipe(recipe, signal);
    throwIfAborted(signal);
    if (labels) recipe = { ...recipe, labels };
    if ((recipe.steps || []).length >= 2 && (recipe.ingredients || []).length >= 2) {
      const rawPartials = await aiDetectPartials(recipe, signal);
      throwIfAborted(signal);
      const reconciled = reconcilePartials(rawPartials, recipe);
      if (reconciled.length > 0) recipe = { ...recipe, partials: reconciled };
    }
  }

  if (partial) {
    recipe = {
      ...recipe,
      incomplete: true,
      failureReason: 'AI extracted partial data \u2014 missing ' + missing.join(' and ') + '.',
    };
  }

  // If this text-paste is the reactive pivot from a failed URL import, the existing
  // placeholder for that URL should be replaced rather than duplicated. Mirrors the
  // graft logic in buildRecipeFromUrl.
  const norm = normalizeRecipeUrl(sourceUrl);
  if (norm) {
    const persisted = loadRecipes() || [];
    const placeholder = findIncompletePlaceholderForUrl(sourceUrl, persisted);
    if (placeholder) {
      recipe = {
        ...recipe,
        id: placeholder.id,
        createdAt: placeholder.createdAt,
        notes: Array.isArray(placeholder.notes) ? placeholder.notes : (recipe.notes || ''),
        status: (placeholder.status && placeholder.status !== 'wantto') ? placeholder.status : (recipe.status || 'wantto'),
      };
      if (!partial) {
        recipe.incomplete = false;
        recipe.failureReason = '';
      }
    }
  }

  return { recipe: applyOptionalToRecipe(recipe), partial, missing };
}

// ---------- Storage ----------
function loadRecipes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return null;
}

function saveRecipes(recipes) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  } catch (e) {
    console.error('Failed to save recipes', e);
  }
}

// ---------- Collections storage ----------
// User-made collections live in their own store as metadata: [{ id, name, description, createdAt }].
// Membership is stored ON each recipe (recipe.collections = [collectionId, ...]) so deleting a
// recipe cleans up its memberships automatically.
const COLLECTIONS_KEY = 'recipes_collections_v1';
function loadCollections() {
  try {
    const raw = localStorage.getItem(COLLECTIONS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return [];
}
function saveCollections(collections) {
  try {
    localStorage.setItem(COLLECTIONS_KEY, JSON.stringify(collections));
  } catch (e) {

// ---------- Backup / restore (data portability + cross-version, cross-device) ----------
// One backup bundle gathers every persistent thing the app stores, stamped with a
// schema version and a timestamp. Stored values are copied verbatim so the existing
// (defensive) loaders handle any shape upgrades on the way back in. The API key is
// deliberately NEVER included, so a backup file is safe to email / AirDrop around.
const DATA_SCHEMA_VERSION = 1;
const META_KEY = 'recipes_meta_v1';
const SYNC_REV_KEY = 'recipes_sync_rev'; // local data version for cloud sync; never synced itself
// Any key starting with these prefixes is per-recipe data and gets backed up.
const BACKUP_PREFIXES = ['recipes_checks_', 'recipes_method_view_'];
// Resolved lazily (these key constants are defined later in the file).
function backupExplicitKeys() { return [STORAGE_KEY, COLLECTIONS_KEY, PANTRY_KEY, GOTOS_KEY, SCRATCHPAD_KEY, VIEW_MODE_KEY]; }
function backupNeverKeys() { return [AI_KEY_STORAGE, META_KEY, SYNC_REV_KEY]; } // never exported, synced, or overwritten

function isBackupKey(k) {
  if (!k || backupNeverKeys().includes(k)) return false;
  if (backupExplicitKeys().includes(k)) return true;
  return BACKUP_PREFIXES.some(p => k.startsWith(p));
}

function loadMeta() {
  try { const v = localStorage.getItem(META_KEY); return v ? JSON.parse(v) : {}; }
  catch (e) { return {}; }
}
function saveMeta(m) {
  try { localStorage.setItem(META_KEY, JSON.stringify(m || {})); } catch (e) {}
}

// Snapshot all persistent app data into a portable bundle.
function gatherBackupBundle() {
  const store = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isBackupKey(k)) {
      const v = localStorage.getItem(k);
      if (v != null) store[k] = v;
    }
  }
  let recipes = [];
  try { recipes = JSON.parse(store[STORAGE_KEY] || '[]'); } catch (e) {}
  return {
    app: 'recipe-app',
    schemaVersion: DATA_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    recipeCount: Array.isArray(recipes) ? recipes.length : 0,
    store,
  };
}

// Trigger a file download of the current data. Stamps "last saved".
function downloadBackup() {
  const bundle = gatherBackupBundle();
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  a.href = url;
  a.download = 'recipe-app-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  saveMeta({ ...loadMeta(), lastExportedAt: new Date().toISOString() });
  return bundle;
}

// Validate a pasted/read backup file. Throws a friendly error if it's not one.
function parseBackupFile(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error('That file isn\u2019t readable \u2014 it may be corrupted or not a backup.'); }
  if (!data || data.app !== 'recipe-app' || typeof data.store !== 'object' || data.store === null) {
    throw new Error('That doesn\u2019t look like a recipe app backup file.');
  }
  return data;
}

// Hook for future structural upgrades. For now the stored values are written back
// verbatim and the app's own loaders normalize them, so this is identity.
function migrateBundleStore(store, fromVersion) {
  return store || {};
}

function summarizeBundle(bundle) {
  const store = bundle.store || {};
  const count = (key) => { try { const a = JSON.parse(store[key] || '[]'); return Array.isArray(a) ? a.length : 0; } catch (e) { return 0; } };
  return {
    recipeCount: typeof bundle.recipeCount === 'number' ? bundle.recipeCount : count(STORAGE_KEY),
    collectionCount: count(COLLECTIONS_KEY),
    pantryCount: count(PANTRY_KEY),
    exportedAt: bundle.exportedAt || '',
    newerThanApp: (bundle.schemaVersion || 1) > DATA_SCHEMA_VERSION,
  };
}

function recipeStamp(r) { return (r && (r.updatedAt || r.createdAt)) || 0; }

// Merge incoming recipes into current: union by id, newer copy wins on a clash.
function mergeRecipesInto(incomingRaw) {
  let incoming = []; try { incoming = JSON.parse(incomingRaw || '[]'); } catch (e) {}
  if (!Array.isArray(incoming)) incoming = [];
  let current = []; try { current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) {}
  if (!Array.isArray(current)) current = [];
  const byId = new Map();
  for (const r of current) if (r && r.id) byId.set(r.id, r);
  for (const r of incoming) {
    if (!r || !r.id) continue;
    const ex = byId.get(r.id);
    if (!ex || recipeStamp(r) >= recipeStamp(ex)) byId.set(r.id, r);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...byId.values()]));
}

// Union by id; incoming wins on clash. Used for collections + pantry.
function mergeByIdInto(key, incomingRaw) {
  let incoming = []; try { incoming = JSON.parse(incomingRaw || '[]'); } catch (e) {}
  if (!Array.isArray(incoming)) return;
  let current = []; try { current = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
  if (!Array.isArray(current)) current = [];
  const byId = new Map();
  for (const x of current) if (x && x.id) byId.set(x.id, x);
  for (const x of incoming) if (x && x.id) byId.set(x.id, x);
  localStorage.setItem(key, JSON.stringify([...byId.values()]));
}

// Single text blob: don't clobber active local notes; only fill in if empty.
function mergeScratchpadInto(incoming) {
  if (typeof incoming !== 'string' || !incoming.trim()) return;
  const cur = localStorage.getItem(SCRATCHPAD_KEY) || '';
  if (!cur.trim()) localStorage.setItem(SCRATCHPAD_KEY, incoming);
}

function clearBackupTargets() {
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isBackupKey(k)) toRemove.push(k);
  }
  for (const k of toRemove) localStorage.removeItem(k);
}

// Apply a validated bundle. mode: 'replace' (wipe + load) or 'merge' (combine, newer wins).
// Never touches the saved API key. Stamps "last imported".
function applyBackup(bundle, mode) {
  const store = migrateBundleStore(bundle.store || {}, bundle.schemaVersion || 1);
  if (mode === 'replace') {
    clearBackupTargets();
    for (const [k, v] of Object.entries(store)) {
      if (!isBackupKey(k)) continue;
      try { localStorage.setItem(k, v); } catch (e) {}
    }
  } else {
    mergeRecipesInto(store[STORAGE_KEY]);
    mergeByIdInto(COLLECTIONS_KEY, store[COLLECTIONS_KEY]);
    mergeByIdInto(PANTRY_KEY, store[PANTRY_KEY]);
    mergeScratchpadInto(store[SCRATCHPAD_KEY]);
    for (const [k, v] of Object.entries(store)) {
      if (BACKUP_PREFIXES.some(p => k.startsWith(p))) {
        try { localStorage.setItem(k, v); } catch (e) {}
      }
    }
  }
  saveMeta({ ...loadMeta(), lastImportedAt: new Date().toISOString() });
}

function formatBackupTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

// ---------- Cloud sync (Firebase) ----------
// Local storage stays the source of truth; the cloud copy is a mirror. One JSON blob
// per the whole data set, newest rev wins. Reuses the backup bundle's snapshot so
// sync and file-backup move the exact same data (and never the API key).
const SYNC_DB_PATH = 'recipes/main';
function loadLocalRev() { try { return +(localStorage.getItem(SYNC_REV_KEY) || 0) || 0; } catch (e) { return 0; } }
function bumpLocalRev() { const r = Date.now(); try { localStorage.setItem(SYNC_REV_KEY, String(r)); } catch (e) {} return r; }

const RecipeSync = (() => {
  let ref = null, ready = false, applying = false;
  let status = 'init';           // init | synced | saving | offline | error | off
  let lastPushedRev = 0;
  let onRemote = null;
  let pushTimer = null;
  const subs = [];

  function setStatus(s) { status = s; subs.forEach(fn => { try { fn(s); } catch (e) {} }); }
  function subscribe(fn) { subs.push(fn); try { fn(status); } catch (e) {} return () => { const i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; }

  function snapshotStore() { const b = gatherBackupBundle(); return b.store || {}; }

  function writeStoreLocally(store) {
    applying = true;
    try {
      clearBackupTargets();
      for (const [k, v] of Object.entries(store)) {
        if (isBackupKey(k)) { try { localStorage.setItem(k, v); } catch (e) {} }
      }
    } finally { applying = false; }
  }

  function pushNow() {
    if (!ref) return;
    const rev = loadLocalRev() || bumpLocalRev();
    lastPushedRev = rev;
    setStatus('saving');
    ref.set({ rev, store: snapshotStore() })
      .then(() => setStatus('synced'))
      .catch(() => setStatus('error'));
  }

  function schedulePush() {
    if (applying) return;          // don't echo a remote write back up
    bumpLocalRev();                // local data advanced (counts even before a push lands)
    if (!ready) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 500);
  }

  function flush() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; pushNow(); }
  }

  function init() {
    if (!window.FIREBASE || typeof firebase === 'undefined') { setStatus('off'); return; }
    try {
      firebase.initializeApp(window.FIREBASE);
      const db = firebase.database();
      ref = db.ref(SYNC_DB_PATH);
      try {
        db.ref('.info/connected').on('value', snap => {
          if (snap.val() === true) { if (status === 'offline' || status === 'init') setStatus('synced'); }
          else setStatus('offline');
        });
      } catch (e) {}
    } catch (e) { setStatus('error'); return; }

    ref.on('value', snap => {
      const val = snap.val();
      if (!val || typeof val.rev !== 'number') { pushNow(); return; } // empty cloud → seed
      if (val.rev === lastPushedRev) { setStatus('synced'); return; } // our own echo
      const localRev = loadLocalRev();
      if (val.rev > localRev) {
        if (val.store) {
          writeStoreLocally(val.store);
          try { localStorage.setItem(SYNC_REV_KEY, String(val.rev)); } catch (e) {}
          if (onRemote) { try { onRemote(); } catch (e) {} }
        }
        setStatus('synced');
      } else if (val.rev < localRev) {
        pushNow();                 // our local is newer → propagate up
      } else {
        setStatus('synced');
      }
    }, () => setStatus('error'));

    ready = true;
  }

  return { init, flush, pushNow, schedulePush, subscribe, getStatus: () => status, setOnRemote: fn => { onRemote = fn; } };
})();

// Any write to a synced key schedules a cloud push — one hook instead of touching
// every save site. Writes made while applying a remote update are skipped (no echo).
(function patchStorageForSync() {
  try {
    const orig = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function (k, v) {
      orig(k, v);
      try { if (isBackupKey(k)) RecipeSync.schedulePush(); } catch (e) {}
    };
  } catch (e) {}
})();

// Prep / cut adjectives that describe HOW an ingredient was prepared rather than
// WHAT it is — stripped before pantry matching so "ground cumin" matches "cumin".
// Deliberately conservative: types like "smoked", "kosher", "extra virgin", "black"
// stay, because they distinguish meaningfully different ingredients.
const PREP_WORDS = new Set([
  'ground', 'fresh', 'dried', 'minced', 'chopped', 'sliced', 'diced', 'crushed',
  'grated', 'peeled', 'whole', 'finely', 'coarsely', 'roughly', 'lightly',
  'toasted', 'roasted', 'shredded', 'julienned', 'quartered', 'halved', 'cubed',
  'beaten', 'melted', 'softened', 'cooked', 'raw',
]);

// Strip an ingredient line down to its core noun for pantry matching.
function pantryCore(raw) {
  if (!raw) return '';
  let s = cleanRecipeText(String(raw)).toLowerCase().trim();
  // "(optional) ..." prefix
  s = s.replace(/^\(\s*optional\s*\)\s*[:\u2014\u2013-]?\s*/i, '').trim();
  // Section headers — never match
  if (/^for\s+(?:the\s+)?/i.test(raw) && /:\s*$/.test(raw)) return '';
  // Vibe prefixes
  s = s.replace(/^(?:a\s+)?(?:pinch|glug|splash|dash|handful|bunch|sprig|drizzle|squeeze|knob)\s+of\s+/i, '');
  // "to taste" trailing
  s = s.replace(/,?\s*to\s+taste\s*$/i, '').trim();
  // Strip leading amount (digits, ascii + unicode fractions, ranges, dots, slashes)
  s = s.replace(/^[\d\u00BC-\u00BE\u2150-\u215E\/\.\-\s]+/, '').trim();
  // Strip leading unit
  s = s.replace(/^(?:cups?|c|tbsps?|tablespoons?|tbs|tb|tsps?|teaspoons?|t|ts|grams?|g|kg|kilograms?|oz|ounces?|lbs?|pounds?|mls?|milliliters?|l|liters?|litres?|pinches?|handfuls?|cloves?|sprigs?|bunches?|sticks?|slices?|cans?|jars?|packages?|pkgs?|boxes?|bags?|bottles?|pieces?)\s+(?:of\s+)?/i, '').trim();
  // Strip parenthetical descriptors and trailing comma-clause
  s = s.replace(/\s*\([^)]*\)/g, '');
  s = s.split(',')[0].trim();
  // Strip prep adjectives
  const tokens = s.split(/\s+/).filter(Boolean).filter(w => !PREP_WORDS.has(w));
  if (tokens.length === 0) return '';
  // Singularize the last token only
  const last = tokens[tokens.length - 1];
  let lastOut = last;
  if (/ies$/.test(last)) lastOut = last.slice(0, -3) + 'y';
  else if (/oes$/.test(last)) lastOut = last.slice(0, -2);
  else if (/(?:ses|xes|ches|shes)$/.test(last)) lastOut = last.slice(0, -2);
  else if (/[^s]s$/.test(last) && last.length > 2) lastOut = last.slice(0, -1);
  tokens[tokens.length - 1] = lastOut;
  return tokens.join(' ').trim();
}

// Build a quick-lookup Set of normalized pantry names.
function pantryNameSet(items) {
  const set = new Set();
  if (!Array.isArray(items)) return set;
  for (const it of items) {
    const core = pantryCore(it && it.name);
    if (core) set.add(core);
  }
  return set;
}

// Conservative test — exact match on the normalized core, no fuzzy fallback.
function matchesPantry(rawIngredient, pantrySet) {
  if (!pantrySet || pantrySet.size === 0) return false;
  const core = pantryCore(rawIngredient);
  return !!core && pantrySet.has(core);
}

// ---------- URL ingestion ----------
const PROXIES = [
  { name: 'corsproxy',  build: u => 'https://corsproxy.io/?' + encodeURIComponent(u),         headers: {} },
  { name: 'jina',       build: u => 'https://r.jina.ai/' + u,                                  headers: { 'X-Return-Format': 'html' } },
  { name: 'allorigins', build: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u), headers: {} },
  { name: 'codetabs',   build: u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u), headers: {} },
];

async function fetchWithTimeout(url, options = {}, ms = 12000, externalSignal) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), ms);
  let onExternalAbort = null;
  if (externalSignal) {
    if (externalSignal.aborted) controller.abort();
    else {
      onExternalAbort = () => controller.abort();
      externalSignal.addEventListener('abort', onExternalAbort);
    }
  }
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(id);
    if (externalSignal && onExternalAbort) externalSignal.removeEventListener('abort', onExternalAbort);
  }
}

// Cancellation primitive used by imports. Each await boundary in the import pipeline
// calls this; if the user cancelled, we throw a "cancelled" error that callers
// recognise and treat as "abandon the work, save nothing."
function throwIfAborted(signal) {
  if (signal && signal.aborted) {
    const e = new Error('cancelled');
    e.cancelled = true;
    throw e;
  }
}
function isCancelled(e, signal) {
  return !!(e && (e.cancelled || e.name === 'AbortError')) || !!(signal && signal.aborted);
}

// ---------- Duplicate detection (used at import time) ----------
function normalizeRecipeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    const path = u.pathname.replace(/\/+$/, '');
    return host + path;
  } catch (e) {
    return (url || '').trim().toLowerCase();
  }
}

function normalizeRecipeTitle(title) {
  return (title || '').toLowerCase().trim().replace(/\s+/g, ' ');
}

// Used when the user chooses "Import anyway" on a duplicate prompt. If the candidate's
// title actually collides with an existing one, append the lowest unused (N) suffix
// (starting at 2) so the new recipe stays visibly distinct. Otherwise — e.g. the
// duplicate was URL-matched and the title is already unique — leave the title alone.
// Strips any trailing "(N)" already on the candidate so we don't end up with "Foo (2) (3)".
function titleWithLowestUnusedSuffix(candidateTitle, existing) {
  const raw = (candidateTitle || '').trim();
  if (!raw) return raw;
  const rawNorm = normalizeRecipeTitle(raw);
  const rawCollides = (existing || []).some(r => r && r.title && normalizeRecipeTitle(r.title) === rawNorm);
  if (!rawCollides) return raw;

  const stripped = raw.replace(/\s*\(\d+\)\s*$/, '').trim() || raw;
  const baseNorm = normalizeRecipeTitle(stripped);
  const used = new Set();
  for (const r of existing || []) {
    if (!r || !r.title) continue;
    const t = String(r.title).trim();
    const tNorm = normalizeRecipeTitle(t);
    if (tNorm === baseNorm) { used.add(1); continue; }
    const m = t.match(/^(.+?)\s*\((\d+)\)\s*$/);
    if (m && normalizeRecipeTitle(m[1]) === baseNorm) {
      const n = parseInt(m[2], 10);
      if (Number.isFinite(n) && n >= 1) used.add(n);
    }
  }
  let n = 2;
  while (used.has(n)) n++;
  return stripped + ' (' + n + ')';
}

// Returns { type, match } or null. Two outcomes:
//  - type 'duplicate'  : block import (same URL, or same title with no URL conflict)
//  - type 'ambiguous'  : warn but allow (same title but different URLs — could legitimately be
//                        two different recipes that happen to share a name)
function findDuplicateRecipe(candidate, existing) {
  const candUrl = normalizeRecipeUrl(candidate.source);
  const candTitle = normalizeRecipeTitle(candidate.title);
  let ambiguous = null;
  for (const r of existing) {
    if (!r || r.id === candidate.id) continue;
    const rUrl = normalizeRecipeUrl(r.source);
    const rTitle = normalizeRecipeTitle(r.title);
    if (candUrl && rUrl && candUrl === rUrl) {
      return { type: 'duplicate', match: r };
    }
    if (candTitle && candTitle === rTitle) {
      if (candUrl && rUrl && candUrl !== rUrl) {
        if (!ambiguous) ambiguous = { type: 'ambiguous', match: r };
        continue;
      }
      return { type: 'duplicate', match: r };
    }
  }
  return ambiguous;
}

async function fetchAndParseRecipe(targetUrl, signal) {
  const attempts = [];
  let bestBody = null;
  for (const proxy of PROXIES) {
    if (signal && signal.aborted) throwIfAborted(signal);
    try {
      const res = await fetchWithTimeout(proxy.build(targetUrl), { headers: proxy.headers }, 12000, signal);
      if (!res.ok) { attempts.push(proxy.name + ' status ' + res.status); continue; }
      const html = await res.text();
      if (!html || html.length < 200) { attempts.push(proxy.name + ' empty'); continue; }
      if (!bestBody) bestBody = html;
      const recipe = tryParseRecipeFromHtml(html, targetUrl);
      if (recipe) return recipe;
      attempts.push(proxy.name + ' no recipe data');
    } catch (e) {
      if (isCancelled(e, signal)) throw e;
      attempts.push(proxy.name + ' ' + (e.name === 'AbortError' ? 'timeout' : 'failed'));
    }
  }
  throwIfAborted(signal);
  console.warn('Recipe fetch failed:', attempts.join('; '));
  // Distinguish "reached the page but no clean structured data" (AI text-extraction can help)
  // from "couldn't reach the page at all" (only the user's own browser / manual paste can help).
  if (bestBody) {
    const err = new Error('Couldn\u2019t find structured recipe data on this page.');
    err.code = 'no_structured_data';
    err.pageBody = bestBody;
    throw err;
  }
  const err = new Error('Couldn\u2019t reach this page \u2014 the site may be blocking access. Try pasting the page text instead.');
  err.code = 'fetch_failed';
  throw err;
}

// Turn fetched page HTML into readable plain text for AI extraction. Keeps light
// structure (newlines for blocks, dashes for list items) and drops scripts/styles.
function htmlToText(html) {
  if (!html) return '';
  let s = String(html);
  s = s.replace(/<script[\s\S]*?<\/script>/gi, ' ')
       .replace(/<style[\s\S]*?<\/style>/gi, ' ')
       .replace(/<noscript[\s\S]*?<\/noscript>/gi, ' ');
  s = s.replace(/<li[^>]*>/gi, '\n- ');
  s = s.replace(/<\/(p|div|h[1-6]|tr|section|article|ul|ol|li)\s*>/gi, '\n')
       .replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<[^>]+>/g, ' ');
  s = s.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
       .replace(/&gt;/gi, '>').replace(/&#39;|&apos;/gi, "'").replace(/&quot;/gi, '"');
  s = s.replace(/[ \t]{2,}/g, ' ').replace(/\n[ \t]+/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  return s;
}

function tryParseRecipeFromHtml(html, sourceUrl) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch (e) { return null; }

  const credit = extractPageCredit(doc, sourceUrl);

  // 1. JSON-LD path (preferred). If JSON-LD has any ingredients or steps, use it.
  const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
  let data = null;
  for (const script of scripts) {
    try {
      const parsed = JSON.parse(script.textContent);
      const found = findRecipeInJsonLd(parsed);
      if (found) { data = found; break; }
    } catch (e) {}
  }
  if (data) {
    const recipe = mapJsonLdToRecipe(data, sourceUrl, credit);
    if (recipe.ingredients.length || recipe.steps.length) return recipe;
    // JSON-LD found but completely empty — fall through to fallback.
  }

  // 2. HTML fallback: heuristic scraping of visible page content.
  const fb = parseHtmlFallback(doc, sourceUrl);
  if (fb) {
    fb.sourceName = credit.siteName;
    fb.sourceAuthor = credit.author;
  }
  return fb;
}

// ---------- Source credit extraction ----------
// Pull the page's site name and author so the recipe can carry an
// "Adapted from [Author] at [Site]" credit. Site name falls back to the domain.
function creditDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch (e) { return ''; }
}

function extractPageCredit(doc, sourceUrl) {
  let siteName = '';
  const og = doc.querySelector('meta[property="og:site_name"]');
  if (og && og.content) siteName = cleanText(og.content);
  if (!siteName) siteName = creditDomain(sourceUrl);

  let author = '';
  const metaAuthor = doc.querySelector('meta[name="author"]');
  if (metaAuthor && metaAuthor.content) author = cleanText(metaAuthor.content);

  return { siteName, author };
}

// JSON-LD author can be a string, {name}, or arrays of either.
function extractJsonLdName(a) {
  if (!a) return '';
  if (typeof a === 'string') return cleanText(a);
  if (Array.isArray(a)) {
    for (const item of a) { const n = extractJsonLdName(item); if (n) return n; }
    return '';
  }
  if (typeof a === 'object' && a.name) return extractJsonLdName(a.name);
  return '';
}

function findRecipeInJsonLd(data) {
  if (!data) return null;
  if (Array.isArray(data)) {
    for (const item of data) { const f = findRecipeInJsonLd(item); if (f) return f; }
    return null;
  }
  if (typeof data === 'object') {
    const t = data['@type'];
    if (t === 'Recipe' || (Array.isArray(t) && t.includes('Recipe'))) return data;
    if (data['@graph']) return findRecipeInJsonLd(data['@graph']);
  }
  return null;
}

function mapJsonLdToRecipe(data, sourceUrl, credit) {
  const ingredients = (data.recipeIngredient || data.ingredients || [])
    .map(s => cleanRecipeText(String(s)))
    .filter(Boolean);

  const steps = extractSteps(data.recipeInstructions).map(cleanRecipeText).filter(Boolean);

  let servings = '';
  if (data.recipeYield) {
    servings = cleanRecipeText(Array.isArray(data.recipeYield) ? String(data.recipeYield[0]) : String(data.recipeYield));
  }

  let description = data.description || '';
  description = cleanRecipeText(description.replace(/<[^>]+>/g, ''));
  if (description.length > 220) description = description.slice(0, 217).trim() + '…';

  // Credit: recipe-level JSON-LD author beats page meta; publisher name beats
  // og:site_name; domain is the last resort (already baked into credit.siteName).
  const author = extractJsonLdName(data.author) || (credit && credit.author) || '';
  const siteName = extractJsonLdName(data.publisher) || (credit && credit.siteName) || creditDomain(sourceUrl);

  return {
    id: newId(),
    title: cleanRecipeText(data.name) || 'Untitled recipe',
    description,
    status: 'wantto',
    servings,
    prepTime: parseDuration(data.prepTime),
    cookTime: parseDuration(data.cookTime),
    source: sourceUrl,
    sourceName: siteName,
    sourceAuthor: author,
    image: extractRecipeImage(data.image),
    ingredients,
    steps,
    notes: '',
    tags: extractTags(data),
    createdAt: Date.now(),
  };
}

// JSON-LD image can be a string, an array, an ImageObject {url}, or arrays thereof.
function extractRecipeImage(img) {
  if (!img) return '';
  if (typeof img === 'string') return img.trim();
  if (Array.isArray(img)) {
    for (const i of img) { const u = extractRecipeImage(i); if (u) return u; }
    return '';
  }
  if (typeof img === 'object') {
    if (typeof img.url === 'string') return img.url.trim();
    if (Array.isArray(img.url)) return extractRecipeImage(img.url);
    if (img.contentUrl) return extractRecipeImage(img.contentUrl);
  }
  return '';
}

function extractSteps(raw) {
  if (!raw) return [];
  if (typeof raw === 'string') {
    return raw.split(/\n+/).map(s => cleanText(s)).filter(Boolean);
  }
  if (Array.isArray(raw)) {
    return raw.flatMap(extractSteps);
  }
  if (typeof raw === 'object') {
    const type = raw['@type'];
    if (type === 'HowToSection' && raw.itemListElement) {
      return extractSteps(raw.itemListElement);
    }
    if (raw.text) return [cleanText(stripHtml(raw.text))];
    if (raw.name) return [cleanText(stripHtml(raw.name))];
  }
  return [];
}

function parseDuration(iso) {
  if (!iso || typeof iso !== 'string') return '';
  const m = iso.match(/^PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return '';
  const h = parseInt(m[1] || '0', 10);
  const min = parseInt(m[2] || '0', 10);
  if (h && min) return h + ' hr ' + min + ' min';
  if (h) return h + ' hr';
  if (min) return min + ' min';
  return '';
}

function decodeEntities(s) {
  if (typeof s !== 'string' || s.indexOf('&') === -1) return s;
  const ta = document.createElement('textarea');
  ta.innerHTML = s;
  return ta.value;
}

function stripHtml(s) {
  return String(s).replace(/<[^>]+>/g, ' ');
}

function cleanText(s) {
  if (!s) return '';
  return decodeEntities(String(s)).replace(/\s+/g, ' ').trim();
}

function extractTags(data) {
  const tags = [];
  const collect = (val) => {
    if (Array.isArray(val)) val.forEach(collect);
    else if (typeof val === 'string') {
      val.split(',').forEach(t => {
        const trimmed = cleanText(t).toLowerCase();
        if (trimmed && trimmed.length < 30) tags.push(trimmed);
      });
    }
  };
  collect(data.recipeCategory);
  collect(data.recipeCuisine);
  collect(data.keywords);
  return [...new Set(tags)];
}

// ---------- HTML scraping fallback (used when JSON-LD is missing or empty) ----------
// Container selectors for common recipe-card plugins. Detecting one of these lets us
// scope ingredient/step searches to just the canonical recipe block, avoiding inline
// mentions of other recipes elsewhere on the page.
const FALLBACK_RECIPE_SELECTORS = [
  '.wprm-recipe-container', '.wprm-recipe',
  '.tasty-recipes', '.tasty-recipe',
  '.mv-create-card', '.mv-recipe',
  '.simple-recipe', '.jetpack-recipe',
  '.recipe-card', '.recipe-summary',
  '[id^="itr-recipe-"]',
  '[id^="recipe-card-"]',
  '[itemtype*="schema.org/Recipe"]', '[itemtype*="Recipe"]',
];

function parseHtmlFallback(doc, sourceUrl) {
  const container = findFallbackRecipeContainer(doc);
  const articleScope = doc.querySelector('article') || doc.querySelector('main') || doc.body;
  const scope = container || articleScope;

  let ingredients = findFallbackIngredients(scope);
  if (ingredients.length === 0 && scope !== articleScope) {
    ingredients = findFallbackIngredients(articleScope);
  }

  let steps = findFallbackSteps(scope);
  if (steps.length === 0 && scope !== articleScope) {
    steps = findFallbackSteps(articleScope);
  }

  if (ingredients.length === 0 || steps.length === 0) return null;

  const title = findFallbackTitle(doc);
  const description = findFallbackDescription(doc);
  const servings = findFallbackServings(scope) || findFallbackServings(articleScope);
  const prepTime = findFallbackTime(scope, 'prep') || findFallbackTime(articleScope, 'prep');
  const cookTime = findFallbackTime(scope, 'cook') || findFallbackTime(articleScope, 'cook');

  return {
    id: newId(),
    title: title || 'Untitled recipe',
    description,
    status: 'wantto',
    servings,
    prepTime,
    cookTime,
    source: sourceUrl,
    ingredients: ingredients.map(cleanRecipeText).filter(Boolean),
    steps: steps.map(cleanRecipeText).filter(Boolean),
    notes: '',
    tags: [],
    createdAt: Date.now(),
  };
}

function findFallbackRecipeContainer(doc) {
  for (const sel of FALLBACK_RECIPE_SELECTORS) {
    try {
      const found = doc.querySelector(sel);
      if (found) return found;
    } catch (e) {}
  }
  return null;
}

function findFallbackTitle(doc) {
  const article = doc.querySelector('article') || doc.querySelector('main') || doc.body;
  const h1 = article && article.querySelector ? article.querySelector('h1') : null;
  if (h1) {
    const t = cleanText(h1.textContent);
    if (t) return t;
  }
  const og = doc.querySelector('meta[property="og:title"]');
  if (og && og.content) return cleanText(og.content);
  const t = doc.querySelector('title');
  if (t) {
    // Strip common " | Site", " - Site", " \u2013 Site" suffixes
    let title = t.textContent || '';
    title = title.replace(/\s*[|\u2013\u2014\-]\s*[^|\u2013\u2014\-]+$/, '').trim();
    return cleanText(title);
  }
  return '';
}

function findFallbackDescription(doc) {
  const og = doc.querySelector('meta[property="og:description"]');
  if (og && og.content) {
    const t = cleanText(og.content);
    return t.length > 220 ? t.slice(0, 217) + '\u2026' : t;
  }
  const meta = doc.querySelector('meta[name="description"]');
  if (meta && meta.content) {
    const t = cleanText(meta.content);
    return t.length > 220 ? t.slice(0, 217) + '\u2026' : t;
  }
  return '';
}

function pullItemText(els) {
  return [...els]
    .map(el => cleanText(el.textContent))
    .filter(t => t && t.length > 1);
}

function findFallbackIngredients(scope) {
  if (!scope || !scope.querySelectorAll) return [];

  // 1. Microdata
  let items = scope.querySelectorAll('[itemprop="recipeIngredient"], [itemprop="ingredients"]');
  if (items.length >= 2) return pullItemText(items);

  // 2. Common plugin classes
  items = scope.querySelectorAll(
    '.wprm-recipe-ingredient, .tasty-recipe-ingredient, .tasty-recipes-ingredients li, ' +
    '.mv-create-ingredients li, .simple-recipe-ingredient, .recipe-ingredient, ' +
    '.recipe-ingredients li, .ingredients-list li, .ingredient-list li'
  );
  if (items.length >= 2) return pullItemText(items);

  // 3. Generic class-name heuristic
  items = scope.querySelectorAll('li[class*="ingredient"], div[class*="ingredient"], span[class*="ingredient"]');
  if (items.length >= 2) return pullItemText(items);

  // 4. Heading + list pattern (Smitten Kitchen style)
  const list = findListAfterHeading(scope, /^\s*ingredients?\s*[:.]?\s*$/i);
  if (list && list.length >= 2) return list;

  return [];
}

function findFallbackSteps(scope) {
  if (!scope || !scope.querySelectorAll) return [];

  // 1. Microdata — recipeInstructions can be a wrapper containing children, or be on each child
  const instrEls = scope.querySelectorAll('[itemprop="recipeInstructions"]');
  if (instrEls.length === 1) {
    const innerSteps = instrEls[0].querySelectorAll('[itemprop="text"], li, p');
    if (innerSteps.length >= 1) {
      const out = pullItemText(innerSteps);
      if (out.length) return out;
    }
    const single = cleanText(instrEls[0].textContent);
    if (single) return single.split(/\.\s+(?=[A-Z])/).filter(s => s.length > 15);
  } else if (instrEls.length > 1) {
    const out = pullItemText(instrEls);
    if (out.length) return out;
  }

  // 2. Common plugin classes
  let items = scope.querySelectorAll(
    '.wprm-recipe-instruction-text, .wprm-recipe-instruction, ' +
    '.tasty-recipes-instructions li, .mv-create-instructions li, .simple-recipe-step, ' +
    '.recipe-instructions li, .instructions-list li, .directions li, .recipe-directions li'
  );
  if (items.length >= 1) return pullItemText(items);

  // 3. Heading + content pattern
  const stepKeywords = /^\s*(?:instructions?|directions?|method|preparation|how\s+to\s+make|steps|to\s+make|to\s+prepare|make\s+the\s)/i;
  const found = findListOrParasAfterHeading(scope, stepKeywords);
  if (found && found.length >= 1) return found;

  return [];
}

function findListAfterHeading(scope, regex) {
  const candidates = scope.querySelectorAll('h1, h2, h3, h4, h5, h6, p');
  for (const h of candidates) {
    const text = (h.textContent || '').trim();
    if (text.length === 0 || text.length > 40) continue;
    if (!regex.test(text)) continue;
    // For <p>, require a bold/strong child to count as a heading-style label
    if (h.tagName.toLowerCase() === 'p' && !h.querySelector('strong, b')) continue;

    let next = h.nextElementSibling;
    let safety = 0;
    while (next && safety < 5) {
      const tag = next.tagName;
      if (tag === 'UL' || tag === 'OL') {
        const items = [...next.querySelectorAll(':scope > li')]
          .map(li => cleanText(li.textContent))
          .filter(t => t && t.length > 1);
        if (items.length >= 1) return items;
      }
      next = next.nextElementSibling;
      safety++;
    }
  }
  return null;
}

function findListOrParasAfterHeading(scope, regex) {
  // Look at real headings; also accept bold-only paragraphs that act as headings
  const candidates = scope.querySelectorAll('h1, h2, h3, h4, h5, h6, p');
  for (const h of candidates) {
    const text = (h.textContent || '').trim();
    if (text.length === 0 || text.length > 80) continue;
    if (!regex.test(text)) continue;
    // For <p>, require a bold/strong child to treat it as a heading-style label
    const tag = h.tagName.toLowerCase();
    if (tag === 'p' && !h.querySelector('strong, b')) continue;

    const collected = [];
    let next = h.nextElementSibling;
    let safety = 0;
    while (next && safety < 60) {
      const tagN = next.tagName;
      if (/^H[1-6]$/.test(tagN)) break;
      if (tagN === 'OL' || tagN === 'UL') {
        const items = [...next.querySelectorAll(':scope > li')]
          .map(li => cleanText(li.textContent))
          .filter(t => t && t.length > 1);
        if (items.length >= 1) return items;
      }
      if (tagN === 'P' || tagN === 'DIV') {
        const t = cleanText(next.textContent);
        // Long enough to be a real step (not a caption, ad slot, or sidebar header)
        if (t && t.length > 25) collected.push(t);
      }
      next = next.nextElementSibling;
      safety++;
    }
    if (collected.length >= 1) return collected;
  }
  return null;
}

function findFallbackServings(scope) {
  if (!scope || !scope.querySelector) return '';
  const semantic = scope.querySelector(
    '[itemprop="recipeYield"], .wprm-recipe-servings, .tasty-recipes-yield, ' +
    '.recipe-yield, .servings, .recipe-servings'
  );
  if (semantic) {
    const t = cleanText(semantic.textContent).slice(0, 60);
    if (t) return t;
  }
  const all = (scope.textContent || '').slice(0, 4000);
  const m = all.match(/(?:yields?|makes|serves|servings)\s*[:\-]?\s*([0-9][^\n,;.]{0,40})/i);
  if (m) {
    const candidate = cleanText(m[1]);
    if (candidate.length > 0 && candidate.length < 50) return candidate;
  }
  return '';
}

function findFallbackTime(scope, kind) {
  if (!scope || !scope.querySelector) return '';
  const semantic = scope.querySelector(
    '[itemprop="' + kind + 'Time"], ' +
    '.wprm-recipe-' + kind + '_time, ' +
    '.tasty-recipes-' + kind + '-time, ' +
    '.recipe-' + kind + '-time'
  );
  if (semantic) {
    const t = cleanText(semantic.textContent);
    if (t) return normalizeFallbackTime(t);
  }
  const all = (scope.textContent || '').slice(0, 4000);
  const re = new RegExp(kind + '\\s*time[:\\s]+([0-9][^\\n,;.]{0,30})', 'i');
  const m = all.match(re);
  if (m) return normalizeFallbackTime(m[1]);
  return '';
}

function normalizeFallbackTime(s) {
  return cleanText(s)
    .slice(0, 30)
    .replace(/\bhours?\b/gi, 'hr')
    .replace(/\bhrs\b/gi, 'hr')
    .replace(/\bminutes?\b/gi, 'min')
    .replace(/\bmins\b/gi, 'min');
}

// ---------- AI (Claude API integration) ----------
// The Anthropic API key is entered in the app via AI status on the home page
// and stored in this browser's localStorage. It is never sent anywhere except Anthropic.
const ANTHROPIC_MODEL = 'claude-sonnet-4-6'; // try claude-haiku-4-5-20251001 (cheaper/faster) or claude-opus-4-7 (highest quality)
const ANTHROPIC_API_URL = 'https://api.anthropic.com/v1/messages';
const AI_KEY_STORAGE = 'recipes:anthropic_api_key';

function getApiKey() {
  try {
    return (localStorage.getItem(AI_KEY_STORAGE) || '').trim();
  } catch (e) {
    return '';
  }
}

function setApiKey(key) {
  try {
    localStorage.setItem(AI_KEY_STORAGE, (key || '').trim());
    return true;
  } catch (e) {
    console.error('Could not save API key:', e);
    return false;
  }
}

function clearApiKey() {
  try {
    localStorage.removeItem(AI_KEY_STORAGE);
  } catch (e) {}
}

function maskApiKey(key) {
  if (!key) return '';
  if (key.length <= 12) return '\u2022\u2022\u2022\u2022' + key.slice(-2);
  return key.slice(0, 7) + '\u2022\u2022\u2022\u2022' + key.slice(-4);
}

function isAiConfigured() {
  return getApiKey().length > 0;
}

// Reusable: send a prompt to the LLM and get the text response back.
// options: { system?, model?, maxTokens?, temperature? }
async function callAnthropic(userMessage, options = {}) {
  const apiKey = getApiKey();
  if (!apiKey) {
    throw new Error('No API key configured. Open AI status on the home page to add your key.');
  }
  const body = {
    model: options.model || ANTHROPIC_MODEL,
    max_tokens: options.maxTokens || 2000,
    messages: [{ role: 'user', content: userMessage }],
  };
  if (options.system) body.system = options.system;
  if (typeof options.temperature === 'number') body.temperature = options.temperature;
  if (options.tools) body.tools = options.tools;

  let res;
  try {
    res = await fetch(ANTHROPIC_API_URL, {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
      signal: options.signal,
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new Error('Network error: could not reach the Anthropic API. ' + (e.message || ''));
  }

  const text = await res.text();
  let parsed = null;
  try { parsed = JSON.parse(text); } catch (e) {}

  if (!res.ok) {
    const msg = (parsed && parsed.error && parsed.error.message) || text || ('HTTP ' + res.status);
    throw new Error('API error (' + res.status + '): ' + msg);
  }
  if (!parsed) throw new Error('API returned a non-JSON response.');

  const out = (parsed.content || [])
    .filter(c => c && c.type === 'text')
    .map(c => c.text)
    .join('\n')
    .trim();
  if (!out) throw new Error('API returned an empty response.');
  return out;
}

// Proof-of-life check used by the debug status UI.
async function aiHealthCheck() {
  const reply = await callAnthropic(
    'Reply with exactly this single word and nothing else: ready',
    { maxTokens: 20, temperature: 0 }
  );
  const ok = /\bready\b/i.test(reply);
  return { ok, reply };
}

// ---------- AI find & compare: dish name -> candidate recipes + comparison ----------
const FIND_COMPARE_SYSTEM = `You help someone decide which version of a dish to cook. Use web search to find the best, most credible versions of the dish they name, then lay out how the versions differ so a home cook can pick one fast.

PROCESS:
1. Search the web for top versions of the dish from real recipe sites (food blogs, newspaper cooking sections, established recipe sites). Run a few searches if needed to get a good spread.
2. Pick the 5-10 strongest candidates. Fewer is fine if there aren't enough solid distinct options — never pad with weak or duplicate entries. Each candidate MUST be a real page you found in search results, with its exact URL.
3. Prefer variety: different takes on the dish, not five near-identical versions. If the dish name is ambiguous, include a reasonable spread of interpretations and mention the ambiguity in "note".

OUTPUT: Return ONLY valid JSON as your final answer. No commentary outside the JSON, no markdown fences. Exact shape:

{
  "note": "optional one-liner, e.g. a did-you-mean nudge for ambiguous dishes; empty string if none",
  "overview": "2-3 sentences, concrete: the main axes these versions differ on (ingredients, technique)",
  "plainOverview": "2-3 sentences, written like a friend texting: the real-life trade-offs across these options",
  "candidates": [
    {
      "title": "the recipe's actual title",
      "source": "site name, e.g. Smitten Kitchen",
      "url": "exact full URL from search results",
      "hook": "one line: what makes this version distinct at a glance",
      "compare": "1-2 short sentences, concrete: the distinguishing ingredient(s) or technique vs the other candidates",
      "plain": "1-2 short sentences, friend-texting tone: how fussy it is, roughly how long, what the flavor payoff is"
    }
  ]
}

RULES:
- URLs must be exact URLs from your search results. Never invent or guess a URL.
- Keep every text field short and scannable. This is for a fast decision, not an essay.
- "compare" fields should genuinely contrast with the OTHER candidates ("only one that uses X", "skips the Y step the others have").
- "plain" fields: no jargon, no ingredient lists — fussiness, time, flavor trade-off.
- Do not include paywalled-only candidates if free options exist, but a well-known paywalled source (e.g. NYT Cooking) is acceptable as one of several.`;

// One-shot search + compare. Returns { note, overview, plainOverview, candidates: [...] }
// or null when nothing usable came back. Re-throws on cancellation.
async function aiFindAndCompare(dishQuery, signal) {

// Parses the AI's JSON response defensively, tolerating stray code fences or preamble.
function parseExtractionJson(reply) {
  if (typeof reply !== 'string') return null;
  let s = reply.trim();
  const fenced = s.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
  if (fenced) s = fenced[1].trim();
  // If the model put text before/after JSON, grab the first {...} block.
  if (!s.startsWith('{')) {
    const first = s.indexOf('{');
    const last = s.lastIndexOf('}');
    if (first >= 0 && last > first) s = s.slice(first, last + 1);
  }
  try { return JSON.parse(s); } catch (e) { return null; }
}

function formatRecipeForFold(recipe) {
  const lines = [];
  lines.push('Title: ' + (recipe.title || ''));
  if (recipe.description) lines.push('Description: ' + recipe.description);
  if (recipe.servings) lines.push('Servings: ' + recipe.servings);

  if (recipe.cookTime) lines.push('Cook time: ' + recipe.cookTime);
  lines.push('');
  lines.push('Ingredients:');
  (recipe.ingredients || []).forEach(i => lines.push('- ' + i));
  lines.push('');
  lines.push('Method:');
  (recipe.steps || []).forEach((s, i) => lines.push((i + 1) + '. ' + s));

- The step amounts should sum to (or come close to) the total. If they don't, OMIT that ingredient.
- stepNumber is 1-indexed, matching the step order shown.
- Return {"partials": []} when nothing is split.`;

// Best-effort: returns a raw partials array from the AI, or [] on failure / no AI.
// Never throws — partial detection is non-blocking for imports.
async function aiDetectPartials(recipe, signal) {
  try {
    if (!isAiConfigured()) return [];
    const lines = [];

    const reply = await callAnthropic(lines.join('\n'), {
      system: PARTIAL_DETECTION_SYSTEM,
      maxTokens: 1500,
      temperature: 0,
      signal,
    });
    const data = parseExtractionJson(reply);
    if (!data || !Array.isArray(data.partials)) return [];

  } catch (e) {
    if (isCancelled(e, signal)) throw e;
    console.warn('AI partial detection failed:', e);

  }
}

// Validate each partial against the actual recipe — drop anything we can't trust:
//   - ingredient must be present in the list with a numeric measured total
//   - units must match
//   - step indices must be in range
//   - the step amounts must sum to ~the listed total (±20%) and there must be 2+ uses
// Better to show nothing than a wrong "of X total."
function reconcilePartials(raw, recipe) {
  if (!Array.isArray(raw)) return [];
  const stepCount = (recipe.steps || []).length;
  const totals = {};
  for (const ing of recipe.ingredients || []) {
    if (isSectionHeader(ing)) continue;
    const parsed = parseIngredient(ing);
    if (parsed.kind !== 'parsed' || !parsed.ingredient) continue;
    const name = parsed.ingredient.toLowerCase().trim();
    const unit = parsed.unit || '';
    if (!totals[name]) totals[name] = { amount: parsed.amount, unit };
    else if (totals[name].unit === unit) totals[name].amount += parsed.amount;
    else totals[name] = null; // conflicting units → can't reconcile
  }

  const out = [];
  for (const p of raw) {
    if (!p || !p.ingredient || !Array.isArray(p.uses)) continue;
    const name = String(p.ingredient).toLowerCase().trim();
    const recipeTotal = totals[name];
    if (!recipeTotal) continue;
    const aiUnit = String(p.totalUnit || '').toLowerCase().trim();
    if (aiUnit && aiUnit !== recipeTotal.unit) continue;
    if (!aiUnit && recipeTotal.unit) continue;

    const validUses = [];
    let sumUses = 0;
    for (const u of p.uses) {
      const stepIndex = (u.stepNumber != null) ? (Number(u.stepNumber) - 1) : Number(u.stepIndex);
      if (!Number.isFinite(stepIndex) || stepIndex < 0 || stepIndex >= stepCount) continue;
      const amt = Number(u.amount);
      if (!Number.isFinite(amt) || amt <= 0) continue;
      validUses.push({ stepIndex, amount: amt });
      sumUses += amt;
    }
    if (validUses.length < 2) continue;
    if (recipeTotal.amount <= 0) continue;
    const ratio = sumUses / recipeTotal.amount;
    if (ratio < 0.7 || ratio > 1.15) continue;

    out.push({
      ingredient: name,
      totalAmount: recipeTotal.amount,
      totalUnit: recipeTotal.unit,
      uses: validUses,
    });
  }
  return out;
}

If a line has no obvious error, return it BYTE-FOR-BYTE the same as input. Better to under-fix than over-fix.

Each output array MUST have the same number of entries as the input, in the same order.`;

// Best-effort: returns a corrected text bundle, or null on failure / no AI.
// Re-throws on cancellation.
async function aiTypoCorrectRecipe(recipe, signal) {
  try {
    if (!isAiConfigured()) return null;
    const input = {
      title: recipe.title || '',
      description: recipe.description || '',
      ingredients: Array.isArray(recipe.ingredients) ? recipe.ingredients : [],
      steps: Array.isArray(recipe.steps) ? recipe.steps : [],
    };
    // Skip the call entirely if there's effectively nothing to proofread.
    if (!input.title && !input.description && input.ingredients.length === 0 && input.steps.length === 0) return null;

    const reply = await callAnthropic(JSON.stringify(input), {
      system: TYPO_FIX_SYSTEM,
      maxTokens: 4000,
      temperature: 0,
      signal,
    });
    const data = parseExtractionJson(reply);
    if (!data || typeof data !== 'object') return null;
    if (!Array.isArray(data.ingredients) || !Array.isArray(data.steps)) return null;
    // Length must match — a length change means the model added/removed lines.
    if (data.ingredients.length !== input.ingredients.length) return null;
    if (data.steps.length !== input.steps.length) return null;

    return {
      title: typeof data.title === 'string' ? data.title : input.title,
      description: typeof data.description === 'string' ? data.description : input.description,
      ingredients: data.ingredients.map(s => String(s)),
      steps: data.steps.map(s => String(s)),
    };
  } catch (e) {
    if (isCancelled(e, signal)) throw e;
    console.warn('AI typo correction failed:', e);
    return null;
  }
}

// True iff the corrected bundle differs from the original anywhere.
function typoDiffsExist(orig, corrected) {
  if (!orig || !corrected) return false;
  if ((orig.title || '') !== (corrected.title || '')) return true;
  if ((orig.description || '') !== (corrected.description || '')) return true;
  if (JSON.stringify(orig.ingredients || []) !== JSON.stringify(corrected.ingredients || [])) return true;
  if (JSON.stringify(orig.steps || []) !== JSON.stringify(corrected.steps || [])) return true;
  return false;
}

const GUIDED_SYSTEM = `You rewrite recipe instructions in a warm, conversational, teaching tone — the voice of Bon Appétit or Half Baked Harvest.

VOICE:
- Warm and conversational, like a friend guiding someone through the dish.
- Add brief "why" notes where they're genuinely helpful (e.g., "until translucent — you want them soft, not browned"). Don't pad every step with explanations.
- Complete sentences, friendly teaching tone.

STRICT RULES:
- Keep ALL numerical specifics exact: temperatures, times, weights, volumes, oven settings, quantities.
- Don't change ingredients, techniques, or sequence.
- One input step = one output step. Never merge, split, add, or drop steps.
- Reference ingredient amounts the way the original does. If the original says "the olive oil" use "the olive oil"; if it says "2 tbsp olive oil" use the amount.
- Don't restate the title. Don't add closings like "Enjoy!" unless the original has them.

OUTPUT FORMAT:
Reply with ONLY a JSON object: {"steps": ["step 1 text", "step 2 text", ...]}
No prose before or after. No code fences. Just the JSON.
Each step is plain prose — no numbering, no "Step 1:" prefix.`;

const QUICK_SYSTEM = `You rewrite recipe instructions in a tight, technical, cookbook style — the voice of Serious Eats or a professional kitchen manual.

VOICE:
- Compact. No fluff, no padding, no explanations of basics.
- Use precise chef vocabulary where appropriate: sweat, brown, deglaze, reduce, fold, whip, sear, render, temper.
- Trim adjectives. Lean verbs. Assume the cook is competent.
- Still complete sentences — terse, not telegraphic.

STRICT RULES:
- Keep ALL numerical specifics exact: temperatures, times, weights, volumes, oven settings, quantities.
- Don't change ingredients, techniques, or sequence.
- One input step = one output step. Never merge, split, add, or drop steps.
- Reference ingredient amounts the way the original does.
- Don't restate the title. Don't add closings.

OUTPUT FORMAT:
Reply with ONLY a JSON object: {"steps": ["step 1 text", "step 2 text", ...]}
No prose before or after. No code fences. Just the JSON.
Each step is plain prose — no numbering, no "Step 1:" prefix.`;

const METHOD_STYLE_SYSTEMS = { guided: GUIDED_SYSTEM, quick: QUICK_SYSTEM };

// Check that the rewrite preserves most of the numerical content from the original.
// Returns true if at least 70% of original numbers appear in the rewrite.
function validateNumericPreservation(originalSteps, rewriteSteps) {
  const originalText = originalSteps.join(' ');
  const rewriteText = rewriteSteps.join(' ');
  const originalNums = originalText.match(/\d+(?:[\.\/]\d+)?/g) || [];
  if (originalNums.length === 0) return true;
  let preserved = 0;
  for (const n of originalNums) {
    if (rewriteText.indexOf(n) !== -1) preserved++;
  }
  return (preserved / originalNums.length) >= 0.7;
}

async function generateStyledMethod(recipe, style, signal) {
  if (!isAiConfigured()) return null;
  const system = METHOD_STYLE_SYSTEMS[style];
  if (!system) return null;

  const steps = Array.isArray(recipe.steps) ? recipe.steps.filter(s => s && s.trim()) : [];
  if (steps.length === 0) return null;

  const ingredientsBlock = (recipe.ingredients || [])
    .filter(Boolean)
    .map(i => '- ' + i)
    .join('\n');
  const numbered = steps.map((s, i) => (i + 1) + '. ' + s).join('\n');

  const userMessage =
    'Title: ' + (recipe.title || 'Untitled') + '\n\n' +
    (ingredientsBlock ? 'Ingredients:\n' + ingredientsBlock + '\n\n' : '') +
    'Original steps:\n' + numbered + '\n\n' +
    'Rewrite each step in the style described in your instructions. Output only the JSON object.';

  let raw;
  try {
    raw = await callAnthropic(userMessage, {
      system,
      maxTokens: 3000,
      temperature: 0.5,
      signal,
    });
  } catch (e) {
    if (isCancelled(e, signal)) throw e;
    console.warn('[' + style + '] method generation failed:', e.message);
    return null;
  }

  // Defensive JSON extraction
  let jsonText = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
  if (jsonText[0] !== '{') {
    const start = jsonText.indexOf('{');
    const end = jsonText.lastIndexOf('}');
    if (start >= 0 && end > start) jsonText = jsonText.slice(start, end + 1);
  }

  let parsed;
  try {
    parsed = JSON.parse(jsonText);
  } catch (e) {
    console.warn('[' + style + '] JSON parse failed:', e.message);
    return null;
  }
  if (!parsed || !Array.isArray(parsed.steps)) return null;

  const out = parsed.steps
    .map(s => (typeof s === 'string' ? s.trim() : ''))
    .filter(Boolean);

  if (out.length !== steps.length) {
    console.warn('[' + style + '] step count mismatch (' + out.length + ' vs ' + steps.length + ')');
    return null;
  }

  if (!validateNumericPreservation(steps, out)) {
    console.warn('[' + style + '] numeric content not preserved adequately');
    return null;
  }

  return out;
}

// Generate both styles in parallel. Returns { guidedSteps, quickSteps } where either may be null.
async function generateBothStyles(recipe, signal) {
  const [guidedResult, quickResult] = await Promise.allSettled([
    generateStyledMethod(recipe, 'guided', signal),
    generateStyledMethod(recipe, 'quick', signal),
  ]);
  return {
    guidedSteps: guidedResult.status === 'fulfilled' && guidedResult.value ? guidedResult.value : null,
    quickSteps:  quickResult.status === 'fulfilled' && quickResult.value ? quickResult.value : null,
  };
}
